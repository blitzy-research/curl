# Cargo build configuration for the curl Rust workspace: curl-rs-lib (the
# protocol engine), curl-rs (the command-line binary) and curl-rs-ffi (the C
# ABI shim, and the only crate that emits a cdylib and a staticlib).
#
# This file is deliberately small. It carries per-target link configuration and
# nothing else; every other build decision belongs to Cargo.toml,
# rust-toolchain.toml, clippy.toml, rustfmt.toml or deny.toml.
#
# What it replaces: the two C build systems computed a per-platform link line at
# configure time - Autotools assembling libcurl_la_LDFLAGS_EXTRA out of four
# independent conditionals in lib/Makefile.am, CMake reaching the same place
# through cache options and target properties. Every one of those four flags was
# conditional on a feature test, and exactly one of the four has a Rust
# counterpart: the soname derived from lib/Makefile.soname. The other three are
# absent here by decision, recorded under "Restraint" below.
#
# Why there is no global build section
#
# Workspace-wide rustflags apply to every target at once, and the link arguments
# this workspace needs are not portable across all four targets. The soname
# argument is the clearest case: it is GNU-ld-specific, Apple's ld64 does not
# accept it, and GNU ld symmetrically rejects Apple's -install_name equivalent
# with a hard "unrecognised option" error rather than a warning - measured here
# with GNU ld 2.45. One global flag list therefore cannot be correct for all
# four mandated targets, so everything below is scoped to a [target.<triple>]
# table. Do not "simplify" this file by hoisting a setting into a global build
# section.
#
# There is no default-target key either. Pinning one default triple would
# silently narrow the four-target matrix and change what a bare `cargo build`
# produces; the committed Cargo.lock is resolved once to serve all four.
#
# The target matrix
#
# Four triples, and only four. The tables below appear in the same order as
# rust-toolchain.toml's `targets` array and deny.toml's [graph] targets array,
# so the toolchain that is provisioned, the dependency graph that is audited and
# the link configuration that is applied describe one identical set:
#
#   x86_64-unknown-linux-gnu    host, and the primary CI target
#   aarch64-unknown-linux-gnu   cross-compiled; the linker is configured here
#   x86_64-apple-darwin         no linker configured here; see its table
#   aarch64-apple-darwin        likewise, plus one escalated open item
#
# All four are 64-bit, and that is load-bearing. The C ABI shim reaches curl's
# four variadic entry points - curl_easy_setopt, curl_easy_getinfo,
# curl_multi_setopt and curl_share_setopt - with a non-variadic extern "C"
# function taking one trailing pointer, because true C-variadic functions are
# unstable at the workspace MSRV. That design carries a curl_off_t through a
# single register-width slot, which is sound only where off_t fits a register.
# 32-bit portability is consequently a DELIBERATE FORFEIT and must not be
# claimed: no 32-bit triple belongs in this file.
#
# The shared library's identity: libcurl.so.4
#
# A drop-in replacement must satisfy the same dynamic-linker lookups as the
# library it replaces, so the cdylib must carry DT_SONAME = libcurl.so.4. Cargo
# sets no soname by default; it has to be configured explicitly.
#
# The 4 is derived, never chosen. lib/Makefile.soname sets VERSIONCHANGE=12,
# VERSIONADD=0 and VERSIONDEL=8, giving libtool -version-info 12:0:8, and
# libtool's SONAME is lib.so.(current-age) = 12 - 8 = 4, with the full file name
# libcurl.so.4.8.0. lib/CMakeLists.txt computes the same 4 from the same file by
# its own arithmetic, and configure.ac substitutes it a third time. The number
# is recorded once for the whole workspace as Cargo.toml's
# [workspace.metadata.curl-rs] soname key, so nothing here invents it.
#
# Why the soname link argument is NOT set here
#
# [target.<triple>].rustflags are not artifact-scoped. They reach every artifact
# built for that triple - the `curl` binary, the `curlinfo` binary and, when host
# equals target, build script executables - and not only curl-rs-ffi's cdylib.
# Setting the soname here was measured to stamp DT_SONAME = libcurl.so.4 onto
# both command-line binaries as well as the shared library, with no link error
# and no warning. That is not cosmetic: ldconfig and the RPM and dpkg dependency
# generators read DT_SONAME, so both binaries would advertise that they PROVIDE
# libcurl.so.4.
#
# The correctly-scoped mechanism is a cdylib-only link argument emitted from
# curl-rs-ffi/build.rs. Quoted verbatim, because a comment naming a directive
# the build script does not emit sends the next reader hunting for the wrong
# string:
#
#   println!("cargo:rustc-link-arg-cdylib=-Wl,--soname=libcurl.so.4");
#
# with a `-Wl,-install_name,@rpath/libcurl.4.dylib` form on macOS. Note the
# suffix placement: `rustc-link-arg-cdylib`, NOT the older
# `rustc-cdylib-link-arg` it is easily confused with. Cargo accepts
# both, so that confusion cannot be caught by a build failure -- only by
# reading curl-rs-ffi/build.rs, which emits the former at two sites. The
# emitted form is the one measured to work: `readelf -d` on the resulting
# library reports "Library soname: [libcurl.so.4]", a C consumer linked with
# `-lcurl` records `DT_NEEDED: libcurl.so.4`, and neither binary carries a
# soname.
#
# One further constraint on that line, because it is easy to get wrong: Cargo's
# newer
# double-colon spelling of build script directives postdates the declared MSRV
# floor and fails outright on cargo 1.75 with "unsupported output in build
# script". The single-colon form above is the only spelling that satisfies the
# MSRV and the pinned channel at once.
#
# The consequence for this file is worth stating plainly: it sets NO rustflags
# at all, for any target. Every remaining setting is a linker or a
# cross-toolchain variable. That is a stronger guarantee than carefully scoping
# a flag would have been, because a rustflags key that does not exist can never
# reach an artifact it was not meant for.
#
# Restraint - what is deliberately absent, and why
#
# None of the eight items below is spelled out as a literal flag token anywhere
# in this file, not even in a comment: a rejected linker or codegen flag written
# out verbatim invites a later editor to enable it and invites policy scanners to
# false-positive. Each is identified by its mechanism instead.
#
#   1. A linker version script, and any global/local symbol filtering. A
#      user-supplied version script handed to rustc through a link argument was
#      measured NOT to control Rust exports - the test symbols stayed exported
#      and objdump -T tagged them Base, while readelf -V confirmed the script
#      had been read. rustc's internal export list takes precedence, so
#      versioned symbol names of the form name@@CURL_... are unreachable through
#      a link argument alone. That is a documented deviation, not a defect: curl
#      versions symbols only when configured to, and CMake leaves the option OFF
#      by default, so an unversioned export set is exactly curl's supported
#      --disable-versioned-symbols mode.
#
#   2. Any export-hiding mechanism - no visibility flag, no library-exclusion
#      flag, no export regex. A cdylib exercising Vec, String, format!,
#      Box::into_raw and C-string literals was built and inspected here: two
#      dynamic text symbols, both curl_*, nothing leaked, no version nodes.
#      Modern rustc emits only what is declared #[no_mangle] pub extern "C", so
#      export parity comes from declaration discipline, not link-time filtering.
#      The set that discipline must reproduce is lib/libcurl.def's 100 curl_*
#      names; asserting that count is the ABI gate's job, not this file's.
#
#   3. The two libtool/platform flags guarded by
#      CURL_LT_SHLIB_USE_NO_UNDEFINED and CURL_LT_SHLIB_USE_MIMPURE_TEXT. Both
#      are artifacts of libtool and of platforms outside the four-target matrix,
#      and neither has a Cargo analogue. Transliterating the C link line
#      mechanically would drag them in; they are omitted knowingly.
#
#   4. Any performance or code-generation tuning: no host-CPU tuning, no
#      optimisation-level override, no link-time-optimisation setting, no
#      codegen-unit tuning. Performance is an explicit non-goal of this work,
#      and a flag that tunes for the build machine's microarchitecture destroys
#      reproducibility. Profile settings belong to Cargo.toml, whose release
#      profile is deliberately conservative - LTO off, unwinding preserved,
#      overflow checks on - so that a panic stays contained at the FFI boundary
#      instead of aborting a host process. Nothing here may contradict that.
#
#   5. A deny-warnings lint flag. The lint gate applies it on the command line
#      so that a lint failure names itself instead of hiding inside a build log.
#      Putting it here would destroy that attribution and force a full rebuild
#      between the build leg and the clippy leg, because rustflags participate
#      in Cargo's fingerprint.
#
#   6. Any unstable nightly compiler flag, the sanitiser and standard-library
#      rebuild flags included. Those two belong to the AddressSanitizer leg,
#      .github/workflows/rust-asan.yml, and Miri's to
#      .github/workflows/rust-miri.yml. Both files are on disk, and both name
#      `cargo +nightly` per invocation, which overrides the toolchain pin.
#      This is not merely a matter of placement: rust-toolchain.toml pins
#      channel = "1.97.1", a STABLE channel, and deliberately leaves nightly
#      unpinned. An unstable flag in these rustflags would be rejected by the
#      pinned toolchain and would break EVERY build, not just those two legs.
#
#   7. No registry, source-replacement, mirror, vendoring or network table, and
#      no command-alias table. The workspace has no private registry, no
#      vendored crate and no internal feed; deny.toml allows exactly one source,
#      the public crates.io index. Configuration that silently redirects where
#      code comes from has no place in a supply chain audited by cargo-deny.
#
#   8. No build-profile table. Profiles belong to Cargo.toml, which owns them
#      for the whole workspace; a second definition here would be a second
#      source of truth, and the two would drift.

# x86_64-unknown-linux-gnu - host and primary CI target
[target.x86_64-unknown-linux-gnu]

# Nothing to set. This is the host triple, so rustc's default `cc` driver is
# already correct, and the one flag that has a Rust counterpart - the soname -
# belongs to the cdylib alone and is emitted from curl-rs-ffi/build.rs.
#
# The table is kept, deliberately empty, so that all four mandated triples are
# visible in one place and a future per-target setting has an obvious home.

# aarch64-unknown-linux-gnu - cross-compiled
[target.aarch64-unknown-linux-gnu]

# Genuinely new configuration, with nothing to transliterate: Autotools handled
# cross-building only by disabling run-time probes and never named a cross
# linker. Cargo needs one named outright, so it is named. Verified in this
# environment at 15.2.0, linking an aarch64 ELF shared object with the correct
# soname.
linker = "aarch64-linux-gnu-gcc"

# That is the only key in this file that changes how rustc links anything, and
# it is the reason the file exists. No rustflags here either: the soname is
# emitted per-artifact from curl-rs-ffi/build.rs, so the shared library's
# identity is independent of which machine built it and of whether the build was
# native or cross.
#
# What keeps this leg working: accepting the default features of the TLS and
# QUIC crates pulls in aws-lc-rs, whose vendored C and assembly require CMake
# and NASM and are hostile to cross builds; it would also link two different
# cryptographic providers into one binary and, through a post-quantum key
# exchange enabled by default, change the bytes of the TLS ClientHello relative
# to the C implementation. Pinning ring across rustls, tokio-rustls and quinn
# removes the vendored toolchain requirement and keeps exactly one provider in
# the graph.
#
# That pinning lives in Cargo.toml - default-features = false plus an explicit
# "ring" feature on rustls, tokio-rustls, quinn and russh - and THIS FILE MUST
# NOT UNDO IT. Nothing added here may reintroduce aws-lc-rs or otherwise alter
# TLS behaviour. The audit is `cargo tree -i aws-lc-rs` reporting the crate
# absent while `cargo tree -i ring` reports it present; the committed Cargo.lock
# agrees, with ring 0.17.14 as the sole provider and no aws-lc-sys entry.

# x86_64-apple-darwin
[target.x86_64-apple-darwin]

# No rustflags, and that is a decision, not an omission. The GNU-ld soname
# argument must NOT reach this triple: Apple's ld64 does not accept it, and the
# mismatch is a hard link failure rather than a quiet degradation. rustc was
# observed to append a configured link argument verbatim to the `cc` invocation
# it builds here, so a wrongly-scoped flag really would reach the Apple linker.
#
# Apple's equivalent, -install_name, is deliberately not set either. It is a
# different thing - an absolute install path for the dylib rather than a bare
# version-suffixed base name - so no single value is correct for a build tree, a
# Homebrew prefix and /usr/lib at once. It is also how the C build already
# behaves: CMake realises Apple versioning through the VERSION and SOVERSION
# target properties and lets the generator derive -install_name, never emitting
# the GNU-ld argument. Reproducing that faithfully means letting the toolchain
# derive it.
#
# No linker key either. A cross-link to this triple needs an Apple SDK and a
# Mach-O capable linker; cargo-zigbuild or a macOS runner supplies both, and
# each selects its own linker. Naming one here would break the other.

# aarch64-apple-darwin
[target.aarch64-apple-darwin]

# Everything said for x86_64-apple-darwin applies unchanged: no soname-style
# argument, no linker key, Apple versioning left to the toolchain.
#
# This triple additionally carries an open, UNRESOLVED ABI conflict. The C ABI
# shim reaches curl's four variadic entry points with a non-variadic extern "C"
# function taking one trailing pointer, because C-variadic functions are
# unstable at the workspace MSRV of 1.75. That is sound on System V and AAPCS64
# register conventions, where variadic arguments travel in registers and caller
# and callee agree. Apple's arm64 ABI passes variadic arguments ON THE STACK, so
# a non-variadic Rust callee reached through a variadic C prototype reads a
# register the caller never populated - and THE FAILURE IS SILENT: no
# Linux-only test run can observe it, and this container has no Apple SDK.
#
# NO SETTING IN THIS FILE FIXES THIS. There is no linker flag, no rustflag and
# no linker choice that changes an argument-passing convention. It is a user
# decision with three options: raise the MSRV to reach the stabilised
# c_variadic feature (which also means changing clippy.toml's msrv and
# rust-toolchain.toml's channel), drop this triple from the matrix, or accept
# that this one target's variadic entry points are unsupported and say so. No
# workaround is attempted here. The triple is listed because the target matrix
# mandates it, not because the variadic entry points are known good on it.
#
# WHERE THAT IS ENFORCED, so a reader of this file is not left with a caveat and
# no consequence: curl-rs-ffi/build.rs REFUSES to build this triple,
# unconditionally. It formerly accepted an opt-in through
# CURL_RS_A4_VARIADIC_DECISION; that bypass has been removed, because it could
# emit the artifact carrying the fault described above, and setting the variable
# is now itself refused. The choice belongs to whoever set the requirements, and
# the two options that remain - raise the MSRV, or drop the triple - are edits
# to this repository rather than environment settings. So this leg of the
# four-target gate is red on purpose, carrying the refusal's diagnosis, rather
# than green with a footnote.

# Cross toolchain for the aarch64 Linux leg
#
# The ring provider compiles C and assembly primitives through cc-rs: pinning
# ring keeps this leg free of aws-lc-rs's vendored toolchain, but ring still
# needs a working cross C compiler and archiver. Declaring them makes the cross
# toolchain a declared input rather than something cc-rs infers from a
# target-prefix guess.
#
# These are per-target variable names, so they are inert for every other triple,
# and they are not marked forced: an environment that already defines one - a
# cross container, or `cross` itself - keeps its own value. All three were
# verified present in this environment at 15.2.0.
#
# CC_aarch64_unknown_linux_gnu is read by one more consumer than cc-rs, and the
# agreement is enforced rather than hoped for: curl-rs-ffi/build.rs renders
# `curl-config --cc` and takes this value in preference to its own per-target
# table, so its check_cross_toolchain_agreement asserts that this value, the
# linker key above and that table all name the same command. A cross consumer
# following curl-config must reach the toolchain rustc will actually link with.
[env]
CC_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-gcc"
CXX_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-g++"
AR_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-ar"

# Future-incompatibility reporting - contained, not silenced
#
# Cargo re-prints a future-incompatibility notice for russh 0.54.5 at the end of
# every build. It is a warning-class diagnostic, and specification 0.8.4's first
# gate is a ZERO-WARNING build, so the two cannot both stand as they are. The
# previous arrangement resolved that in the workflow, by enumerating this notice
# in an allow-list and calling the result a pass. That redefined the gate into a
# zero-UNAPPROVED-warning gate, and the allow-list matched cargo's generic
# sentence rather than the crate name, so a future-incompatibility in any OTHER
# dependency would have been swallowed by it too.
#
# The condition itself cannot be resolved at this commit, and that was measured
# rather than assumed. russh 0.54.6 declares a NON-OPTIONAL dependency on
# libcrux-ml-kem ^0.0.3; on a 0.0.x version that requirement admits 0.0.3 alone,
# and 0.0.3 is YANKED on crates.io, so the graph does not resolve - and
# deny.toml sets yanked = "deny" independently. Moving further forward raises the
# minimum Rust version above the floor: russh 0.55.0 and the whole 0.62 line
# declare 1.85. The crate is pinned exactly by specification 0.5.1 and cannot be
# patched here. It is genuine dependency debt, recorded as such in Cargo.toml.
#
# So the notice is contained at its source, which is where cargo provides for it.
# `frequency = "never"` stops the per-build re-print; it does not discard the
# report, which stays available in full through
# `cargo report future-incompatibilities`. The workflow now runs exactly that
# and asserts the debt is confined to the crate named above, so a
# future-incompatibility arriving in a different dependency FAILS the leg
# instead of being absorbed by a pattern match. Containment is verified rather
# than assumed, and the zero-warning gate is one a normal build can pass.
[future-incompat-report]
frequency = "never"
