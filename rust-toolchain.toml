# Rust toolchain pin for the curl workspace: curl-rs-lib, curl-rs, curl-rs-ffi.
#
# This file replaces the compiler detection the two superseded C build systems
# performed - Autotools probing for one of ten C compilers and deriving a flag
# set for whichever answered, CMake branching on CMAKE_C_COMPILER_ID. Nothing
# below guesses: rustup selects exactly the toolchain named here and provisions
# exactly the components and targets listed, so the compiler is a declared
# input to the build rather than a discovered property of the machine.
#
# Companion configuration, deliberately kept in separate files:
#   Cargo.toml          rust-version (the MSRV floor), edition, dependencies
#   clippy.toml         msrv, held equal to Cargo.toml's rust-version
#   rustfmt.toml        formatting, read by the rustfmt component below
#   .cargo/config.toml  per-target linkers for the cross-compiled targets
#   deny.toml           supply-chain policy, over this same target list

[toolchain]

# An exact stable version, deliberately not the floating "stable" string. A
# floating channel cannot guarantee that every contributor and every CI leg
# agree, because it resolves to whichever stable release happens to be current
# that week: a lint or a build that is clean today can fail tomorrow with no
# commit in between. 1.97.1 is the stable toolchain this design was verified
# against - the FFI ABI probes, the symbol-export measurements and the
# dependency resolution recorded in Cargo.lock were all run on it.
#
# This pin is NOT the minimum supported Rust version. The workspace floor is
# rust-version = "1.75" in Cargo.toml, mirrored by msrv = "1.75" in
# clippy.toml, and those two enforce it independently of this file: Cargo
# rejects a toolchain older than rust-version, and clippy's MSRV-sensitive
# lints reject constructs newer than msrv under -D warnings. Building on 1.75
# must therefore also succeed, which is why the 1.75.0 toolchain is installed
# alongside this pin and checked with `cargo +1.75.0 build --workspace`.
#
# Measured against the committed Cargo.lock rather than assumed, and measured
# end-to-end rather than on a necessary condition alone.
#
# The floor is REACHED, not merely declared. Two lockfile pins hold it there,
# and they are recorded because a bare `cargo update` would undo them and the
# resulting failure would look like a mystery:
#
#   getrandom 0.3.3, not 0.3.4  - 0.3.4 swapped its WASI backend to `wasip2`,
#                                 whose manifest declares rust-version 1.87.
#   wasi      0.14.0, not 0.14.7 - 0.14.7 reaches `wit-bindgen 0.57.1`, which
#                                 is EDITION 2024. Cargo 1.75 cannot PARSE an
#                                 edition-2024 manifest, so the failure would
#                                 surface for the whole graph, nowhere near its
#                                 cause.
#
# Both sit on cc -> [build-dependencies] jobserver -> cfg(windows) getrandom ->
# cfg(wasm32 + wasi + p2) wasi, so neither entered the build graph of any target
# listed below in the first place; the obstruction was that `cargo metadata`
# resolves every platform at once and parses manifests it will never build. With
# the pins in place BOTH PACKAGES ARE ABSENT FROM THE LOCKFILE ENTIRELY, so the
# workaround that absence makes unnecessary is worth naming: `--no-deps` would
# also sidestep a dependency manifest cargo cannot parse, but on this tree the
# FULL form succeeds - `cargo +1.75.0 metadata --locked --offline` over the 321
# locked packages exits 0 and reports zero declaring a rust-version above 1.75
# and zero with an edition above 2021. The tightest declaration in the lock is
# 1.75 itself, held by this workspace's three crates and by russh 0.54.5 with
# its two helper crates, so the floor is exact rather than generous.
#
# And the workspace's OWN code compiles there too, which is the half a
# dependency scan cannot show: `cargo +1.75.0 build --locked --offline
# --workspace` and `cargo +1.75.0 check --locked --offline --workspace
# --all-targets` both exit 0 on this tree. Neither is warning-free - the
# notices are `never used` items awaiting the modules that call them - and
# none of the notices concerns the language version.
#
# Per-target confirmation as well, which is the sufficient condition rather than
# the necessary one. Filtering the graph with `--filter-platform` over each of
# the four mandated triples, with and without the implementable feature set,
# gives eight graphs of 258 to 261 packages whose maximum declared
# rust-version is 1.75 in every case - this workspace's own three crates,
# nothing above them - and none of the eight contains an edition-2024
# package:
#
#   FEATS=altsvc,brotli,cookies,doh,ftp,gzip,hsts,http2,http3,ssh,\
#   websockets,zstd,negotiate,memdebug
#   for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
#            x86_64-apple-darwin aarch64-apple-darwin; do
#     cargo metadata --offline --format-version 1 --filter-platform "$t"
#     cargo metadata --offline --format-version 1 --filter-platform "$t" \
#                    --features "$FEATS"
#   done
#
# The explicit fourteen-name list is used INSTEAD OF `--all-features`, and
# deliberately so: `hickory-dns` is a reserved name that no crate can currently
# back, and enabling it is a hard build failure raised in
# curl-rs-lib/src/lib.rs. Cargo offers no "all features except one" selector, so
# the implementable set is enumerated. The root Cargo.toml records the
# measurement behind that reservation.
#
# WHAT THE MEASUREMENT DOES NOT ESTABLISH, so it is not overread: the workspace
# members are only partly delivered at this commit. The floor is verified for
# the code that EXISTS, and must be re-verified as the protocol, transfer, CLI
# and FFI trees land, because code written later can reach for constructs newer
# than 1.75. A one-off run is the wrong instrument for that; the four-target
# build matrix and `clippy::incompatible_msrv` are the right ones.
#
# Earlier revisions of Cargo.toml, clippy.toml, curl-rs/Cargo.toml and
# curl-rs-ffi/Cargo.toml described a looser resolution - 46 packages above 1.75,
# a floor of 1.88, home 0.5.12 pulled in by russh, clap_lex 1.1.0 as an
# edition-2024 crate. Every one of those figures is refuted by the committed
# lock, which resolves home 0.5.9 (rust-version 1.70.0) and clap_lex 1.0.1
# (1.74) - but they are an accurate description of what a FRESH RESOLVE still
# produces, because russh asks for `home ^0.5` and clap_builder for
# `clap_lex ^1.0.0` and both ranges admit the edition-2024 releases. The pins
# were tightened after that stale measurement was written (russh 0.54.5,
# home 0.5.9, quinn-proto 0.11.14, icu_normalizer 1.5.0), the committed lockfile
# is the only thing holding them there, and all five files now agree.
#
# One further caveat, stated precisely because it is easy to misread as an MSRV
# violation: newer releases of three mandated crates - clap 4.6.4, quinn 0.11.11
# and russh 0.62.4 - and of rand 0.10.2 declare 1.85. That is exactly why the
# specification selects the newest version of each crate that satisfies 1.75
# rather than the newest outright. Advancing any pin to its latest release
# breaks this floor; read the note beside a pin before changing it.
#
# Cargo.toml's rust-version comment carries the same record together with the
# restore commands.
#
# The floor stays at 1.75 either way, because it was mandated: raising a
# minimum supported version is a decision for whoever set it, not a
# build-configuration change to be made here. If it is raised, raise
# Cargo.toml's rust-version, clippy.toml's msrv and this channel together.
#
# Nightly is deliberately not pinned here. Two validation gates need it, and
# both name it explicitly per invocation, which overrides this pin:
#   cargo +nightly miri test -p curl-rs-lib
#     .github/workflows/rust-miri.yml, undefined-behaviour gate. DELIVERED.
#   cargo +nightly build -Zbuild-std -Zsanitizer=address
#     AddressSanitizer over the FFI surface,
#     .github/workflows/rust-asan.yml. DELIVERED. Earlier revisions of this
#     note, on both sides of it, described that workflow as still owed; it is
#     on disk, and it installs its own dated nightly with rust-src for exactly
#     the reason given below.
# Both of those legs also need rust-src, which is precisely why rust-src is
# absent from `components` below: it belongs to the nightly toolchain they
# install for themselves, not to the stable toolchain that builds and ships.
# The delivered Rust workflows at this commit are exactly rust-build.yml,
# rust-clippy.yml, rust-miri.yml and rust-audit.yml, alongside hygiene.yml.
#
# One open item bears directly on this line. The FFI shim reaches curl's four
# variadic entry points - curl_easy_setopt, curl_easy_getinfo,
# curl_multi_setopt and curl_share_setopt - with a non-variadic extern "C"
# function taking one trailing pointer, because true C-variadic functions are
# unstable on 1.75. That is sound on the System V and AAPCS64 register
# conventions, but Apple's arm64 ABI passes variadic arguments on the stack,
# so on aarch64-apple-darwin the callee would read a register the caller never
# filled, and it would do so silently. The remedy is the stabilised c_variadic
# feature, which requires a toolchain newer than 1.75. The MSRV floor and the
# aarch64-apple-darwin target therefore cannot both be honoured as written, and
# that conflict is unresolved: a decision to raise the MSRV for that reason
# would change this channel and the floor above together.
channel = "1.97.1"

# Exactly the three components the validation gates require, and no more:
#
#   rustfmt             `cargo fmt --all --check`, configured by rustfmt.toml
#   clippy              `cargo clippy --workspace -- -D warnings`, the lint
#                       gate, configured by clippy.toml
#   llvm-tools-preview  `cargo llvm-cov`, the coverage gate at >= 80% line
#                       coverage over curl-rs-lib/src/protocols/ and
#                       curl-rs-lib/src/transfer/; it is what supplies
#                       llvm-profdata and llvm-cov to the coverage run
#
# Nothing further is listed. Every component named here is downloaded on every
# fresh checkout, and rust-src - the only other candidate - is needed solely
# by the nightly Miri and -Zbuild-std ASan legs described above, which provide
# it themselves on the toolchain they select.
components = ["rustfmt", "clippy", "llvm-tools-preview"]

# The four mandated compilation targets. deny.toml's [graph] targets lists the
# same four in the same order, so the supply-chain gate audits precisely the
# set that is built.
#
# All four are 64-bit, and that is load-bearing rather than incidental. The
# single-trailing-pointer varargs design described above carries a curl_off_t
# through one register-width slot, which is only sound where off_t fits a
# register. 32-bit portability is therefore a deliberate forfeit rather than an
# oversight, and must not be claimed; no 32-bit triple belongs in this list.
#
# aarch64-unknown-linux-gnu is cross-compiled, either through cross 0.2.5 or
# with the aarch64-linux-gnu-gcc linker and matching CC/CXX/AR configured in
# .cargo/config.toml. Pinning the ring cryptographic provider across rustls,
# tokio-rustls and quinn - instead of letting aws-lc-rs in through default
# features - is what keeps this leg buildable at all: aws-lc-rs vendors C and
# assembly and would add CMake and NASM to the cross build's requirements.
#
# aarch64-apple-darwin carries the one unresolved ABI hazard in this workspace.
# It is the only target where the Apple variadic mismatch noted above bites,
# and the failure mode is silence: no Linux-only test run can observe it. This
# container also has no Apple SDK, so both Apple targets compile here but need
# cargo-zigbuild or a macOS runner to link. The triple is listed because the
# target matrix mandates it, not because the varargs entry points are known
# good on it.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

# rustup's own default profile: rustc, cargo, rust-std, rust-docs, plus rustfmt
# and clippy. The conservative choice, and it is consulted only when rustup has
# to install the toolchain from scratch - the components and targets above are
# additive on top of whatever the profile brings, so no gate depends on which
# profile is named here.
profile = "default"
