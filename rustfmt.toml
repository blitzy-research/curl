# rustfmt configuration for the curl Rust workspace: curl-rs-lib, curl-rs and
# curl-rs-ffi.
#
# This file and clippy.toml together replace scripts/checksrc.pl, curl's
# hand-rolled C style enforcer. Five of checksrc.pl's 52 categories describe
# layout rather than C syntax, and all five are answered here:
#
#   line length, against checksrc's max_column = 79   -> max_width
#   TAB characters not allowed                        -> hard_tabs
#   wrong start column, against checksrc's indent = 2 -> tab_spaces
#   trailing whitespace                               -> no key needed;
#                                                        rustfmt strips it
#                                                        unconditionally
#   multiple spaces where one belongs                 -> no key needed
#
# The remaining categories are C syntax rules with no Rust meaning and are not
# reproduced, except that copyright headers are answered by `reuse lint` and
# the banned-C-function table is addressed in clippy.toml.
#
# Companion configuration, deliberately kept in separate files:
#   Cargo.toml          edition, mirrored below; rust-version; dependencies
#   rust-toolchain.toml the exact toolchain whose rustfmt reads this file
#   clippy.toml         msrv and lint thresholds
#   .editorconfig       editor behaviour, for every file type and not only
#                       Rust
#   .cargo/config.toml  per-target linkers
#   deny.toml           supply-chain policy

# Stable options only
#
# rust-toolchain.toml pins an exact stable channel, so a nightly-gated key here
# would not take effect - and worse, would print "can't set `<key>`, unstable
# features are only available in nightly channel" on every `cargo fmt`, which
# the zero-warning build gate does not tolerate. Every key below was verified by
# writing it into this file on the pinned toolchain and confirming rustfmt's
# stderr stayed empty. Verifying instead with `rustfmt --config key=value` does
# NOT work: that path accepts nightly-only keys in silence.
#
# Every key below also predates the declared MSRV, so nobody building at the
# floor sees "Unknown configuration option" either.

# edition - rustfmt's own default is "2015"
#
# Held equal to Cargo.toml's `edition = "2021"`, which every member inherits.
# It has to be stated here as well, because rustfmt invoked directly - as
# `rustfmt path/to/file.rs`, which is how editor integrations reach it -
# defaults to edition 2015 and never reads Cargo.toml. On 2015 `async`, `await`
# and `dyn` are not keywords, so an `async fn` or a `Box<dyn Protocol>` is
# misparsed rather than merely misformatted, and this workspace is built on
# both. `cargo fmt` passes the manifest edition on the command line, so the two
# routes agree only for as long as this value tracks Cargo.toml.
edition = "2021"

# max_width - default 100
#
# curl's convention is 79 columns, from scripts/checksrc.pl's max_column and
# from .editorconfig's max_line_length for `[*.{c,h}]`. 80 rather than 79
# because rustfmt's max_width is inclusive, so 80 admits a line of exactly 80
# columns where checksrc.pl admits 79; it is also the conventional Rust
# expression of the same discipline. Nothing in the repository mandates a width
# for Rust - .editorconfig has no `[*.rs]` section - so this is a deliberate
# carry-over of the C tree's discipline, chosen so that a reviewer reading
# lib/http.c beside its Rust counterpart has both fit one window.
#
# Two limits, so that nobody reads more into this key than it delivers:
#
#   * It bounds CODE, not comments. wrap_comments is nightly-only, so comment
#     interiors are left exactly as written and no formatter run will narrow a
#     long doc comment.
#   * It is a target, not an assertion. error_on_line_overflow is nightly-only
#     too, so rustfmt silently leaves a line it cannot break - a long string
#     literal, a long path - over the limit. That is the outcome this project
#     wants; see the format_strings note below.
max_width = 80

# hard_tabs - default false, restated as a declared contract
#
# Three independent gates already say the same thing - checksrc.pl makes a TAB a
# violation outright, .editorconfig sets `indent_style = space` for `[*]`, and
# scripts/spacecheck.pl reports "content: has tab" for any file outside a narrow
# allow-list that excludes `*.rs` and `*.toml`. It is restated because a
# formatter configuration that leaves the project's oldest and least negotiable
# whitespace rule to a default is trusting a default with a rule that predates
# it.
hard_tabs = false

# tab_spaces - default 4, restated as a declared contract
#
# Four, which is Rust's universal convention. This deliberately differs from the
# C tree's two, and the difference is not a conflict: checksrc.pl's indent
# governs C files only, and .editorconfig scopes its 2 to `[*.{c,h}]` while
# giving Perl four. The repository already carries per-language indentation and
# has no `[*.rs]` section for this value to contradict.
tab_spaces = 4

# newline_style - default "Auto"
#
# "Auto" copies whatever line ending a file already begins with, so a file that
# arrives with CRLF keeps it. "Unix" writes LF unconditionally, which is what
# scripts/spacecheck.pl requires of every tracked file that is not a `.bat` or
# `.sln`. This is the formatter agreeing in advance with a gate that would
# otherwise fail the build.
#
# One clarification, because this workspace is unusually sensitive to CRLF:
# curl's fixtures compare exact wire bytes and HTTP framing is CRLF-delimited.
# That CRLF lives inside string literals and in transfer content - it is
# protocol data, not source formatting - and this key does not touch it.
newline_style = "Unix"

# use_small_heuristics - default "Default", restated as a declared contract
#
# The conservative choice, deliberately not tuned. It sets the sub-widths that
# decide when a construct which would fit on one line is nevertheless broken
# vertically: fn_call_width, attr_fn_like_width, struct_lit_width,
# struct_variant_width, array_width, chain_width and the two single-line
# if-else/let-else widths.
#
# One measured fact, because the widely repeated version of it is wrong: these
# sub-widths do NOT rescale when max_width is lowered. At max_width = 80 they
# stay at the values derived from the default 100. So max_width = 80 above is a
# hard-limit change, not a wholesale reflow policy, and every sub-width remains
# at or below it. Tuning them is a separate decision with a much larger diff,
# and no evidence asks for it.
use_small_heuristics = "Default"

# reorder_imports - default true, restated as a declared contract
#
# The migration replaces one blanket include with many narrow imports: the C
# tree reaches shared state through `#include "urldata.h"` in nearly every
# translation unit, and the transformation rule for it is one import per type
# actually used. That trades one include for a block of imports in every file of
# curl-rs-lib, and a block of imports is only reviewable if its order is
# mechanical - an added dependency then appears as a one-line diff at its sorted
# position instead of wherever the author happened to type it.
#
# The mirror-image key, `imports_granularity`, would merge those lines into
# nested groups. It is nightly-only; see the list below.
reorder_imports = true

# reorder_modules - default true, restated as a declared contract
#
# The same reason at a larger scale. curl-rs-lib alone declares module trees for
# protocols, conn, transfer, tls, dns, auth, proxy, url, cookies, mime, headers,
# crypto and util, and the crate root that lists them is the one file every
# subtree touches when it grows. Sorted `mod` lines keep that file's history
# readable. Note the deliberate limit: this reorders sibling `mod` declarations,
# it does not reorder items or move code between files.
reorder_modules = true

# use_field_init_shorthand - default false
#
# The one key here that changes tokens rather than whitespace: it rewrites
# `Point { x: x, y: y }` as `Point { x, y }`. It is set because the alternative
# is a formatter that produces code the lint gate then rejects -
# clippy::redundant_field_names is warn-by-default and the gate is
# `-D warnings`, so at rustfmt's default of false `cargo fmt` would report a
# file clean that `cargo clippy` fails.
#
# The rewrite is a pure identity: the shorthand is defined to mean the long
# form, so nothing observable changes. That matters more than usual here,
# because this workspace's contract is its output bytes.
use_field_init_shorthand = true

# Nightly-only options: considered, and none set
#
# Each was written into this file on the pinned stable toolchain and rejected as
# unstable. They are listed with what they would have bought, so that whoever
# finds one stabilised knows why it was wanted:
#
#   wrap_comments, comment_width       would extend max_width to comment
#                                      interiors - the one real gap in this
#                                      configuration, since no stable key can
#                                      narrow a long doc comment.
#   imports_granularity, group_imports would merge and group the narrow imports
#                                      described under reorder_imports.
#   error_on_line_overflow,            would promote an over-long or
#   error_on_unformatted               unformattable line from silence to an
#                                      error, turning max_width from a target
#                                      into an assertion.
#   format_code_in_doc_comments        would format the Rust inside doc
#                                      examples.
#   normalize_comments,                cosmetic normalisation of comment and
#   normalize_doc_attributes           doc-attribute syntax.
#   blank_lines_upper_bound            would cap consecutive blank lines;
#                                      partly covered by spacecheck.pl already.
#   condense_wildcard_suffixes,        stylistic preferences with no gate
#   hex_literal_case,                  behind them.
#   struct_field_align_threshold,
#   enum_discrim_align_threshold,
#   inline_attribute_width,
#   doc_comment_code_block_width,
#   force_multiline_blocks,
#   trailing_comma,
#   overflow_delimited_expr
#   skip_children, unstable_features   would change how rustfmt is driven
#                                      rather than what it emits.
#
# format_strings is in that list too, and it is the one entry that must NOT be
# adopted if it ever stabilises. It rewrites string literals to fit max_width.
# This workspace's specification is its bytes: 1,476 of the 1,914 fixtures carry
# an exact `<protocol>` block, and the harness joins expected and actual into
# one string and compares them whole - no per-line matching, no normalisation,
# header order significant. Header text, chunked framing, FTP command sequences,
# Digest and NTLM messages, `--write-out` formats and the progress-bar layout
# all live in string literals whose exact content is the contract.
# curl-rs/src/libcurl_src.rs makes the point from another direction: `--libcurl`
# emits a compilable C program, so a formatter reflowing its literals would emit
# C that no longer compiles.

# Stable options deliberately left at their defaults
#
# Recorded because two of them are load-bearing here and a future reader should
# know they were checked, not missed:
#
#   force_explicit_abi (default true)   rewrites `extern {` as `extern "C" {`.
#                                       rustc's `missing_abi` lint is warn by
#                                       default and would fail `-D warnings`, so
#                                       the default already does the right thing
#                                       for curl-rs-ffi's exported symbols.
#   remove_nested_parens (default true) removes `((x))`; clippy's
#                                       `double_parens` and rustc's
#                                       `unused_parens` are warn by default,
#                                       so the default agrees with the gate.
#   merge_derives, fn_params_layout,    no gate behind them and no evidence asks
#   match_arm_leading_pipes,            for a change. Left alone under the same
#   match_block_trailing_comma,         minimal-change discipline that governs
#   short_array_element_width_threshold the code.
#   use_try_shorthand                   inert: `try!` is an error in edition
#                                       2021, so nothing here can contain one.
#   style_edition                       reads "2015" by default even with
#                                       edition = "2021"; pinning it to 2021
#                                       changed nothing measurable, so it stays
#                                       unset rather than becoming a second
#                                       place to keep in step with the edition.

# What belongs elsewhere, and how this file is enforced
#
#   * Lints, lint levels and thresholds - clippy.toml, which also carries the
#     msrv held equal to Cargo.toml's rust-version. rustfmt has no opinion on a
#     lint and this file must not appear to have one.
#   * Copyright and SPDX headers - `reuse lint`. That is also why this file
#     carries its own header above: REUSE.toml does not list rustfmt.toml, so it
#     has to be annotated directly.
#   * Tabs, trailing whitespace, EOL style, final newline, consecutive blank
#     lines and non-ASCII bytes in every tracked file regardless of language -
#     scripts/spacecheck.pl. rustfmt enforces the first three for Rust sources;
#     spacecheck.pl enforces all of them for everything, including this file.
#   * Editor behaviour before a formatter ever runs - .editorconfig.
#   * The toolchain that reads this file - rust-toolchain.toml.
#
# Enforcement: `cargo fmt --all -- --check` is a gate, not a fixer. It exits
# non-zero and prints the diff it would have applied, so a formatting divergence
# fails the build instead of being quietly rewritten under a reviewer.
# `cargo fmt --all` is the developer-side counterpart, and nothing in continuous
# integration is permitted to rewrite a tracked file.
