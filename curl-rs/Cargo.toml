# curl-rs -- member manifest for the curl command-line client
#
# This crate is the command-line tool. It supersedes the 22,399 lines of C under
# src/ and is a thin CLI over the engine: it contains no protocol logic
# whatsoever, and everything it needs comes from curl-rs-lib's public surface.
#
# This file is authoritative for the crate's dependencies, features and MSRV,
# but not for versions: the workspace manifest is the single place versions are
# declared and member manifests inherit through `workspace = true`, so no
# version literal appears anywhere below.

[package]
name = "curl-rs"

# Inherited from [workspace.package] in the root manifest, never restated.
# Hard-coding the version, edition or rust-version here would reintroduce
# exactly the drift the root manifest exists to prevent. rust-version is
# mandatory in every member; it resolves to the root's value and agrees with
# clippy.toml's `msrv`, so the MSRV-sensitive clippy lints do not suggest
# constructs newer than the declared floor.
#
# The floor is MEASURED AND MET on this crate's own dependency path, and the
# measurement is recorded here because an earlier revision of this comment
# asserted the opposite from evidence that does not survive checking against
# the committed lockfile. Both of its claims were false:
#
#   * "clap_lex 1.1.0 is an edition2024 crate" -- Cargo.lock resolves
#     clap_lex 1.0.1, not 1.1.0. clap 4.5.61, clap_builder 4.5.61,
#     clap_derive 4.5.61 and clap_complete 4.5.67 all declare rust-version
#     1.74, below the floor. AAP 0.5.1's choice of this clap release over the
#     newest one does hold the floor; nothing is breached one level deeper.
#   * "home 0.5.12 is edition2024, 46 of 327 crates exceed 1.75, lowest
#     reachable 1.88" -- Cargo.lock resolves home 0.5.9, whose declared
#     rust-version is 1.70.0. Filtering the graph by each of the four
#     mandated targets, with and without the implementable feature set, gives
#     258-261 packages per graph and a maximum declared rust-version of 1.75 in
#     every one of the eight - and that maximum is this workspace's own crates
#     together with russh, not a crate above the floor. Zero of them are
#     edition-2024. So the count above 1.75 is 0, not 46.
#
# The sufficient condition holds too, which a dependency scan alone cannot
# show: `cargo +1.75.0 check --locked --offline --workspace --all-targets` and
# `cargo +1.75.0 build --locked --offline --workspace` both exit 0 on this
# tree. The floor is reached, not merely declared.
#
# What holds the floor is the LOCKFILE, not the version requirements, and that
# distinction is the one thing worth carrying forward from the claim that was
# refuted:
#
#   * clap_builder 4.5.61 and clap_complete 4.5.67 both require
#     `clap_lex ^1.0.0`. That range admits clap_lex 1.1.0, which IS
#     `edition = "2024"` with `rust-version = "1.85"`, and Cargo 1.75 refuses
#     even to download such a crate - "the package requires the Cargo feature
#     called `edition2024`". The committed lock resolves 1.0.1 instead,
#     edition 2021 and rust-version 1.74.
#   * russh 0.54.5 requires `home ^0.5`, a range that admits home 0.5.12,
#     edition 2024 with rust-version 1.88. The committed lock resolves 0.5.9,
#     edition 2021 and rust-version 1.70.0.
#
# So a `cargo update` run WITHOUT `--locked` re-breaks the floor on this
# crate's path, silently and during manifest parsing rather than compilation --
# `cargo update --dry-run` reports exactly those two floats. Every gate in
# .github/workflows/rust-*.yml passes `--locked` for that reason, and
# Cargo.lock is committed (AAP 0.7) for that reason.
#
# This crate's remaining direct dependencies sit lower still: tokio 1.53.1 at
# 1.71 and tempfile 3.27.0 at 1.63, with curl-rs-lib at the floor itself.
#
# Two lockfile pins are what hold the graph there - getrandom 0.3.3 and
# wasi 0.14.0, both on a Windows-only, WebAssembly-only branch of a build
# dependency. With them in place `wasip2` and `wit-bindgen` are absent from the
# lockfile entirely, so even an UNFILTERED `cargo metadata --offline` succeeds
# and reports nothing above the floor. See the root Cargo.toml for the full
# derivation and the restore commands.
#
# AAP 0.8.6 ambiguity A6 covers exactly this and records it as Resolved by the
# compliant version set; the measurement above is that resolution confirmed
# rather than assumed. It is therefore NOT ambiguity A4. A4 concerns the
# variadic ABI on aarch64-apple-darwin, which remains genuinely escalated, is
# recorded at curl-rs-ffi/Cargo.toml beside the artifact it affects, and is
# unrelated to the MSRV of this crate's dependency path. The inherited value
# stands because it is correct, not because a conflict is being deferred.
#
# One caveat, so the measurement is not overread: the floor is verified for the
# workspace AS IT STANDS, not for the finished tool. AAP 0.3.1's CLI tree is
# only partly delivered, and code that lands later may reach for constructs
# newer than 1.75, so the check has to be repeated as the crate grows -- which
# is what the four-target build matrix and clippy::incompatible_msrv are for.
#
# One consequence of the declared floor binds a sibling file, so it is recorded
# where the declaration lives: Cargo rejects the double-colon `cargo::` build
# script output syntax below rust-version 1.77, so curl-rs/build.rs must use the
# single-colon form for every instruction it emits.
#
# This inheritance is a hard cross-file precondition: if the root's
# [workspace.package] omitted any field inherited here, cargo would refuse to
# load the entire workspace.
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true

# Declared locally rather than inherited, deliberately: the root's description
# covers the workspace as a whole, while this crate is a distinct artifact --
# the executable, not the library. A local one-liner is the more informative of
# the two permitted choices and removes one inheritance edge from the
# precondition noted above.
#
# It names the crate's ROLE, in the tense the delivery warrants. curl's own
# one-liner is frozen -- docs/cmdline-opts/_NAME.md:4 reads
# "curl - transfer a URL" -- and this crate is to reproduce that tool. Both
# binaries declared below do build today, but what is delivered is not yet the
# tool: the CLI tree is 18 source files plus build.rs (bin/curlinfo.rs,
# ca_embed.rs, callbacks/mod.rs, cli/{args,libinfo,mod,paramhlp}.rs, main.rs,
# output/{dirhie,filetime,formparse,mod,msgs,progress,writeout,xattr}.rs,
# terminal.rs and util.rs), while config/, operate/, callbacks/{write,read}.rs,
# cli/{help,vars}.rs, libcurl_src.rs and urlglob.rs are all still absent.
# "transfer data with URLs" describes the finished tool, so it is recorded here
# as the target wording and adopted as the description once that set is
# complete.
description = "The curl command-line tool, in safe Rust"

# This crate is never published: it is distributed as an executable, and its
# only path dependency carries no registry version, which would make publishing
# impossible in any case. Saying so explicitly is required to pass the
# supply-chain gate - deny.toml sets `wildcards = "deny"` with
# `allow-wildcard-paths = true`, and cargo-deny grants that path exemption only
# to PRIVATE crates, so without this line `cargo deny check bans` fails on the
# curl-rs-lib path dependency below. The alternative - giving the path
# dependency a registry version - would restate a version literal.
publish = false

# Declared explicitly instead of relying on Cargo's auto-detection, so the
# relationship is self-documenting.
#
# This script replaces three Perl generators the C build ran: src/mkhelp.pl (the
# embedded manual), src/mk-file-embed.pl (the embedded CA bundle) and
# scripts/completion.pl (shell completions). Their outputs are build artifacts
# rather than committed source, so hand-writing them in Rust would guarantee
# drift; reproducing them in build.rs is mandatory.
build = "build.rs"

# The version string this binary reports is load-bearing, not cosmetic, so it
# is worth recording where it comes from and why it must not be touched.
# include/curl/curlver.h (read in full) declares at :31
# LIBCURL_COPYRIGHT "Daniel Stenberg, <daniel@haxx.se>.", at :35
# LIBCURL_VERSION "8.19.0-DEV", at :39-41 MAJOR 8 / MINOR 19 / PATCH 0, at :61
# LIBCURL_VERSION_NUM 0x081300 and at :72 LIBCURL_TIMESTAMP "[unreleased]".
# The consequence is measurable rather than stylistic: the %VERSION and %HOSTIP
# placeholders in the fixtures are substituted by the harness from
# tests/globalconfig.pm and tests/servers.pm, so the User-Agent string has to
# match the version the binary reports, and 1,476 of the 1,914 fixtures
# (measured: `ls tests/data/test* | wc -l` = 1914) compare full request bytes --
# a wrong version string fails all of them at once. No version is bumped here;
# the contract is frozen.

# Binaries -- exactly two, both named explicitly so nothing depends on
# auto-discovery. The C build produces the same two:
#   src/Makefile.am:49    bin_PROGRAMS = curl              (installed)
#   src/Makefile.am:51-52 curlinfo_SOURCES = curlinfo.c
#                         noinst_PROGRAMS = curlinfo       (NOT installed)
# src/CMakeLists.txt:111-113 agrees for the second one:
#   add_executable(curlinfo EXCLUDE_FROM_ALL "curlinfo.c")
#   target_link_libraries(curlinfo PRIVATE ${CURL_LIBS})
#   set_target_properties(curlinfo PROPERTIES UNITY_BUILD OFF)

# The primary binary is named curl-rs, NOT curl. The C tool installs as `curl`
# (src/Makefile.am:49); the Cargo target name deliberately differs so the two
# artifacts can coexist during the transformation. That naming is settled
# elsewhere too: README.md lists "curl-rs -- the command-line executable" under
# Artifacts, and .cargo/config.toml's validation checklist inspects
# target/release/curl-rs by that name.
#
# The divergence is harmless for the test suite because the harness takes the
# binary under test as an argument: tests/runtests.pl:2344-2348 reads
# `elsif($ARGV[0] eq "-c") { ... $DBGCURL=$CURL=$ARGV[1]; shift @ARGV; }`.
# No Perl is modified to accommodate the name.
#
# Declaring the path eagerly is safe only because the root is present: Cargo
# resolves declared target paths before any compilation, and a [[bin]] naming a
# file that does not exist aborts the WHOLE workspace ("error: can't find bin
# ... at path ..."), not just this crate. src/main.rs is on disk, so both
# targets resolve and both build.
[[bin]]
name = "curl-rs"
path = "src/main.rs"

# The diagnostic binary, from src/curlinfo.c: it reports which features are
# disabled that would otherwise exist, which regular `curl -V` output does not
# show. Not installed, exactly as upstream.
[[bin]]
name = "curlinfo"
path = "src/bin/curlinfo.rs"

# No library target is declared: this crate is binaries only.
#
# The C build's static convenience library, libcurltool, has no counterpart here
# on purpose. Its only consumers are the C unit tests, and those cannot link
# against a Rust static library at all - `pub(crate)` items are genuinely absent
# from the symbol table rather than merely hidden - so their coverage is
# relocated into #[cfg(test)] modules. Exporting a library here would buy
# nothing and would weaken the encapsulation the zero-unsafe guarantee rests on.
#
# No benchmark or example targets either: performance is an explicit non-goal of
# this work, so no change may be justified on speed grounds.

# Dependencies -- `{ workspace = true }` only, plus a crate-local feature
# overlay where one is genuinely required.
#
# The root [workspace.dependencies] table pins every version exactly, and
# nothing is re-derived or "upgraded" here. Only crates already present in that
# table are referenced, and only crates a module under curl-rs/src/ actually
# uses.

[dependencies]

# The engine. This is the crate's only path dependency and the only place it
# gets protocol behaviour from.
#
# The dependency direction is acyclic and one-way: the C ABI shim and this
# binary both depend on the engine, and the engine depends on neither. The shim
# is deliberately NOT a dependency of this crate and must never become one - the
# command-line tool links the engine directly in Rust, never through the C ABI.
# Depending on it would put a cdylib boundary in the middle of the tool for no
# reason and would create a second, divergent path to the same engine.
#
# default-features = false is deliberate. It suppresses the engine's own default
# feature set so that the [features] table below is AUTHORITATIVE rather than
# additive: with the engine's defaults off, the only way an engine capability
# turns on is through a forward declared here. That is what makes
# `--no-default-features` on this crate mean what it says, and it is the
# mechanism that keeps the reported feature banner honest (see [features]).
#
# What this single line replaces: the C build compiles 16 ../lib/curlx/*.c files
# a SECOND time into the tool, to reuse functions that are not part of the
# public API. That duplicate compilation disappears entirely; the CLI depends on
# the library crate instead.
curl-rs-lib = { path = "../curl-rs-lib", default-features = false }

# The argument surface: clap 4.x, derived 1:1 from the curl 8.x long-option
# inventory. That inventory is the 282-row `aliases[]` table in
# src/tool_getparam.c; rows carrying the ARG_NO mask additionally generate
# --no-<flag> negations, so the derived surface is larger than the row count.
#
# `derive` is the one feature this crate needs, because the alias table becomes
# a clap derive in curl-rs/src/cli/args.rs.
#
# Two features were considered and rejected, so the rejection is on the record
# rather than looking like an oversight:
#   * `string` -- the option inventory is a fixed compile-time table, so no
#     clap API here needs an owned String. Declaring it would widen the surface
#     without a consumer.
#   * `wrap_help` -- help output must reproduce src/tool_listhelp.c's table
#     verbatim. That file's header at :30-34 records that it is generated ("make
#     listhelp"), :35 opens `const struct helptxt helptext[] = {`, and it holds
#     273 real entries followed by the `{ NULL, NULL, 0 }` terminator at :863.
#     A naive count of initializer rows yields 274; the sentinel is not an
#     option. 273 is exactly the option-page count too: of the 293
#     docs/cmdline-opts/*.md files, 19 are `_`-prefixed SUPPORT pages and
#     MANPAGE.md documents the format rather than an option, leaving 273 --
#     which is also what Makefile.inc's DPAGES list holds (measured).
#     AAP section 0.8.1 freezes that output, so clap must not reflow it to the
#     terminal width, and the feature would pull in a terminal-size dependency
#     for a job this crate does itself.
# Cargo unions features across the graph, so this overlay guarantees a minimum;
# it cannot and does not try to subtract anything the root's pin enables.
clap = { workspace = true, features = ["derive"] }

# Shell completions at run time, to back curl-rs/src/cli/completions.rs, which
# is to replace scripts/completion.pl. The pinned clap_complete requires clap
# ^4.5.20, which the pinned clap satisfies, so no feature overlay is needed.
clap_complete = { workspace = true }

# The async runtime, in the specific shape the requirements mandate: a
# current-thread runtime for the CLI and a multi-thread runtime for the multi
# handle. Both flavours therefore have to be available from this one crate,
# which is why `rt` and `rt-multi-thread` are both enabled.
#
# The features are enumerated rather than pulled in with `full`, so that every
# one of them has a named consumer:
#   rt              -- the current-thread runtime to be built in src/main.rs
#   rt-multi-thread -- the multi-thread runtime in src/operate/parallel.rs,
#                      which is to drive --parallel
#   macros          -- select! in that parallel driver, racing transfer
#                      completion against the progress-meter tick; also
#                      #[tokio::test] in this crate's #[cfg(test)] modules
#   signal          -- the tool ignores SIGPIPE, as src/tool_main.c does.
#                      tokio's unix signal support expresses that WITHOUT
#                      unsafe, which matters because this crate grants no unsafe
#                      exemption anywhere (see the note at the end of this file)
#   io-util         -- the transfer callbacks in src/callbacks/{write,read}.rs
#   fs              -- file I/O the tool owns: -o output, -T upload, -K config
#                      files, --create-dirs
#   time            -- --limit-rate pacing, --retry-delay, --speed-time and the
#                      progress-meter interval
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
  "io-util",
  "fs",
  "time",
] }

# Deliberately NOT dependencies of this crate. Each omission is a decision,
# recorded so that nobody re-adds it as an "obvious" oversight.
#
# * No content-type-inference crate, because the inference this crate would use
#   one for does not live here. The tool's -F parser assigns a part's type only
#   from an explicit `;type=<content-type>` in the form argument
#   (src/tool_formparse.c) - it never guesses from a filename. The guessing that
#   curl does perform is libcurl's, in the MIME serialiser
#   (Curl_mime_contenttype in lib/mime.c): a ten-extension table plus an
#   application/octet-stream fallback for file parts. That belongs to the engine
#   crate's mime module, not to the CLI, so no crate is needed here. Adding
#   inference to the -F parser would be a behaviour change, which the frozen CLI
#   semantics prohibit.
#
# * No libc. Nothing in this crate needs a libc type or constant that std does
#   not expose, and it could not be used for a syscall here in any case, because
#   this crate's roots forbid unsafe code with zero exemptions. The three places
#   in src/ that genuinely need a raw syscall - the extended-attribute writer,
#   the terminal-width query and the password prompt's echo suppression - belong
#   in curl-rs-lib/src/ffi/sys.rs, and this crate consumes the safe wrapper.
#   What std already covers needs nothing: isatty is std::io::IsTerminal, and
#   the -R timestamp path is std::fs::File::set_times, stable in exactly the
#   declared MSRV.
#
# * No logging or tracing facade. Trace formatting lives in
#   curl-rs-lib/src/trace.rs with the --trace formats frozen, and the tool-side
#   debug callback writes a byte-frozen hex dump with std::io rather than
#   emitting structured log records. If diagnostics ever need a sink, the engine
#   owns that decision.
#
# * No header generator. It is a build dependency of the C ABI shim alone, which
#   also owns the soname configuration that goes with it.
#
# * No CI tooling. The coverage, advisory-scanning, licence-policy and
#   cross-compilation helpers are binaries the workflows install; they are not
#   manifest dependencies of anything.
#
# * No protocol, TLS, QUIC, SSH, compression or cryptographic crate. Every one
#   of those belongs to the engine crate ALONE. Declaring any of them here would
#   put protocol knowledge in the CLI.
#
# * No C-binding crate of any kind, at any configuration - not as a default, not
#   behind a feature flag, not as a fallback. deny.toml enforces this
#   workspace-wide with an explicit ban list and is the authoritative record of
#   it; this file simply never reaches for one.

# Build dependencies -- the section is deliberately ABSENT.
#
# curl-rs/build.rs uses only the standard library, including
# std::process::Command to drive scripts/managen through Perl. Two reasons:
#
#   1. The embedded manual is emitted in PLAIN form, reproducing src/mkhelp.pl
#      without its compression flag, so no compression crate is needed. That is
#      a supported upstream configuration rather than a shortcut - the C build
#      generates the uncompressed form whenever zlib is unavailable - and binary
#      size is not an objective here.
#   2. Shell completions are produced by parsing the curldown front matter of
#      the 273 option pages under docs/cmdline-opts/ directly, which is the
#      faithful 1:1 replacement for scripts/completion.pl -- itself written
#      against core Perl with no library. 273, not 274: completion.pl:89 keeps
#      only regular `*.md` files, skips every `^_` SUPPORT page, and excludes
#      MANPAGE.md by name, its own comment calling that out as an edge case
#      ("does not start with an underscore but also is not documentation for an
#      option"). Generating them from the clap surface
#      instead would mean include!-ing derive code into a build script, which
#      would force curl-rs/src/cli/args.rs to be build-script-includable and
#      impose an invasive constraint on a file this manifest has no business
#      constraining.
#
# If build.rs is ever found to genuinely need a crate, add it to the root
# [workspace.dependencies] FIRST and reference it here as `{ workspace = true }`
# - never pin a version locally. A pure Rust backend must be selected for
# anything that has a C fallback, since deny.toml bans the C compression and TLS
# bindings outright.

# Features -- the canonical 15-name vocabulary, every one forwarded to the
# engine.
#
# Cargo has no [workspace.features] table, so the root manifest can only fix the
# vocabulary and the default-on/off state in prose; the functioning table lives
# here. The fifteen names are used verbatim and none is added, so that a
# capability cannot be enabled in one crate and disabled in another.
#
# WHY THE FORWARDING IS LOAD-BEARING RATHER THAN COSMETIC. The tool asks the
# library what it can do and prints the answer through `--version`, and the test
# harness BELIEVES that banner: it parses the `Protocols:` line into a protocol
# set (deriving <proto>-ipv6 and <proto>-unix variants and appending http-proxy
# and https-mtls) and the `Features:` line into a map over a 52-name vocabulary.
# 874 of the 1,914 fixtures gate on <features>, and the asymmetry is decisive:
# under-reporting a capability makes a fixture skip, while over-reporting makes
# it run and fail.
#
# So if this crate's feature set could drift from the engine's, the banner would
# lie and a clean skip would turn into a hard failure. The forwarding table
# below, together with default-features = false on the path dependency above, is
# the mechanism that makes that drift impossible: this crate cannot enable a
# capability the engine does not get, and cannot fail to enable one the engine
# does.
#
# CRITICAL MECHANISM -- Cargo UNIONS features across the entire dependency
# graph. There is no local scope for feature selection. Adding a feature here,
# or enabling one on a transitive dependency, that reaches a second
# cryptographic provider, a post-quantum hybrid key exchange, or an
# operating-system trust-store verifier silently changes the whole build even
# though the root manifest asked for none of them. The four resulting defects
# are duplicated cryptographic code; a build-time CMake-and-NASM requirement
# from vendored C and assembly that is likely to break the cross-compiled
# aarch64 Linux leg; a large vendored-C surface at odds with the no-C-TLS
# requirement; and a hybrid key exchange that changes the bytes of the TLS
# ClientHello, which under byte-exact fixture comparison places every HTTPS
# fixture at risk. The exact feature and crate names are pinned in the root
# manifest and banned in deny.toml; nothing in this table may undo either.
#
# There is deliberately NO switch here for the TLS layer. An off-switchable one
# would permit a build with no TLS at all, contradicting the requirement of
# exactly one TLS implementation with certificate validation on by default. TLS
# is unconditional. This paragraph exists so that the omission reads as a
# decision and nobody adds the switch later.
#
# What this fifteen-name map replaces: the C configuration surface, which is 101
# knobs in configure.ac (57 AC_ARG_ENABLE plus 44 AC_ARG_WITH) and 98 option()
# calls in CMakeLists.txt. The three jobs of `#include "curl_setup.h"` now
# separate cleanly - feature selection becomes Cargo [features], platform
# detection becomes cfg(target_os) and cfg(target_arch), and shared type
# declarations become ordinary `use` statements.

[features]

# The twelve default-on capabilities.
default = [
  "http2",
  "http3",
  "ftp",
  "ssh",
  "websockets",
  "cookies",
  "hsts",
  "altsvc",
  "doh",
  "brotli",
  "zstd",
  "gzip",
]

# Each name forwards to the identically named engine feature and adds nothing of
# its own, so the tool and the engine can never disagree about what is built.
http2      = ["curl-rs-lib/http2"]
http3      = ["curl-rs-lib/http3"]
ftp        = ["curl-rs-lib/ftp"]
ssh        = ["curl-rs-lib/ssh"]
websockets = ["curl-rs-lib/websockets"]
cookies    = ["curl-rs-lib/cookies"]
hsts       = ["curl-rs-lib/hsts"]
altsvc     = ["curl-rs-lib/altsvc"]
doh        = ["curl-rs-lib/doh"]
brotli     = ["curl-rs-lib/brotli"]
zstd       = ["curl-rs-lib/zstd"]
gzip       = ["curl-rs-lib/gzip"]

# Negotiate authentication, default OFF. GSS-API is neither libcurl nor a TLS
# library - it is an authentication mechanism - so it does not contradict the
# no-C-TLS requirement, but the binding is confined to
# curl-rs-lib/src/ffi/gss.rs and kept off by default so that the default build
# links no C security library at all. While this is off, the reported Features:
# line must NOT advertise GSS-API, SPNEGO or Kerberos - three of the 52 names
# the harness recognises - because over-reporting turns a clean skip into a
# failure.
negotiate = ["curl-rs-lib/negotiate"]

# Alternative asynchronous resolver, default OFF. AAP section 0.8.3, in the
# user's own terms: "System resolver by default, with hickory-dns as an optional
# feature that is disabled by default."
#
# It forwards to the engine's feature of the same name, and that is all it can
# do: the engine currently backs the name with NO dependency, and enabling it is
# a hard build failure raised by `compile_error!` in curl-rs-lib/src/lib.rs
# rather than a silent no-op. curl-rs-lib/Cargo.toml carries the measurement
# behind that -- the two open hickory advisories are fixed only in a 0.26 line
# that declares rust-version 1.88 and so breaches the 1.75 floor AAP 0.8.3
# freezes, and cargo-deny reads Cargo.lock rather than the active feature set,
# so even an `optional = true` entry would be scanned on a default build.
#
# When the conflict is decided, enabling it becomes observable rather than
# nominal: the resolver crate enters the dependency graph and `curl --version`
# names `hickory-resolver` and its version in the position a C build fills with
# `c-ares`. The default build names neither, because it resolves with the system
# resolver -- the truthful-advertisement discipline of AAP 0.6.5, where
# under-reporting costs a skip and over-reporting costs a failure. That
# asymmetry is exactly why the failure is loud today instead of quiet.
hickory-dns = ["curl-rs-lib/hickory-dns"]

# Allocation accounting, default OFF, and the most consequential of the three
# off switches because withholding it changes which fixtures run.
#
# This feature also gates the tool-side initialisation, which is why the CLI has
# a stake in it and not just the engine: src/tool_main.c:101-127 is
# `#ifdef CURL_MEMDEBUG static void memory_tracking_init(void)`, reading the
# CURL_MEMDEBUG environment variable at :106 for the log filename and
# CURL_MEMLIMIT at :118 to enable fail-on-allocation-N; it is called from main
# at :182. The log format the harness consumes is fully specified:
# lib/memdebug.c (L191-368) emits `MEM <src>:<line> malloc(<n>) = <ptr>` with
# parallel forms for calloc(n,size), strdup(p)(n), wcsdup(p)(n), realloc(p,n)
# and free(p), plus LIMIT, FD, FILE and BT records;
# tests/memanalyzer.pm (L119-349) parses them with /^MEM ([^ ]*):(\d*) (.*)/ and
# siblings; and the destination comes from CURL_MEMDEBUG (tests/runner.pm:165).
#
# MEM, LIMIT, FD, FILE and BT are the whole set of record prefixes, taken from
# the curl_dbg_log() call sites themselves: `grep -c ADDR lib/memdebug.c`
# returns 0, and the fifth prefix is the USE_BACKTRACE record
# `BT %s:%d -- %s\n` at lib/memdebug.c:136, which tests/memanalyzer.pm:116
# matches with /^BT/ and then discards. The analyzer keeps a legacy ^ADDR
# branch at tests/memanalyzer.pm:349 that nothing in the C tree feeds, so ADDR
# is not part of the contract this feature has to satisfy.
#
# THE DECISION AND ITS COST, from AAP section 0.6.6, stated rather than buried.
# The default posture is NOT to advertise Debug in the version banner, because
# tests/runtests.pl:660 sets `$feature{"TrackMemory"} = $feat =~ /Debug/i;` and
# the entire memory-checking block at :1759 is wrapped in
# `if($feature{"TrackMemory"})`. Withholding Debug therefore makes the 28
# fixtures carrying a <limits> block inert -- their allocation ceilings are
# never compared, which matters because a Rust allocation pattern will not match
# a C one. The price: 98 fixtures require Debug and will SKIP, and
# `make torture-test` hard-requires the feature (tests/runtests.pl:847-849 dies
# with "cannot run torture tests since curl was built without TrackMemory
# feature") and is therefore not applicable. Enabling this feature is the
# remedy if that trade is ever rejected.
memdebug = ["curl-rs-lib/memdebug"]

# Development dependencies -- kept minimal.

[dev-dependencies]

# Scratch files and directories for the tests below: -o output, -K config files
# and cookie jars.
tempfile = { workspace = true }

# Test-only runtime surface. `test-util` gives the paused-clock control the
# timing-sensitive assertions need (--retry-delay, --speed-time) without
# sleeping in real time; `macros` and `rt` drive #[tokio::test].
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

# Test targets -- specified target design, not yet declared.
#
# tests-rs/ is deliberately not a fourth workspace member; its tests are to be
# wired in through the member crates' [[test]] targets, so each file is claimed
# by exactly one crate. Two of them are the CLI's --
# tests-rs/integration/insecure_warns.rs (the mandatory --insecure warning, a
# validation gate in its own right) and tests-rs/harness/curl_suite.rs (the
# fixture harness driven through tests/runtests.pl -c) -- and the rest belong
# elsewhere: the ABI trio (symbol parity against lib/libcurl.def, the
# enumeration-integer assertions, and compiling all 129 docs/examples/*.c)
# belongs to the C ABI shim, and the protocol integration tests plus the
# self-signed-certificate rejection test are the engine's. A second crate
# declaring either of the two paths below would silently compile it twice --
# Cargo does not warn about that (measured) -- so the split is maintained by
# discipline, and this comment is where it is written down.
#
# The two declarations that belong here, verbatim, once their files exist:
#
#   # Certificate validation is on by default and --insecure must warn on
#   # stderr before proceeding. That is one of the frozen default behaviours.
#   [[test]]
#   name = "insecure_warns"
#   path = "../tests-rs/integration/insecure_warns.rs"
#
#   # The fixture-corpus bridge: it invokes tests/runtests.pl with -c pointed
#   # at the Rust binary, the documented injection point at
#   # tests/runtests.pl:2344-2348. The 1,914 fixtures stay byte-for-byte
#   # unmodified; only the binary under test changes.
#   [[test]]
#   name = "curl_suite"
#   path = "../tests-rs/harness/curl_suite.rs"
#
# NO [[test]] TARGET IS DECLARED HERE, and that is a correctness requirement
# rather than an omission. Both files are absent rather than
# present-and-broken, and the directory they name does not exist at all
# (measured: `ls tests-rs` -> No such file or directory).
#
# Measured behaviour while a declared test file is absent, so the symptom is
# not mistaken for a defect in this manifest: `cargo metadata` and `cargo build`
# both still succeed -- metadata even reports the target, with an `src_path`
# naming a file that is not there, because a test target is not built by
# default -- but `cargo test` fails with "can't find integration-test <name> at
# path ...", and that failure takes down `cargo test --workspace` for every
# crate in the workspace, not just this one. Declaring a target for a file that
# does not exist therefore buys nothing: it cannot run a gate, and it converts a
# passing command into a failing one. The gate that requires
# `cargo test --workspace` to pass in full is why the honest state is a manifest
# whose every declared target resolves, plus this record of the two that are
# specified and not yet delivered. The reservation above is what keeps the two
# paths claimed by this crate in the meantime.

# What this file deliberately does NOT contain.
#
# * No [profile.*] table. Cargo honours profiles only in the workspace root
#   manifest and WARNS that a profile in a member is ignored, which would break
#   the zero-warning build gate on its own. The root manifest owns
#   [profile.release] and keeps it conservative - in particular, unwinding must
#   stay recoverable across the C ABI boundary, where the shim crate contains it
#   deliberately instead of letting it end the host process, so no member may
#   switch the release strategy to abort.
#
# * No [lints] table inheriting from the workspace. The root manifest defines no
#   [workspace.lints], so `workspace = true` there would simply fail to resolve.
#
# * No `-D warnings`. That is applied on the command line by the clippy gate, so
#   that a lint failure names itself rather than hiding inside a build log.
#
# * No native-library link declaration. This crate links no native library.
#
# * No [patch], [replace], [source] or [registries] table, and no git
# dependency.
#   The workspace has exactly three path dependencies among its own members and
#   no private registry, vendored crate or internal package feed.
#
# * No required-features on either binary. The tool must build with
#   --no-default-features, because the command-line surface is frozen and a
#   flag's PRESENCE must never depend on a Cargo feature. Where a capability is
#   compiled out, the correct behaviour is curl's own disabled-feature behaviour
#   - an error when the flag is used - not a missing flag. For the same reason
#   nothing declared here introduces a new command-line flag.
#
# * No safety attribute. The invariant is enforced in source, not in metadata:
#   the requirement is `#![forbid(unsafe_code)]` at the root of the engine and
#   of this crate, with a single `#[allow(unsafe_code)]` on `mod ffi`. This
#   crate has NO ffi module, so its roots need no exemption at all and can take
#   that literally -- src/main.rs:51, src/bin/curlinfo.rs:21 and build.rs:12
#   each carry `#![forbid(unsafe_code)]` with ZERO exemptions. The engine
#   cannot, and does not: the pair is error[E0453] there, so curl-rs-lib uses
#   `#![deny(unsafe_code)]` with exactly one allow on `mod ffi`, documented as a
#   deviation at curl-rs-lib/src/lib.rs. Either way the operating-system
#   integration that genuinely needs unsafe lives in
#   curl-rs-lib/src/ffi/sys.rs.
