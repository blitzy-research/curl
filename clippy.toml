# Configuration for `cargo clippy --workspace -- -D warnings`.
#
# msrv must match rust-version in the workspace manifest so that the
# MSRV-sensitive lints do not suggest constructs newer than the declared
# minimum supported Rust version.
#
# This is set to 1.75 to match the value the specification mandates. Be aware
# that 1.75 was measured to be unreachable with the mandated dependency set:
# `cargo +1.75.0 build --locked` fails because home 0.5.12 needs the
# edition2024 Cargo feature, and 46 of the 327 locked crates declare a
# rust-version above 1.75 (quinn-proto and quinn-udp at 1.85, idna_adapter and
# the icu_* family at 1.86, rand 0.10 at 1.85, home at 1.88). The lowest
# reachable value is 1.88, or 1.86 if the russh dependency on home is removed.
# Raise this line together with rust-version once that decision is made; the
# two must always agree, otherwise clippy::incompatible_msrv will fire under
# `-D warnings` for std APIs the toolchain in use actually provides.
msrv = "1.75"

# The C originals carry long, protocol-derived comment blocks and literal
# on-the-wire strings; keep those from tripping the doc/line lints.
doc-valid-idents = [
  "libcurl",
  "curl",
  "rustls",
  "quinn",
  "hyper",
  "russh",
  "HTTP",
  "HTTPS",
  "FTP",
  "FTPS",
  "SFTP",
  "SCP",
  "TLS",
  "QUIC",
  "ALPN",
  "NTLM",
  "SPNEGO",
  "GSS-API",
  "SigV4",
  "..",
]
