# curl / libcurl - Cargo workspace manifest.
#
# This is the single authority for workspace membership, shared package
# metadata, the minimum supported Rust version, the complete external
# dependency inventory with exact versions, and the capability vocabulary
# that replaces curl's preprocessor configuration.
#
# It supersedes the dependency-resolution, feature-selection, code-generation
# and packaging duties of configure.ac, CMakeLists.txt, acinclude.m4, m4/*.m4
# and the Makefile.am / Makefile.inc set. None of that machinery has a
# mechanical Cargo equivalent, so every capability it provided is
# re-established here explicitly rather than left to a Cargo default.
#
# Nothing decided here may change observable behaviour. The three frozen
# contracts are the bytes on the wire, the command-line surface and the C
# ABI; this manifest only selects the code that implements them. Where a
# choice existed between a faster design and a more behaviourally faithful
# one, faithfulness won - performance is an explicit non-goal.
#
# Companion configuration, deliberately kept in separate files:
#   rust-toolchain.toml   toolchain pin (channel 1.97.1) and target matrix
#   clippy.toml           msrv, kept equal to rust-version below
#   rustfmt.toml          formatting
#   deny.toml             licence allow-list, provider bans, advisory policy
#   .cargo/config.toml    per-target linkers; the libcurl.so.4 soname is NOT
#                         set there or here - it is a cdylib-only link arg
#                         emitted by curl-rs-ffi/build.rs
#   Cargo.lock            committed; reproducible resolution of this graph

[workspace]
# Resolver v2 is required for edition 2021 feature resolution: it stops
# build-dependency and target-specific features from leaking into the normal
# dependency graph, which is what keeps the cryptographic-provider selection
# below from being silently widened by a build script.
resolver = "2"

# Three members, and the dependency direction between them is acyclic:
#
#     curl-rs-ffi  ->  curl-rs-lib  <-  curl-rs
#
# curl-rs-lib is the protocol engine and the only crate with protocol
# knowledge. curl-rs is a thin command-line front end over it; curl-rs-ffi is
# a thin C ABI over it. Neither leaf crate contains protocol logic, and
# neither leaf depends on the other.
members = [
  "curl-rs-lib",
  "curl-rs",
  "curl-rs-ffi",
]

# tests-rs/ is deliberately NOT a workspace member. The Rust-side tests live
# outside the C tests/ tree so that tests/runtests.pl and the 1,914 fixtures
# under tests/data/ stay untouched; they are wired in through the member
# crates' [[test]] targets rather than as a fourth member. Adding tests-rs
# here would make Cargo demand a package manifest for it and would give the
# test tree a publishable identity it must not have.
#
# lib/, src/, tests/, docs/ and projects/ need no `exclude` entries: they
# contain no Cargo.toml, and Cargo only looks at the paths listed in
# `members`, so it never scans them.

[workspace.package]
# curl 8.19.0-DEV, the tree this implementation is measured against.
#
# include/curl/curlver.h is the authority: LIBCURL_VERSION "8.19.0-DEV" at
# line 35, MAJOR 8 / MINOR 19 / PATCH 0 at lines 39-41, and
# LIBCURL_VERSION_NUM 0x081300 at line 61.
#
# Cargo requires a SemVer version, and "8.19.0-DEV" is not one: `-DEV` would
# be read as a pre-release identifier that orders *below* 8.19.0. The C build
# system already solves this exactly the same way - CMakeLists.txt:63-66
# strips the suffix with a regex before calling project(CURL VERSION ...) -
# so "8.19.0" is the established SemVer form of this release, not a new
# decision.
#
# The version string consumers actually observe is unchanged and remains
# "8.19.0-DEV": `curl --version`, `curl-config --version`
# (curl-config.in:98) and the Version: field of libcurl.pc
# (libcurl.pc.in, @CURLVERSION@ substituted from configure.ac:129) are all
# rendered from LIBCURL_VERSION by curl-rs-lib/src/version.rs. No version is
# bumped anywhere: the ABI contract is frozen.
version = "8.19.0"

# Edition 2021 and MSRV 1.75. rust-version reaches every member through
# `rust-version.workspace = true` and is mirrored by clippy.toml's `msrv`;
# the two must always agree, or MSRV-sensitive clippy lints fire under
# `-D warnings`. Raise this line, clippy.toml's `msrv` and
# rust-toolchain.toml's channel together, never one alone.
#
# 1.75 IS REACHABLE, AND IT IS HELD REACHABLE BY TWO LOCKFILE PINS.
#
# Measured on the floor toolchain rather than asserted, and measured
# end-to-end rather than on a necessary condition alone:
#
#   cargo +1.75.0 metadata --locked --offline                     -> exit 0
#   cargo +1.75.0 build --locked --offline --workspace            -> exit 0
#   cargo +1.75.0 check --locked --offline --workspace \
#                 --all-targets                                   -> exit 0
#
# Those are the expressions `.github/workflows/rust-build.yml`'s `msrv` job
# runs, so the gate is a real gate rather than a standing failure. The
# `metadata` form is the strict one and belongs first: it resolves every
# platform at once, so a single edition-2024 leaf anywhere in the lock aborts
# it during parsing, before any rustc runs. The two compiling forms are not
# warning-free, and the difference is worth stating exactly rather than
# rounding: the diagnostics are `never used` notices for modules whose callers
# are later files of the same migration, not MSRV diagnostics. No dependency
# emits any.
#
# 1.75 is a TIGHT floor, not a comfortable one. Of the 321 packages in the
# lock, the highest declared `rust-version` anywhere is exactly 1.75, and it
# belongs to this workspace's three crates together with russh 0.54.5,
# russh-cryptovec 0.52.0, russh-util 0.52.0 and pageant 0.1.0 - the heaviest
# mandated dependency sits precisely on the floor. Nothing declares above it,
# and no locked manifest is `edition = "2024"`.
#
# Reaching it needed two pins, and they are recorded here because a bare
# `cargo update` would undo them and the failure would look like a mystery.
# Neither crate is named in the mandated dependency set, neither is compiled
# for any of the four mandated targets, and neither is reachable at run time -
# both sit on a Windows-only, WebAssembly-only branch of a BUILD dependency:
#
#   cc -> [build-dependencies] jobserver
#      -> [target."cfg(windows)".dependencies] getrandom
#      -> [target.'cfg(wasm32 + wasi + p2)'.dependencies] wasi
#
#   getrandom  pinned to 0.3.3, NOT 0.3.4. 0.3.4 swapped its WASI backend from
#              `wasi` to `wasip2`, whose manifest declares rust-version 1.87.
#   wasi       pinned to 0.14.0, NOT 0.14.7. 0.14.7 declares rust-version
#              1.82 and pulls `wit-bindgen 0.57.1`, which is EDITION 2024.
#              An edition-2024 manifest is not merely too new to build: Cargo
#              1.75 cannot PARSE it, so `cargo metadata` fails for the whole
#              graph and the failure surfaces from cbindgen inside
#              curl-rs-ffi's build script, nowhere near its cause.
#
# Both pins are downgrades of transitive build-time crates and change nothing
# any mandated target links. After them, an UNFILTERED `cargo metadata
# --offline` over the 321 locked packages reports ZERO with an edition above
# 2021 and ZERO declaring a rust-version above 1.75, which is the invariant
# the floor rests on, and `wasip2` and `wit-bindgen` are absent from the
# lockfile entirely - `wit-bindgen-rt` 0.39.0 is a DIFFERENT crate, wasi
# 0.14.0's own dependency, and it does remain, but it is edition 2021 and
# declares no rust-version, so it does not bear on the floor.
#
# Per-target confirmation as well, which is the sufficient
# condition rather than the necessary one: filtering with
# `--filter-platform` over each of the four mandated triples, with and
# without the implementable feature set, gives eight graphs of 258 to 261
# packages whose maximum declared rust-version is 1.75 in every case and none
# of which contains an edition-2024 package. Re-check with the expressions in
# the `msrv` job, not by inspection.
#
# One MSRV conflict remains genuinely open, and it is a language conflict
# rather than a dependency one: AAP 0.8.6 ambiguity A4. The four-target matrix
# includes aarch64-apple-darwin, whose ABI passes variadic arguments on the
# stack, and the remedy is `c_variadic`, which is not stable at 1.75. That is
# escalated for a decision rather than resolved by editing the mandate. The
# dependency half of the question - AAP 0.8.6 ambiguity A6, "MSRV 1.75 versus
# the latest quinn, russh and clap" - is settled here by version selection,
# exactly as that section prescribes. If the floor is ever raised, raise this
# line, clippy.toml's `msrv`, rust-toolchain.toml's channel and
# .github/workflows/rust-build.yml's MSRV job together, and re-measure the
# figures above afterwards.
#
# THE COMMITTED LOCKFILE IS THE MECHANISM, NOT HYGIENE. A fresh resolve
# floats packages that break the floor on their own, so `cargo update` is not
# a tidying operation here:
#
#   clap_lex     1.0.1  -> 1.1.0   edition 2024, rust-version 1.85
#                                  (clap_builder 4.5.61 asks for ^1.0.0, so
#                                   both satisfy it; only 1.0.1 is 2021)
#   home         0.5.9  -> 0.5.12  edition 2024, rust-version 1.88
#                                  (russh 0.54.5 asks for ^0.5)
#
# Running it would turn a true declaration into a false one, which is why
# every gate in .github/workflows/rust-*.yml passes `--locked` and why
# Cargo.lock is committed (AAP 0.7).
#
# WHAT THIS DOES NOT ESTABLISH, stated plainly: the floor holds for the
# workspace AS IT STANDS, not for the finished product. The protocol,
# transfer, CLI and FFI trees AAP 0.3.1 specifies are not all delivered, and
# code that lands later may reach for a newer construct. The measurement has
# to be repeated as the workspace grows, which is what the four-target matrix
# in .github/workflows/rust-build.yml and clippy.toml's `msrv` key are for -
# `clippy::incompatible_msrv` rejects a too-new API as it is written rather
# than months later.
#
# Declaring 1.75 while developing on 1.97.1 is safe and deliberate: Cargo
# rejects only a toolchain OLDER than rust-version, and rust-toolchain.toml
# pins the development toolchain independently. The two numbers answer
# different questions - what this code requires, and what it is built with.
edition = "2021"
rust-version = "1.75"

# Project metadata, taken from the existing consumer-facing files so that
# nothing a downstream packager reads changes: libcurl.pc.in supplies
# `URL: https://curl.se/` and
# `Description: Library to transfer files with HTTP, FTP, etc.`, and
# include/curl/curlver.h:31 supplies LIBCURL_COPYRIGHT.
license = "curl"
authors = [
  "Daniel Stenberg <daniel@haxx.se>",
  "the curl project contributors",
]
description = "Library to transfer files with HTTP, FTP, etc."
homepage = "https://curl.se/"
repository = "https://github.com/curl/curl"
documentation = "https://curl.se/libcurl/"
readme = "README.md"
keywords = ["curl", "libcurl", "http", "ftp", "tls"]
categories = [
  "network-programming",
  "command-line-utilities",
  "web-programming::http-client",
]

# These artifacts ship as libcurl.so.4 and the curl executable through the
# usual packaging path described by libcurl.pc and curl-config, not as
# crates.io packages, and the three crate names are not registered to this
# project. Publishing is therefore refused outright.
publish = false

# External dependencies - declared once, here, and inherited by the members
# through `<crate> = { workspace = true }`.
#
# Every version is EXACT. A bare requirement is a caret range - Cargo reads
# "0.23.42" as "^0.23.42" - so `=x.y.z` is what stops the graph drifting: a
# caret range here floats clap to 4.6.4, whose own MSRV is 1.85. Cargo.lock
# is committed as the second half of the same guarantee.
#
# The set is the newest version of each crate that satisfies the MSRV, which
# is what keeps it coherent in two ways the newest-of-everything set is not:
#   * the RustCrypto family stays on a single `digest` 0.10 generation, so
#     Hmac<Sha1> and friends compile at all - digest 0.10 and 0.11 in one
#     graph do not unify, and deny.toml bans digest >= 0.11 to keep it so;
#   * no release-candidate cryptography enters the graph. russh 0.58.0
#     through 0.62.4 depend on rsa 0.10.0-rc, ssh-key 0.7.0-rc and
#     pkcs1 0.8.0-rc, which would put `cargo audit` in permanent jeopardy.
#
# Range requirements each pin satisfies, so a bump is checked against them:
#   tokio-rustls 0.26.4 needs rustls ^0.23.27
#   quinn 0.11.9        needs rustls ^0.23.5, quinn-proto ^0.11.12,
#                       tokio ^1.28.1
#   h3-quinn 0.0.10     needs h3 ^0.0.8, quinn ^0.11.7, tokio-util ^0.7.9
#   hyper 1.11.0        needs http ^1, http-body ^1, bytes ^1.2
#   clap_complete       needs clap ^4.5.20
#   russh               needs aes ^0.8, digest ^0.10, hmac ^0.12, rand ^0.8,
#                       sha1 ^0.10.5, sha2 ^0.10.6, des ^0.8.1, rsa ^0.9,
#                       tokio ^1.17.0
#
# TRANSITIVE PINS HELD IN Cargo.lock, recorded here because a lockfile entry
# with no explanation is a lockfile entry somebody will "refresh". Both exist
# for one reason: Cargo 1.75 cannot PARSE an `edition = "2024"` manifest, and it
# resolves every manifest in the graph regardless of target, so a single
# edition-2024 leaf on a platform this workspace never builds is enough to abort
# the MSRV gate before it starts.
#
#   1. wasip2 1.0.1+wasi-0.2.4  (and therefore wit-bindgen 0.46.0)
#
# getrandom 0.3.4 - reached through rand_core 0.9.5 and tempfile 3.27.0 -
# declares `wasip2 = "1"` for the wasm32-wasip2 target only. Cargo resolves
# Cargo.lock for ALL targets, so that entry lands in the graph even though no
# mandated target is wasm: the four triples of AAP 0.1.1 G8 are Linux and macOS
# on x86_64 and aarch64. Left at its newest release, wasip2 1.0.4+wasi-0.2.12
# requires wit-bindgen 0.57.1, whose manifest is `edition = "2024"`, and Cargo
# 1.75 refuses to PARSE it: "The package requires the Cargo feature called
# `edition2024`, but that feature is not stabilized in this version of Cargo
# (1.75.0)". That happens during manifest parsing, before any rustc runs, so it
# aborted `cargo +1.75.0 metadata --locked` and with it the entire MSRV gate of
# .github/workflows/rust-build.yml - and a gate that cannot start reports
# nothing about the floor it exists to measure.
#
# wasip2 1.0.1+wasi-0.2.4 requires wit-bindgen ^0.46.0, and both manifests are
# `edition = "2021"`, so Cargo 1.75 parses the whole graph. Pinning it is the
# minimal edit that restores the gate: it touches only the wasm-only leaf of the
# graph, changes no crate that any mandated target compiles, and leaves the
# frozen MSRV of 1.75 exactly where the specification put it.
#
#   2. uuid 1.20.0
#
# Reached through hickory-resolver 0.25.2 -> moka 0.12.15, which requires
# `uuid = "1.1"` with the v4 feature. uuid 1.21.0 and later declare
# rust-version 1.85 and require `getrandom = "^0.4"`, and getrandom 0.4.3 is
# another `edition = "2024"` manifest - the same abort, one crate further out.
# uuid 1.20.0 is the newest release that declares rust-version 1.63.0 and
# requires `getrandom = "^0.3"`, which unifies with the getrandom 0.3.4 already
# in the graph instead of adding a second major version for
# `cargo deny`'s multiple-versions policy to object to.
#
# What is deliberately NOT pinned, stated so the omission is not read as an
# oversight: five leaves declare a rust-version above the floor - wasip2 1.0.1
# and wit-bindgen 0.46.0 at 1.82.0 (wasm32-wasip2 only) and windows-registry
# 0.6.1, windows-result 0.4.1 and windows-strings 0.5.1 at 1.82 (reached only
# through ipconfig on cfg(windows)). Every one is edition 2021, so Cargo 1.75
# parses them, and none is compiled for any of the four mandated triples of
# AAP 0.1.1 G8, which are Linux and macOS on x86_64 and aarch64; AAP 0.2.2
# excludes Windows and wasm outright. Cargo enforces rust-version per compiled
# unit, so these declarations cost nothing here - measured: rustc 1.75.0
# compiles the entire dependency graph of all three crates, `hickory-dns`
# included.
#
# Do not raise any of these entries without first re-running
# `cargo +1.75.0 metadata --locked --offline`.
[workspace.dependencies]

# --- Async runtime and plumbing -------------------------------------------
#
# tokio replaces select()/poll() (lib/select.c, lib/curlx/wait.c), the
# thread abstraction of lib/curl_threads.c, and - most valuably - the
# alarm() plus sigsetjmp/siglongjmp DNS timeout in lib/hostip.c, which is
# the most hazardous construct in the C tree.
#
# NO feature list is declared here, and that is deliberate. Cargo UNIONS
# features across the whole graph, so a `features = [...]` list on this line is
# not a default that a member can narrow - it is a floor that every member
# inherits whether it needs it or not. `features = ["full"]` in particular
# would union tokio's entire surface (process spawning, io-std, parking_lot,
# signal handling) into all three crates, silently defeating the per-member
# enumeration that curl-rs-lib/Cargo.toml and curl-rs/Cargo.toml perform and
# that AAP section 0.7 requires - every dependency, and every feature of one,
# must have a named consumer. Measured with `cargo metadata`: with `full` here
# the resolved feature set was identical for all three members; without it each
# member resolves exactly what it enumerates.
#
# This line therefore carries only the exact version, which is the one thing
# AAP section 0.4.2 makes the root responsible for: "the workspace manifest is
# the single place versions are declared". The runtime SUBSET is a per-crate
# decision, because the two crates genuinely differ - the command-line tool
# drives a current-thread runtime while the multi handle drives a multi-thread
# one (AAP section 0.8.3) - and each member manifest states its own list with a
# consumer named against every entry.
tokio = { version = "=1.53.1" }
tokio-util = { version = "=0.7.19", features = ["codec", "compat", "io"] }
futures = "=0.3.33"
# Safe pin projection for the connection-filter chain, which is where the C
# tree used a `void *ctx` behind a 14-member vtable (lib/cfilters.h:210-226).
pin-project-lite = "=0.2.17"
# Replaces the hand-tracked pointer/length/capacity triples of
# lib/curlx/dynbuf.c, lib/sendf.c and lib/bufq.c.
bytes = "=1.12.1"

# --- HTTP/1.1 and HTTP/2 ---------------------------------------------------
#
# hyper and h2 are BOTH declared, on purpose. hyper already embeds h2, but
# hyper is used only for connection management, keep-alive and framing;
# raw SETTINGS and flow-control manipulation is observable in the fixture
# expectations under tests/data/ and is not reachable through hyper's
# surface, so h2 is used directly where that matters.
#
# hyper's `ffi` and `capi` features are deliberately NOT enabled: they add
# #[no_mangle] C entry points, which would appear in libcurl.so.4 and break
# the 100-symbol export parity gate against lib/libcurl.def.
#
# Note that hyper decides neither which headers are emitted nor in what
# order. tests/getpart.pm compares the whole request as one string, so
# header order, casing and spacing are all significant; request-line and
# header serialisation stays in curl-rs-lib/src/protocols/http1.rs.
hyper = { version = "=1.11.0", features = ["http1", "http2", "client"] }
hyper-util = { version = "=0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
h2 = "=0.4.15"
http = "=1.4.2"
http-body = "=1.1.0"
http-body-util = "=0.1.4"
# HTTP date formatting for conditional requests (-z / --time-cond).
httpdate = "=1.0.3"

# Cryptographic provider selection - the single most consequential decision
# in this manifest, and the reason the next two groups look verbose.
#
# rustls, tokio-rustls, quinn and russh all pick a cryptographic provider
# through their DEFAULT features, and their defaults disagree:
#
#   rustls 0.23.42      ["aws_lc_rs", "logging", "prefer-post-quantum",
#                        "std", "tls12"]
#   tokio-rustls 0.26.4 ["logging", "tls12", "aws_lc_rs"]
#   quinn 0.11.9        ["log", "platform-verifier", "runtime-tokio",
#                        "rustls-ring", "bloom"]
#   quinn-proto 0.11.14 ["rustls-ring", "log", "bloom"]
#   russh               ["flate2", "aws-lc-rs", "rsa"]
#
# Because Cargo unifies features across a graph, accepting all defaults
# links BOTH providers into one binary. That produces four distinct defects
# at once:
#
#   1. duplicated cryptographic code - two implementations of the same
#      primitives in one artifact;
#   2. a build-time requirement for CMake and NASM, introduced by
#      aws-lc-rs's vendored C and assembly, which is likely to break the
#      cross-based aarch64-unknown-linux-gnu leg of the target matrix;
#   3. a large vendored-C surface, which sits awkwardly against the
#      requirement that no C TLS code be linked at any configuration;
#   4. prefer-post-quantum offers a hybrid X25519MLKEM768 key exchange,
#      which CHANGES THE BYTES OF THE TLS ClientHello relative to curl 8.x.
#      The fixture comparison is byte-exact and order-significant, so this
#      alone places every HTTPS fixture at risk.
#
# So `default-features = false` plus an explicit provider is mandatory on
# all four crates, not a preference. quinn's own `rustls` feature already
# implies `rustls-ring`, so the provider stays consistent right through
# quinn-proto and no second provider can slip in transitively.
#
# platform-verifier is deliberately omitted from quinn. It would delegate
# trust decisions to the operating-system store, which conflicts with
# curl's --cacert, --capath and --insecure semantics remaining
# authoritative; certificate verification must stay under this
# implementation's control, on by default, with --insecure the only way to
# relax it and a stderr warning when it is used.
#
# Honest caveat, recorded rather than glossed: neither `ring` nor
# `aws-lc-rs` is pure Rust - both contain C and assembly. The constraint is
# satisfied in the sense that matters, which is that no C TLS *library* is
# linked: rustls implements the TLS state machine, the record layer and
# certificate verification in Rust, and the provider supplies only
# primitives. `ring` is chosen as the more portable and more readily
# cross-compiled of the two, and deny.toml bans aws-lc-rs and aws-lc-sys
# outright so a transitive dependency cannot reintroduce them.

# --- QUIC and HTTP/3 -------------------------------------------------------
#
# Replaces lib/vquic/ (ngtcp2 and nghttp3; quiche is dropped). HTTP/3 is
# already a connection filter in the C design - Curl_cft_http3 in
# lib/vquic/vquic.h:48 - so it composes into the same filter chain as TLS
# and raw sockets rather than needing a parallel abstraction.
quinn = { version = "=0.11.9", default-features = false, features = ["ring", "runtime-tokio", "rustls", "log"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"

# --- TLS - rustls exclusively ---------------------------------------------
#
# Replaces the whole of lib/vtls/ except its rustls backend, which is kept
# as a reference: lib/vtls/rustls.c already maps curl's TLS semantics onto
# rustls concepts, and that mapping is followed rather than reinvented.
# openssl.c, gtls.c, mbedtls.c, wolfssl.c, schannel.c and apple.c have no
# successor at any configuration; deny.toml bans openssl, openssl-sys,
# native-tls and schannel so none can return by the back door.
#
# webpki-roots and rustls-native-certs are both declared and are not
# alternatives: the bundled anchors back the embedded CA bundle path, while
# the platform store backs --ca-native. Selecting between them is a runtime
# decision driven by curl's own options, never a build-time one.
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
#
# rustls-pki-types is the AUTHORITATIVE PEM parser for this workspace, and that
# ownership is deliberate rather than incidental, so it is recorded here. The
# crate carries both the certificate and key types rustls exchanges AND, since
# 1.9, the PEM decoding that used to live in rustls-pemfile, exposed through its
# `pem::PemObject` trait. At 1.15.1 it already contains it. PEM parsing for
# --cacert, --capath, --cert and --key belongs to that trait, and nothing else
# in this workspace parses PEM.
#
# Deliberate omission, recorded so the gap is not mistaken for an oversight:
# `rustls-pemfile` is NOT declared. AAP 0.5.1's inventory names it at 2.2.0 for
# that job, and this manifest previously carried a `rustls-pemfile = "=2.2.0"`
# line. The line was inert -- no member consumed the crate, so Cargo never
# resolved it and it never appeared in the committed lockfile, a pin that
# specified nothing and guaranteed nothing. Making it live would have been worse
# than leaving it dead: RUSTSEC-2025-0134 marks rustls-pemfile 2.2.0
# UNMAINTAINED (the repository was archived in August 2025) with no upgrade to
# move to, and deny.toml sets `unmaintained = "all"`, so the first real consumer
# would have pulled the crate into the lockfile and failed the supply-chain
# gate -- forcing another advisory acceptance for a crate whose replacement is
# already pinned one line above.
#
# The replacement is not a substitute chosen here but the upstream successor:
# rustls-pemfile 2.2.0 is itself a thin wrapper over the very rustls-pki-types
# code pinned above. So the requirement AAP 0.5.1 records is met in full, by a
# maintained crate, with one dependency instead of two and no advisory
# acceptance -- the same reasoning AAP 0.5.1 applies when it rejects a
# dependency that would put the audit gate "in permanent jeopardy", and the same
# shape as the deliberate omission it records for cookie-store crates.
#
# `cargo tree -i rustls-pemfile` correctly reports nothing. Consumers are to use
# `rustls_pki_types::pem::PemObject`; the TLS option plumbing that will call it
# belongs to a unit of work not yet delivered at this commit, so no call site
# exists here yet. There is no second PEM parser in this workspace, and there
# should not be one.
rustls-pki-types = "=1.15.1"
webpki-roots = "=1.0.9"
rustls-native-certs = "=0.8.4"

# --- SSH: SFTP and SCP ----------------------------------------------------
#
# Replaces lib/vssh/libssh2.c and lib/vssh/vssh.c; lib/vssh/libssh.c is
# dropped.
#
# 0.54.5 rather than 0.54.6: 0.54.6 added a NON-OPTIONAL dependency on
# libcrux-ml-kem ^0.0.3, and libcrux-ml-kem 0.0.3 is YANKED on crates.io. A
# `^0.0.3` requirement on a 0.0.x version admits nothing but 0.0.3, so there
# is no unyanked candidate and resolution fails; deny.toml also sets
# `yanked = "deny"`. 0.54.5 has no libcrux-ml-kem dependency, is not yanked,
# declares rust-version 1.75, and carries the identical requirement set (aes
# ^0.8, digest ^0.10, hmac ^0.12, rand ^0.8, sha1 ^0.10.5, sha2 ^0.10.6, des
# ^0.8.1, rsa ^0.9, tokio ^1.17.0). Moving forward is not available either:
# russh 0.55.0 needs libcrux-ml-kem ^0.0.4 and raises its MSRV to 1.85.
#
# default-features = false is mandatory here for the same reason as for
# rustls: russh's defaults are ["flate2", "aws-lc-rs", "rsa"], so accepting
# them would pull aws-lc-rs into the graph and defeat the single-provider
# decision above. The three features restored are the two that were default
# and wanted (rsa for RSA host and user keys, flate2 for the SSH
# compression the transport negotiates) plus ring in place of aws-lc-rs.
# Additional cipher features (des for 3des-cbc, dsa) are additive and can be
# added here if fixture parity for a legacy algorithm ever demands them.
#
# OPEN SECURITY ADVISORIES ON THIS PIN - disclosed rather than muted,
# because silently accepting a defect that CI would otherwise report is the
# worst of the available options. They share GHSA-g9f8-wqj9-fjw5 and
# CVE-2026-46673, both are CVSS 7.5 availability-only, and both are fixed in
# >= 0.60.3 - but they describe DIFFERENT code and different reachability,
# so they are recorded separately:
#
#   RUSTSEC-2026-0154  russh 0.54.5, "Unbounded 32-bit allocation". The SSH
#                      AGENT client and server accepted peer-controlled
#                      agent frame lengths with no maximum; the fix enforces
#                      a 256 KiB cap. The peer here is the local agent, not
#                      the remote server. This workspace never uses russh's
#                      agent client or server, so the vulnerable code is not
#                      reached at all.
#   RUSTSEC-2026-0153  russh-cryptovec 0.52.0, "Unchecked CryptoVec
#                      allocation and growth handling". Two reachability
#                      paths: on 0.60.x the same local agent frames, and on
#                      releases BEFORE 0.58.0 the transport and compression
#                      buffers as well, which lets remote SSH traffic drive
#                      CryptoVec growth through packet reads and zlib
#                      decompression output. 0.54.5 is pre-0.58.0 and
#                      `flate2` is enabled below, so this remote path IS
#                      reachable: a malicious or compromised SSH server can
#                      force an allocation failure and abort the process,
#                      affecting sftp:// and scp:// transfers. Every other
#                      scheme, and any build without the `ssh` feature, is
#                      unaffected. russh 0.54.5 requires exactly
#                      russh-cryptovec 0.52.0, so this cannot be resolved
#                      on its own.
#
# The 0.60.3 fix cannot be taken without breaking constraints that rank
# above it. Every release in 0.55..=0.62 was checked: 0.61.0 and later need
# digest ^0.11.0-rc.5, which breaks the single digest 0.10 generation and is
# banned by deny.toml; 0.60.0 through 0.60.3, the first releases carrying the
# fix, pull sixteen release-candidate cryptography crates (rsa 0.10.0-rc,
# pkcs1/pkcs5/pkcs8/spki, ecdsa, elliptic-curve, crypto-bigint,
# ml-kem 0.3.0-rc.1, curve25519-dalek and ed25519-dalek pre-releases,
# p256/p384/p521, aead, aes-gcm); and every release from 0.55.0 up declares
# MSRV 1.85, while 0.55.0 - the only one in that range with a stable graph -
# does not contain the fix anyway.
#
# Both findings are HIGH, not CRITICAL, so the gate of zero critical
# advisories still holds; a strict `cargo audit --deny warnings` does not,
# and `cargo deny check advisories` reports them. That is the intended
# outcome: the exposure is carried openly rather than muted with an extra
# `ignore` entry here.
#
# One consequence for the zero-warnings gate: russh 0.54.5 trips a
# future-incompatibility lint of its own (macro-expanded macro_export
# referred to by an absolute path, rust issue 52234, in its server module,
# which this client-only use never touches). Registry crates are compiled
# with --cap-lints allow, so no rustc warning reaches the build; cargo still
# prints one informational line naming the package.
russh = { version = "=0.54.5", default-features = false, features = ["ring", "rsa", "flate2"] }

# --- Command line ---------------------------------------------------------
#
# clap replaces the 282-row aliases[] table of src/tool_getparam.c:80 and
# must reproduce it 1:1 - names, aliases, argument arity, argument type and
# default value, including the --no-<flag> negations generated for rows
# flagged ARG_NO. clap_complete replaces scripts/completion.pl.
clap = { version = "=4.5.61", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "=4.5.67"

# --- Public header generation (build dependency) --------------------------
#
# cbindgen generates include/curl/curl.h from curl-rs-ffi, inverting the
# direction of the C build, where lib/optiontable.pl derived the internal
# option table FROM the header (lib/Makefile.am:179-180). It is a
# build-dependency of curl-rs-ffi only and is never linked into
# libcurl.so.4, which is why deny.toml grants MPL-2.0 to this crate alone.
#
# include/curl/typecheck-gcc.h is NOT generated by it: its 958 lines carry
# 61 `#define curlcheck_` directives over 60 distinct names, and the token
# recurs 260 times across 258 lines - all beyond what cbindgen can express,
# so that header stays hand-maintained and ships verbatim beside the
# generated one.
cbindgen = "=0.29.4"

# --- Sockets --------------------------------------------------------------
#
# socket2's "all" feature exposes the platform socket options curl sets
# directly - keepalive parameters, TCP_NODELAY, bind-to-device and the
# rest - so that lib/cf-socket.c, lib/socketpair.c and
# lib/curlx/nonblock.c migrate with no hand-written unsafe. What genuinely
# cannot be expressed safely is confined to curl-rs-lib/src/ffi/sys.rs.
socket2 = { version = "=0.6.5", features = ["all"] }

# --- DNS ------------------------------------------------------------------
#
# NO in-process resolver crate is pinned here, and the omission is a MEASURED
# CONCLUSION rather than an oversight. This is the one entry of the feature
# vocabulary below for which the specification names a capability
# (`hickory-dns`, default off) but pins no version, so a version had to be
# chosen - and the search returned nothing admissible. The full option space,
# read from the registry index and sorted by parsed semantic version (AAP
# 0.5.1 records the trap that the index returns reverse-chronological
# publication order, so reading the first element yields a stale answer):
#
#   hickory-resolver 0.24.0 - 0.25.2   rust-version 1.67.0-1.71.1  (clears
#     the 1.75 floor) but every one of them requires hickory-proto ^0.24 or
#     ^0.25, and EVERY hickory-proto below 0.26.1 carries RUSTSEC-2026-0119
#     - a CPU-exhaustion denial of service in BinEncoder's name-compression
#     scan, whose advisory states the fix is available only in >= 0.26.1.
#
#   hickory-resolver 0.26.0 - 0.26.1   require hickory-proto ^0.26.0 and so
#     DO carry the fix, but both declare rust-version 1.88, which breaks the
#     1.75 floor measured and satisfied in [workspace.package] above.
#
# The two sets are disjoint and exhaustive: no release clears the MSRV floor
# and the advisory at the same time. Declaring one anyway would have to
# forfeit one of them, and both forfeits are worse than not shipping an
# optional convenience:
#
#   * Taking 0.25.2 adds a FIFTH accepted advisory to deny.toml, permanently
#     and UNCONDITIONALLY. That last word is the decisive mechanical fact:
#     cargo-deny and cargo-audit read Cargo.lock, not the active feature
#     set, so an `optional = true` dependency lands in the lockfile and is
#     scanned even in a default build with the feature off. It was tried,
#     and `cargo deny check` duly reported `advisories FAILED` on
#     hickory-proto 0.25.2 with the feature disabled. Growing the accepted
#     set to buy a default-off feature inverts the priority of AAP 0.7's
#     "Supply-chain hygiene is continuous" and AAP 0.8.4 gate 9. (The same
#     subtree also carries RUSTSEC-2026-0118, an unbounded loop in NSEC3
#     validation; that one is gated on hickory-proto's `dnssec-ring` or
#     `dnssec-aws-lc-rs` features and so would not be compiled here, which
#     is why RUSTSEC-2026-0119 is the binding objection of the two.)
#   * Taking 0.26.1 breaks AAP 0.8.3's MSRV 1.75, which is currently true.
#
# So the feature name is retained - AAP 0.5.2 fixes the vocabulary and
# renaming or deleting a name would ripple into the version banner, the
# capability table in curl-rs-ffi/build.rs and curlinfo's 29-entry table -
# but it is backed by NO dependency, and enabling it is a HARD BUILD FAILURE
# raised by a compile_error! in curl-rs-lib/src/lib.rs that states this
# reasoning at the point of use. That is deliberate: an unimplementable
# configuration must fail loudly rather than succeed silently, which is the
# defect the earlier `hickory-dns = []` no-op had.
#
# Nothing mandated is lost, and one measurement makes that concrete: this
# checkpoint contains no `curl-rs-lib/src/dns/` module at all, so no line of
# Rust in the workspace could reference an in-process resolver even if one
# were pinned. AAP 0.8.3's requirement is "System resolver by default, with
# hickory-dns as an optional feature that is disabled by default"; the
# default half is `src/dns/resolver.rs`, the module AAP 0.4.1 maps from
# lib/hostip.c and its siblings, and the optional half is disabled.
#
# Two further reasons not to reach for the crate casually, recorded because
# they outlive this particular version search:
#
#   * Feature unification. Even declared with default-features = false, the
#     subtree carries optional tls-aws-lc-rs, https-aws-lc-rs,
#     quic-aws-lc-rs, h3-aws-lc-rs and dnssec-aws-lc-rs features, and Cargo
#     unions features across a graph. deny.toml bans aws-lc-rs and
#     aws-lc-sys outright for exactly that reason, so a second cryptographic
#     provider arriving through a resolver would fail the bans gate rather
#     than merely enlarge the binary.
#   * DNS-over-HTTPS does not come from here either. AAP 0.4.1 specifies DoH
#     "via the crate's own HTTP client", so src/dns/doh.rs composes out of
#     this workspace's own HTTP and TLS stacks under the separate `doh`
#     feature. c-ares (lib/asyn-ares.c) is dropped by AAP 0.5.2, with
#     deny.toml banning both c-ares and c-ares-sys so it cannot return by
#     the back door.
#
# Revisit when a hickory-resolver release exists whose hickory-proto
# requirement admits >= 0.26.1 AND whose declared rust-version satisfies
# this workspace's floor.
#
# --- URL and encoding -----------------------------------------------------
#
# url supports, but does not replace, lib/urlapi.c: curl's parser has
# documented quirks that the six exported curl_url_* symbols expose, so
# parsing stays curl's own and this crate is used only where the semantics
# genuinely coincide. idna replaces libidn2 (lib/idn.c), and
# percent-encoding backs the escape tables of lib/escape.c.
url = "=2.5.8"
idna = "=1.1.0"
percent-encoding = "=2.3.2"
form_urlencoded = "=1.2.2"

# --- Cryptographic primitives (one digest generation: 0.10) ---------------
#
# Replaces the hand-rolled primitives of lib/md5.c, lib/md4.c,
# lib/sha256.c, lib/curl_sha512_256.c and lib/hmac.c. des backs the NTLM
# response computed in lib/curl_ntlm_core.c. All of these must stay on
# digest 0.10 for their traits to unify.
#
# rand is pinned at 0.8.7 rather than advanced specifically because russh
# requires rand ^0.8; advancing it would split the crate across two
# incompatible generations inside one graph for no gain. quinn-proto 0.11.14
# pulls its own rand 0.9.5 transitively (measured from Cargo.lock, not
# assumed - the lock contains exactly rand 0.8.7 and rand 0.9.5, and no
# rand 0.10), which is why deny.toml lists rand, rand_core, chacha20 and
# getrandom as accepted duplicates. That pair is structural and cannot be
# unified without abandoning a mandated version. Note that rand 0.10.2
# declares rust-version 1.85 and would break the MSRV floor established
# above, so it is not an upgrade path either.
sha1 = "=0.10.7"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
md4 = "=0.10.2"
hmac = "=0.12.1"
des = "=0.8.1"
rand = "=0.8.7"

# --- Encoding and compression --------------------------------------------
#
# base64 is declared without its default features: the default set is
# ["std", "simd-unsafe"], and `simd-unsafe` opts a dependency into unsafe
# SIMD intrinsics for a speed-up this project has no use for. Performance
# is a non-goal, memory safety is the point of the exercise, and base64
# encoding sits on no hot path, so the feature is declined explicitly
# rather than inherited silently.
#
# flate2 replaces zlib and is likewise pinned to its pure-Rust backend
# explicitly. rust_backend (miniz_oxide) is the default today, but the
# crate also offers zlib, zlib-ng, zlib-rs and cloudflare_zlib backends,
# any of which would reintroduce a C library through a transitive feature
# request. Inflate output is fully determined by RFC 1951, so decompressed
# bytes are identical to zlib's.
#
# brotli replaces the C brotli library and is pure Rust; its `ffi-api` and
# `no-stdlib-ffi-binding` features are not defaults and must stay off,
# since they would add #[no_mangle] C symbols to libcurl.so.4 and break
# export parity. zstd keeps its defaults, including `legacy`, which
# matches the legacy-format decoding a distribution libzstd is normally
# built with - behavioural faithfulness outranks a smaller vendored
# surface here.
base64 = { version = "=0.23.0", default-features = false, features = ["std"] }
hex = "=0.4.3"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
brotli = "=8.0.4"
zstd = "=0.13.3"

# --- Supporting libraries -------------------------------------------------
#
# publicsuffix replaces libpsl (lib/psl.c) and supplies ONLY the
# domain-matching rules libpsl supplied. Its features mirror what libpsl's
# cookie-domain check actually does: `punycode` for IDN domains, `anycase`
# because DNS labels compare case-insensitively, and `std` for file-backed
# list loading.
#
# Deliberate omission: no cookie-store crate is used. curl's Netscape
# cookie-jar file must remain byte-compatible, so that a jar written by
# curl 8.x is readable by this implementation and vice versa, and no
# general-purpose crate commits to that on-disk format. The jar is
# implemented natively in curl-rs-lib/src/cookies/mod.rs.
#
# thiserror sits behind the pinned CURLcode mapping, never in front of it:
# the public error integers are declared explicitly in curl-rs-ffi and are
# never derived from Rust variant ordering.
#
# libc supplies types for the confined FFI island only
# (curl-rs-lib/src/ffi/, curl-rs-ffi/src/ffi/) and is not a general-purpose
# escape hatch. log is the facade the TLS and QUIC crates already log
# through; tracing backs curl's own --trace output.
publicsuffix = { version = "=2.3.0", features = ["anycase", "punycode", "std"] }
thiserror = "=2.0.19"
libc = "=0.2.189"
log = "=0.4.33"
tracing = "=0.1.44"
# Byte scanning for header and chunked-framing parsing (lib/curl_memrchr.c).
memchr = "=2.8.3"
# Content-type inference for MIME parts. This belongs to the engine's mime
# module, not to the tool: the -F parser honours only an explicit
# `;type=<content-type>`, while lib/mime.c's serialiser guesses from the
# filename extension and falls back to application/octet-stream. Its answer set
# must be narrowed to curl's own ten-extension table plus that fallback.
mime_guess = "=2.0.5"
# Development dependency only; used by the integration tests.
tempfile = "=3.27.0"

# Capability vocabulary - the replacement for curl's preprocessor
# configuration, fixed here so a capability cannot mean one thing in one
# crate and something else in another.
#
# Cargo has no [workspace.features] table, so the member manifests declare
# the matching [features] tables themselves. What is authoritative here is
# the VOCABULARY and the default-on / default-off state; a member may not
# invent a name outside this list, rename one, or flip a default.
#
# Default ON (twelve):
#   http2        HTTP/2 over ALPN            (lib/http2.c)
#   http3        HTTP/3 over QUIC            (lib/vquic/)
#   ftp          FTP and FTPS                (lib/ftp.c)
#   ssh          SFTP and SCP                (lib/vssh/)
#   websockets   the four curl_ws_* symbols  (lib/ws.c)
#   cookies      cookie engine and jar       (lib/cookie.c)
#   hsts         HSTS cache                  (lib/hsts.c)
#   altsvc       Alt-Svc cache               (lib/altsvc.c)
#   doh          DNS-over-HTTPS              (lib/doh.c)
#   brotli       Content-Encoding: br        (lib/content_encoding.c)
#   zstd         Content-Encoding: zstd      (lib/content_encoding.c)
#   gzip         Content-Encoding: gzip      (lib/content_encoding.c)
#
# Default OFF (three), each for a stated reason:
#
#   negotiate     GSS-API Negotiate/SPNEGO (lib/vauth/krb5_gssapi.c,
#                 spnego_gssapi.c, lib/http_negotiate.c). GSS-API is an
#                 authentication mechanism, not a TLS library, so it does
#                 not contradict "rustls exclusively" - but keeping it
#                 non-default is what makes the statement "the default
#                 build links no C security library at all" true. The
#                 binding is confined to curl-rs-lib/src/ffi/gss.rs.
#
#   hickory-dns   SPECIFIED TARGET BEHAVIOUR, not delivered. The system
#                 resolver is to be the default, with hickory-dns as an
#                 optional feature disabled by default. The name belongs to
#                 AAP 0.5.2's frozen vocabulary and is kept, but it is absent
#                 from [workspace.dependencies] above for a measured reason:
#                 the only release satisfying the 1.75 floor is
#                 hickory-resolver 0.25.2, which pulls hickory-proto 0.25.2,
#                 and that carries RUSTSEC-2026-0118 (recorded in the local
#                 advisory database with `patched = []` -- no fixed version
#                 exists at all) and RUSTSEC-2026-0119 (`patched =
#                 [">= 0.26.1"]`). Both fixes live only in the 0.26 line,
#                 which declares MSRV 1.88. Adding it was BUILT AND REVERTED
#                 to confirm the diagnosis: the graph resolves and bans,
#                 licences and sources all still pass, but `cargo deny check
#                 advisories` goes from ok to FAILED, which is AAP 0.8.4
#                 gate 9. Enabling the feature is therefore a hard build
#                 failure raised by a compile_error! in
#                 curl-rs-lib/src/lib.rs rather than a silent no-op. The DNS
#                 note above records the full derivation; when the conflict is
#                 decided the pin belongs HERE, per AAP 0.4.2, with
#                 `optional = true` on the member's side.
#
#   memdebug      A counting GlobalAlloc reproducing the log format of
#                 lib/memdebug.c (MEM <src>:<line> malloc(<n>) = <ptr> and
#                 its calloc/strdup/wcsdup/realloc/free siblings, plus the
#                 LIMIT, FD, FILE and BT records that tests/memanalyzer.pm
#                 parses). Those five are the complete set of record
#                 prefixes: every curl_dbg_log() call site in
#                 lib/memdebug.c was read, and `grep -c ADDR
#                 lib/memdebug.c` returns 0 - the record at
#                 lib/memdebug.c:136 is `BT %s:%d -- %s\n`, the
#                 USE_BACKTRACE-gated back-trace line that
#                 tests/memanalyzer.pm:116 matches with /^BT/ and discards.
#                 tests/memanalyzer.pm:349 does retain a legacy ^ADDR branch,
#                 but no emitter in the C tree ever feeds it, so naming ADDR
#                 here would describe a record that cannot occur. The same
#                 measurement is recorded against the code that has to
#                 produce these bytes, in curl-rs-lib/src/ffi/sys.rs.
#
#                 The feature is needed only if the decision to withhold
#                 the "Debug" feature from the version banner is reversed,
#                 because the harness gates every allocation-cap and
#                 leak check on that banner token. Off by default keeps
#                 those 28 <limits> fixtures inert rather than failing.
#
# This vocabulary replaces the 101 configure.ac knobs (57 AC_ARG_ENABLE plus
# 44 AC_ARG_WITH), of which roughly ninety select a capability and the rest
# configure build plumbing Cargo handles natively.
#
# Advertising a capability that is not implemented is worse than omitting
# one: the test harness parses the Features: and Protocols: lines of
# `curl --version` to decide which fixtures to run, so under-reporting
# skips cleanly while over-reporting converts a skip into a hard failure.
# curl-rs-lib/src/version.rs must report exactly the features enabled here.
[workspace.metadata.curl-rs]
# Parity anchors, each measured from the C tree rather than assumed, so the
# ABI workflow and the version banner have one place to read them from.
libcurl-version = "8.19.0-DEV"          # include/curl/curlver.h:35
libcurl-version-num = "0x081300"        # include/curl/curlver.h:61
libtool-version-info = "12:0:8"         # lib/Makefile.soname
soname = "libcurl.so.4"                 # derived from the line above
exported-symbols = 100                  # lib/libcurl.def, counted
curlcode-discriminants = 103            # include/curl/curl.h, CURL_LAST = 102

[workspace.metadata.curl-rs.features]
default = [
  "http2",
  "http3",
  "ftp",
  "ssh",
  "websockets",
  "cookies",
  "hsts",
  "altsvc",
  "doh",
  "brotli",
  "zstd",
  "gzip",
]
optional = [
  "negotiate",
  "hickory-dns",
  "memdebug",
]

# Continuous-integration tooling. These are installed by the workflows with
# `cargo install --locked --version <v>`; they are NOT dependencies of any
# crate and must never appear in [workspace.dependencies]. Pinned here so that
# each installing workflow gets exactly these versions rather than whatever is
# newest on the day it runs. rust-audit.yml installs cargo-audit and cargo-deny
# from these pins, and rust-coverage.yml installs cargo-llvm-cov; both
# workflows are on disk.
[workspace.metadata.curl-rs.ci-tools]
cargo-llvm-cov = "0.8.7"                # >= 80% on protocols/ and transfer/
cargo-audit = "0.22.2"                  # zero critical advisories
cargo-deny = "0.20.2"                   # licence and duplicate-version policy
cross = "0.2.5"                         # aarch64-unknown-linux-gnu leg

# Build profiles - deliberately conservative.
#
# Performance is an explicit non-goal of this work: no latency target and no
# throughput requirement exists anywhere in the requirements, and a change
# justified solely by speed is out of scope. So there is no `lto = "fat"`,
# no `codegen-units = 1` and no opt-level tuning here. `lto = false` is
# written out only to say that the omission is a decision rather than an
# oversight.
[profile.release]
lto = false

# panic = "abort" is PROHIBITED, and this is a correctness requirement
# rather than a style preference. curl-rs-ffi is reached from C, and
# unwinding across the C ABI boundary is undefined behaviour, so every
# extern "C" entry point contains the unwind with catch_unwind and converts
# it into the CURLcode a C caller expects. Aborting instead would kill the
# host process - an application that embeds libcurl would die because one
# transfer hit a bug, which is behaviour curl 8.x never exhibits. The
# setting is stated explicitly so it cannot be flipped by inheritance.
panic = "unwind"

# Line tables in release builds. This costs nothing observable and is what
# makes the AddressSanitizer gate produce symbolised stacks instead of raw
# addresses; strip is pinned to "none" for the same reason, because Cargo
# strips release debuginfo by default.
debug = 1
strip = "none"

# Integer overflow panics in release exactly as it already does in dev.
# This is a safety choice, not a performance one: it keeps the release
# binary - the one the fixture suite actually drives - behaving like the
# binary the unit tests exercise, so an arithmetic defect in a length or
# offset calculation cannot silently wrap on the wire only in release.
# Code that intends wrapping arithmetic says so with the wrapping_* methods
# and is unaffected.
overflow-checks = true

# [profile.dev], [profile.test] and [profile.bench] keep their Cargo
# defaults on purpose: dev already enables debug-assertions and
# overflow-checks, and test and bench inherit from dev and release
# respectively. Miri and the sanitizer legs pass their own flags on the
# command line rather than through a bespoke profile, so that what CI
# measures is the same profile a developer builds.
