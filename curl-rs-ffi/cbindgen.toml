# cbindgen configuration -- the ONLY one in this workspace
#
# Role. curl-rs-ffi/build.rs loads this file and drives cbindgen 0.29.4 with
# it to regenerate include/curl/curl.h and its generated siblings from the
# Rust source of curl-rs-ffi. This is the only cbindgen configuration in the
# workspace; an exhaustive listing of the repository root confirmed there is
# no second one. Do NOT add one.
#
# Why this file matters more than its size suggests. The direction of
# generation INVERTS relative to the C build: there, lib/optiontable.pl read
# include/curl/curl.h to emit easyoptions.c (lib/Makefile.am:179-180); here
# Rust source is the source of truth and include/curl/curl.h is an OUTPUT.
# Everything that consumes the public header therefore consumes this file's
# decisions -- including the 129 programs in docs/examples/, which compile
# against it and are the strictest check on it.
#
# Tool version. cbindgen 0.29.4, pinned once in the root manifest's
# [workspace.dependencies] and declared as this crate's only
# build dependency (curl-rs-ffi/Cargo.toml [build-dependencies]). Every key
# below was checked against that version's own schema, read from
# cbindgen-0.29.4/src/bindgen/config.rs in the vendored registry source.
# THIS MATTERS: all thirteen config structs there carry
# #[serde(deny_unknown_fields)], so an unrecognised key is a hard error, not
# a silently ignored line. Measured: appending one bogus key made cbindgen
# exit 101 with "unknown field ... expected one of ...". Never suppress such
# a diagnostic; fix the key.
#
# Text hygiene, and why this file is deliberately plain ASCII.
# scripts/spacecheck.pl walks `git ls-files` and rejects, for any path not in
# one of its allow-lists, a tab, a non-LF line ending, trailing whitespace, a
# missing or duplicated newline at EOF, two consecutive blank lines, and ANY
# byte in 0x80-0xff. This path appears in none of those allow-lists
# (@tabs, @need_crlf, @double_empty_lines, @non_ascii), so the constraints
# all apply. That is why no typographic dash, arrow or section sign appears
# anywhere below. The [*] section of .editorconfig applies too: charset
# utf-8, indent_style space, insert_final_newline, trim_trailing_whitespace.
# Measured: all twelve headers under include/curl/ are themselves pure ASCII,
# tab-free and trailing-space-free, so the verbatim blocks embedded here
# introduce none of those defects.
#
# TOML string form. Every verbatim block below uses a multi-line LITERAL
# string (three single quotes), never a basic string (three double quotes).
# This is not a preference: the prologue contains backslash line
# continuations at curl.h:37-42, :43-44, :46-55, :78, :90-96 and the epilogue
# has more at :3323-3326 and :3333-3340. A basic string would interpret every
# one of those as an escape and corrupt the header. Verified that no header
# under include/curl/ contains a three-single-quote sequence, so the literal
# form can hold them all.

# What cbindgen CANNOT express, established before anything was configured
# Configuring around these four facts is the entire job of this file.
#
# (a) CURL_DEPRECATED sits in two positions no emitter has a mechanism for.
#     Measured: 48 occurrences in include/curl/curl.h and 2 in
#     include/curl/multi.h. Between an enumerator name and its value:
#         CURLSSLBACKEND_NSS                    CURL_DEPRECATED(8.3.0, "") = 3,
#     and between a function's return type and its name:
#         CURL_EXTERN CURLMcode CURL_DEPRECATED(7.19.5, "Use ...")
#         curl_multi_socket(CURLM *multi_handle, curl_socket_t s, int *rh);
#     Full attribution of all 50, because the commonly cited list is
#     incomplete:
#       curl.h enums   curl_sslbackend 7, CURLformoption 18, CURLFORMcode 8,
#                      CURLINFO 9                                     (= 42)
#       curl.h #define :43, :58 (the two CURL_DEPRECATED definitions),
#                      :1121 (CURLOPTDEPRECATED)                       (= 3)
#       curl.h protos  curl_formadd :2632, curl_formget :2658,
#                      curl_formfree :2668                             (= 3)
#       multi.h protos curl_multi_socket :317,
#                      curl_multi_socket_all :325                      (= 2)
#     Note CURLoption carries no LITERAL token: its 17 deprecated members go
#     through the CURLOPTDEPRECATED macro (curl.h:1121-1122). It is excluded
#     all the same. CURLformoption and CURLFORMcode are excluded too, which
#     a minimum list based on the literal-token count would have missed.
#
# (b) Four of the twelve public headers are not generatable at all, and
#     build.rs must NEVER write to them. Measured line counts:
#       include/curl/system.h        399  pure platform detection producing
#                                         curl_off_t, CURL_FORMAT_CURL_OFF_T,
#                                         CURL_TYPEOF_CURL_SOCKLEN_T, ...
#       include/curl/stdcheaders.h    35  four libc prototypes (fread,
#                                         fwrite, strcasecmp, strncasecmp)
#       include/curl/curlver.h        78  all #define, including the
#                                         function-like CURL_VERSION_BITS and
#                                         CURL_AT_LEAST_VERSION
#       include/curl/typecheck-gcc.h 958  61 "#define curlcheck_" directives,
#                                         60 distinct names because
#                                         curlcheck_cb_data is defined twice
#                                         (once behind an #if 0). 260
#                                         curlcheck_ token occurrences spread
#                                         over 258 lines, and that line count
#                                         is where the figure "258 curlcheck_
#                                         macros" comes from: it is neither a
#                                         macro count nor an occurrence count.
#                                         cbindgen cannot express any of it,
#                                         so the header is hand-maintained and
#                                         shipped verbatim beside the
#                                         generated one, and it must stay
#                                         correct because the 129 example
#                                         programs compile with it active.
#     Nothing in this file names any of the four as a generation target, and
#     build.rs carries the matching guard as a separate mandatory check.
#
# (c) cbindgen's emission order cannot place curl.h's include guard.
#     Measured from cbindgen-0.29.4 language_backend/clike.rs write_headers,
#     the real order is: package_version, header, include_guard,
#     pragma_once, include_version, autogen_warning, then includes. But
#     curl.h puts the guard on lines 1-2, BEFORE the boxed banner on lines
#     3-25. No ordering of cbindgen's own knobs produces that. A second,
#     independent disqualification: write_footers spells the close
#     "#endif  /* NAME */" with TWO spaces, while curl.h:3344 has one.
#     Therefore include_guard is deliberately UNSET; the guard-open lines
#     lead the `header` string and the guard-close ends `trailer`. Do not
#     "simplify" this back to include_guard.
#
# (d) Platform-conditional includes cannot be expressed by flat lists.
#     curl.h:62-103 holds ten includes wrapped in conditionals: the
#     FreeBSD/MidnightBSD <sys/param.h> block, an eleven-platform list
#     guarding <sys/select.h>, a Win32 block guarding <winsock2.h> and
#     <ws2tcpip.h> behind a _WINSOCKAPI_/_WINSOCK_H/__LWIP_OPT_H__/
#     LWIP_HDR_OPT_H co-existence check, and a #ifndef _WIN32 block for
#     <sys/socket.h> and <sys/time.h>. cbindgen offers only ordered flat
#     `includes` and `sys_includes` lists, so no_includes is set and every
#     include directive lives verbatim in `header`.

# Language and layout

# C, not C++. The public headers are C; C++ consumers are served by the
# `#ifdef __cplusplus` / `extern "C" {` wrapper, which is verbatim in
# `header` and `trailer` for the reason given under cpp_compat below.
language = "C"

# 79, NOT cbindgen's default of 100. This is a live CI gate, evidenced:
#   scripts/checksrc.pl:29   my $max_column = 79;
#   scripts/checksrc.pl:588  if(length($l) > $max_column &&
#                               $l !~ / https:\/\//) {
#   scripts/checksrc.pl:176  'LONGLINE' => "Line longer than $max_column",
#   include/curl/Makefile.am:24-26 sets pkginclude_HEADERS to the twelve
#     headers, and :36 runs
#     checksrc.pl -D$(top_srcdir)/include/curl $(pkginclude_HEADERS)
#   scripts/checksrc-all.pl walks git-tracked files per directory, so
#     include/curl/*.h is covered wherever checksrc.pl runs. The dedicated
#     checksrc CI workflow is retired - C-style linting is superseded by
#     clippy and rustfmt - so the surviving invocation is the
#     include/curl/Makefile.am:36 rule quoted just above.
# Measured: `awk 'length>79'` yields ZERO lines across all twelve headers
# today, so the gate is currently green and must stay green. The single
# exemption is a line containing " https://", excused by checksrc.pl:588.
# .editorconfig independently sets max_line_length = 79 for [*.{c,h}].
#
# The value is 70, NOT 79, and the nine-column gap is measured rather than
# guessed. For a function-pointer typedef cbindgen weighs only the type
# itself: it excludes the leading `typedef ` (8 columns) and the terminating
# `;` (1). Measured with line_length = 79 and again with 78, the declaration
#     typedef size_t (*curl_formget_callback)(void *arg, const char *buf,
#                                             size_t len);
# was emitted on ONE line of exactly 80 columns and tripped build.rs's
# HEADER_MAX_COLUMNS guard, because cbindgen had weighed it as 80 - 9 = 71
# and found 71 within budget. Lowering the budget to 40 made it wrap, which
# confirms the setting does reach the typedef writer and that only the
# accounting is offset. 79 - 9 = 70 is therefore the largest budget that
# cannot emit an 80-column line.
#
# The guard in build.rs remains the authority and is deliberately NOT
# relaxed: it enforces the include/curl/Makefile.am:36 rule, and
# `awk 'length>79'` must stay at zero lines across all twelve headers. If a
# future prototype overflows despite this budget, the guard fails the build
# and names the line -- which is the intended behaviour, not a regression.
line_length = 70

# Two-space indentation, and no tabs anywhere. .editorconfig sets
# indent_size = 2 for [*.{c,h}], the twelve headers all follow it, and
# checksrc.pl flags TABS.
tab_width = 2

# Deterministic line endings. Matches rustfmt.toml's newline_style = "Unix"
# and satisfies spacecheck.pl, which rejects any non-LF EOL for this file
# type. Never "native": that would make the generated header depend on the
# machine that ran the build, and a build must be reproducible.
line_endings = "LF"

# FALSE, and this is a measured decision rather than an omission.
# cbindgen 0.29.4 with language = "C" and cpp_compat = true emits, from
# language_backend/clike.rs:966-1020, a SECOND extern "C" block that wraps
# only the globals and functions:
#     #ifdef __cplusplus
#     extern "C" {
#     #endif // __cplusplus
#     ...
#     #ifdef __cplusplus
#     }  // extern "C"
#     #endif  // __cplusplus
# Four things are wrong with that here, all observed by running it:
#   1. It nests inside the verbatim wrapper this file already supplies.
#   2. It wraps the wrong region. curl.h:105-107 opens the block BEFORE
#      `typedef void CURL;` at :109, so the types are inside it too.
#   3. It spells the close `}  // extern "C"`, not curl.h:3309's
#      `} /* end of extern "C" */`.
#   4. It uses // comments, and scripts/checksrc.pl:162 defines
#      'CPPCOMMENTS' => '// comment detected', checked at :666. The output
#      would fail the live checksrc gate outright.
# Separately, open_close_namespaces (clike.rs:74-113) returns early when no
# namespace is configured, so cpp_compat contributes nothing useful either.
# The wrapper is therefore verbatim: opened at the end of `header`, closed
# at the start of `trailer`. Measured: 7 of the 12 headers carry the
# `} /* end of extern "C" */` spelling (curl.h, easy.h, header.h, mprintf.h,
# multi.h, options.h, urlapi.h); websockets.h:95 closes with a bare `}`; and
# curlver.h, stdcheaders.h, system.h and typecheck-gcc.h have no such block
# at all. build.rs reproduces the right form per header.
cpp_compat = false

# cbindgen's own include_guard knob is DELIBERATELY LEFT UNSET, and this
# paragraph exists so that nobody "simplifies" the arrangement back to it.
# See limit (c) above for the two independent reasons: the guard would be
# written after the boxed banner instead of before it, and write_footers
# spells the closing line with two spaces where curl.h:3344 has one. The
# guard-open lines lead the `header` string and the guard-close ends
# `trailer`, both verbatim.

# #pragma once appears in none of curl's public headers. Emitting it would
# add a non-standard directive to a frozen contract.
pragma_once = false

# All include directives live verbatim in `header`; see limit (d). With
# no_includes true and both lists empty and after_includes unset,
# write_headers returns early, so nothing is emitted after
# autogen_warning -- verified by running it.
no_includes = true
sys_includes = []
includes = []

# Would emit "/* Generated with cbindgen:VERSION */" (clike.rs write_headers)
# and "/* Package version: X */" respectively. Both change whenever a version
# changes, producing a spurious diff in a TRACKED, REVIEWED file on every
# build, which would turn the header-parity gate in
# .github/workflows/rust-abi.yml into noise. .gitignore deliberately does not
# ignore include/curl/*.h, because those headers are the reviewed ABI contract,
# and a build must be reproducible.
include_version = false
package_version = false

# `type` produces `typedef enum { ... } NAME;` -- exactly the form all 31
# public enums use (measured: every `} NAME;` line under include/curl/ closes
# an anonymous typedef, from CURLcode to curl_usessl) -- and spells function
# return types `CURLcode`, matching curl.h. The alternatives were built and
# compared:
#   tag   -> `enum CURLcode { ... };` with no typedef, and return types
#            spelled `enum CURLcode f(...)`. Wrong for every enum and every
#            prototype.
#   both  -> `typedef enum CURLcode { ... } CURLcode;` which compiles, but
#            return types are still `enum CURLcode f(...)`.
# The cost of `type` is real and is handled rather than hidden: structs would
# become `typedef struct { ... } X;`, and a self-reference inside an
# anonymous struct loses its `struct` keyword -- observed output
# `curl_slist *next;`, which does not compile. cbindgen 0.29.4 has no
# per-item style override (there is no "style" annotation atom), so the
# resolution is that ALL public structs are pinned verbatim and excluded
# below. That is no loss: their layout is ABI-visible anyway.
style = "type"

# Rust usize must render as size_t, not uintptr_t. Required by, among
# others, `struct curl_blob { void *data; size_t len; unsigned int flags; }`
# (easy.h:34-38) and
# curl_ws_recv(CURL *, void *buffer, size_t buflen, size_t *recv,
#              const struct curl_ws_frame **metap) (websockets.h:53-55).
# Verified: with this set, usize emits as size_t and needs no <stddef.h>,
# which no_includes would have suppressed.
usize_is_size_t = true

# Declaration order follows the Rust source. curl.h's order is semantically
# load-bearing, not cosmetic: CURLcode precedes every function returning it,
# CURLoption precedes curl_easy_setopt, curl_socket_t precedes
# struct curl_waitfd. Alphabetical sorting would break all three. The value
# is case-insensitive in cbindgen (SortKey::from_str lowercases), so "None"
# and "none" are equivalent; "None" is written for readability.
sort_by = "None"

# Doc comments on the Rust items become C comments. The existing headers
# carry extensive commentary that consumers read, so it must survive.
# Style choice is measured, not aesthetic:
#   "c"    -> /*\n text\n */          block comment, no // anywhere
#   "c99"  -> // text                 FORBIDDEN: checksrc.pl:162 CPPCOMMENTS
#   "doxy" -> /**\n * text\n */       curl's headers never use /**
#   "auto" -> same as doxy here
# "full" keeps the whole comment; "short" would truncate to the first
# paragraph and silently drop the per-option prose that docs/libcurl pages
# are cross-checked against.
# CONSTRAINT ON THE RUST SOURCE, measured: cbindgen does NOT re-wrap doc
# text to line_length. A 101-column doc line came out 101 columns wide and
# would fail checksrc LONGLINE. Doc comments in curl-rs-ffi/src/ffi/*.rs
# must therefore be authored at 76 columns or less.
documentation = true
documentation_style = "c"
documentation_length = "full"

# Left at the default (false). Fetching sources for dependencies on all
# targets is what lets cbindgen resolve a type defined behind a #[cfg] on
# another target; restricting it could silently drop a declaration from the
# public header, and the public header is frozen.
only_target_dependencies = false

# Deterministic by construction: no date, no time, no cbindgen version, no
# rustc version, no hostname, no absolute path. Every line is under 79
# columns and the whole thing is a C block comment, so it survives both
# checksrc CPPCOMMENTS and LONGLINE. cbindgen places this immediately after
# `header` (measured order in limit (c)), which puts it inside the include
# guard and after the banner -- exactly where a reader looks first.
# A literal string is used here as everywhere else in this file, so that a
# later edit adding a backslash cannot be silently reinterpreted as an escape.
autogen_warning = '''
/* Generated by curl-rs-ffi/build.rs via cbindgen. Do not edit by hand.
   The source of truth is the Rust crate curl-rs-ffi; for the option
   identifiers and their metadata it is curl-rs-ffi/src/ffi/opts.rs, and
   for the error codes it is curl-rs-ffi/src/ffi/codes.rs. */'''
# `header` -- the verbatim prologue, curl.h:1-148 byte for byte The prologue has
# to pin the five handle declarations exactly as the C headers spell them, and
# in practice it is far larger than five typedefs, because everything cbindgen
# cannot express has to live here. The eleven blocks below are curl.h lines 1
# through 148 reproduced without a byte changed, in curl.h's own order:
#
#   (1)  :1-2     include guard open -- see limit (c); NOT include_guard
#   (2)  :3-25    the 23-line boxed banner, carrying the ASCII curl logo, the
#                 "Copyright (C) Daniel Stenberg" line that satisfies
#                 checksrc.pl's COPYRIGHT check (scripts/checksrc.pl:161) and
#                 the SPDX licence-identifier line naming curl, which
#                 satisfies `reuse lint`. (That tag is spelled out only in
#                 the verbatim banner further down and in this file's own
#                 3-line head; writing it a third time here in prose would
#                 make `reuse` parse the remainder of the sentence as a
#                 licence expression and report it as invalid -- measured.)
#                 Measured: every banner line is 79 columns or
#                 fewer, and the one long line is a https:// URL, which
#                 checksrc.pl:588 exempts anyway. The short #-comment form
#                 used at the top of THIS file is for TOML, never for a C
#                 header.
#   (3)  :27-30   the libcurl-problems comment
#   (4)  :32-34   the CURL_NO_OLDIES block. LOAD-BEARING:
#                 docs/examples/Makefile.am:46 adds -DCURL_NO_OLDIES
#                 unconditionally to all 129 examples, with the comment
#                 "Avoid libcurl obsolete stuff" at :45.
#   (5)  :36-60   the CURL_DEPRECATED / CURL_IGNORE_DEPRECATION cascade, 25
#                 lines keyed on __GNUC__ > 12 (or == 12 with
#                 __GNUC_MINOR__ >= 1), __clang__ >= 3,
#                 __IAR_SYSTEMS_ICC__, !__INTEL_COMPILER,
#                 !CURL_DISABLE_DEPRECATION and !BUILDING_LIBCURL, with the
#                 IAR _Pragma("diag_suppress=Pe1444") variant, the GCC
#                 diagnostic push/pop variant, and the #else no-ops.
#                 LOAD-BEARING: .github/scripts/verify-examples.pl:40 passes
#                 -DCURL_DISABLE_DEPRECATION, so without this block that flag
#                 becomes meaningless and the gate's meaning changes silently.
#   (6)  :62-63   #include "curlver.h" and #include "system.h", comments and
#                 column alignment preserved. These are two of the four
#                 headers build.rs must never write; curl.h consumes them.
#   (7)  :65-103  the ten platform-guarded system includes -- see limit (d).
#   (8)  :105-107 the extern "C" open -- see cpp_compat above for why this is
#                 verbatim rather than generated.
#   (9)  :109-110 TWO OF THE FIVE HANDLE DECLARATIONS, and the reason this
#                 prologue exists. `typedef void CURL;` and
#                 `typedef void CURLSH;` are void, NOT opaque structs.
#                 cbindgen's natural output for an opaque Rust type
#                 is `typedef struct X X;`, which diverges from all three and
#                 changes the type of every handle-passing call. Consumers
#                 that assign a `CURL *` to a `void *` -- a widespread idiom,
#                 present in the examples -- would begin emitting warnings or
#                 errors." The remaining three belong to their own headers'
#                 prologues, which build.rs owns: `typedef void CURLM;`
#                 (multi.h:57), `typedef struct Curl_URL CURLU;`
#                 (urlapi.h:107, a genuine opaque struct whose tag differs
#                 from its typedef name) and the layout-visible
#                 `struct CURLMsg { ... }; typedef struct CURLMsg CURLMsg;`
#                 (multi.h:97-105).
#   (10) :112-136 the linkage-decoration block: the
#                 CURL_HAS_DECLSPEC_ATTRIBUTE(x) shim and the five-branch
#                 CURL_EXTERN cascade (CURL_STATICLIB; _WIN32 or
#                 declspec-capable, splitting on BUILDING_LIBCURL between
#                 dllexport and dllimport; BUILDING_LIBCURL with
#                 CURL_HIDDEN_SYMBOLS; else empty). Every one of the 100
#                 exported prototypes is decorated CURL_EXTERN.
#                 CURL_EXTERN_SYMBOL is defined only build-side
#                 (lib/curl_config-cmake.h.in, lib/config-os400.h), never for
#                 a consumer, which is why the fourth branch is unreachable
#                 outside our own build.
#                 The decoration of the GENERATED prototypes is handled by
#                 [fn] prefix below, which was verified to work.
#   (11) :138-148 the curl_socket_typedef block, giving curl_socket_t as
#                 SOCKET on Windows outside lwIP and int elsewhere, with
#                 CURL_SOCKET_BAD to match, all behind its own idempotence
#                 guard.
#
# DELIBERATELY NOT HERE, and the reason is recorded so the omission reads as a
# choice: the CURLOPTTYPE_* bases and the CURLOPT / CURLOPTDEPRECATED macros.
# They sit at curl.h:1109-1136, roughly a thousand lines into the body and
# immediately before the CURLoption enum at :1142 that they spell. Hoisting
# them into the prologue would move them and break byte-fidelity for no gain,
# and duplicating them would risk a redefinition. They therefore belong to
# the same build.rs-owned verbatim block as CURLoption itself, spliced at
# their measured position. For review convenience the exact text that block
# must carry is, from curl.h:1109-1136:
#     /* long may be 32 or 64 bits, but we should never depend on anything
#        else but 32 */
#     #define CURLOPTTYPE_LONG          0
#     #define CURLOPTTYPE_OBJECTPOINT   10000
#     #define CURLOPTTYPE_FUNCTIONPOINT 20000
#     #define CURLOPTTYPE_OFF_T         30000
#     #define CURLOPTTYPE_BLOB          40000
#     #define CURLOPT(na, t, nu) na = ((t) + (nu))
#     #define CURLOPTDEPRECATED(na, t, nu, v, m) na CURL_DEPRECATED(v, m) \
#       = ((t) + (nu))
#     #define CURLOPTTYPE_STRINGPOINT CURLOPTTYPE_OBJECTPOINT
#     #define CURLOPTTYPE_SLISTPOINT  CURLOPTTYPE_OBJECTPOINT
#     #define CURLOPTTYPE_CBPOINT     CURLOPTTYPE_OBJECTPOINT
#     #define CURLOPTTYPE_VALUES      CURLOPTTYPE_LONG
# The arithmetic those five bases define is not decoration: the option
# identifier already encodes the argument's type class, since integer division
# of an option value by 10000 recovers its base. That encoding looks like a
# historical curiosity and is in fact what makes the design type-safe. It is
# what lets the single-trailing-pointer setters described under [fn] be
# sound.
#
# The string below MUST NOT end with a newline: cbindgen writes `header` and
# then calls new_line() itself, so a trailing newline here would produce a
# blank line that scripts/spacecheck.pl would count toward its
# consecutive-blank-line check.
header = '''
#ifndef CURLINC_CURL_H
#define CURLINC_CURL_H
/***************************************************************************
 *                                  _   _ ____  _
 *  Project                     ___| | | |  _ \| |
 *                             / __| | | | |_) | |
 *                            | (__| |_| |  _ <| |___
 *                             \___|\___/|_| \_\_____|
 *
 * Copyright (C) Daniel Stenberg, <daniel@haxx.se>, et al.
 *
 * This software is licensed as described in the file COPYING, which
 * you should have received as part of this distribution. The terms
 * are also available at https://curl.se/docs/copyright.html.
 *
 * You may opt to use, copy, modify, merge, publish, distribute and/or sell
 * copies of the Software, and permit persons to whom the Software is
 * furnished to do so, under the terms of the COPYING file.
 *
 * This software is distributed on an "AS IS" basis, WITHOUT WARRANTY OF ANY
 * KIND, either express or implied.
 *
 * SPDX-License-Identifier: curl
 *
 ***************************************************************************/

/*
 * If you have libcurl problems, all docs and details are found here:
 *   https://curl.se/libcurl/
 */

#ifdef CURL_NO_OLDIES
#define CURL_STRICTER /* not used since 8.11.0 */
#endif

/* Compile-time deprecation macros. */
#if (defined(__GNUC__) &&                                              \
  ((__GNUC__ > 12) || ((__GNUC__ == 12) && (__GNUC_MINOR__ >= 1))) ||  \
  (defined(__clang__) && __clang_major__ >= 3) ||                      \
  defined(__IAR_SYSTEMS_ICC__)) &&                                     \
  !defined(__INTEL_COMPILER) &&                                        \
  !defined(CURL_DISABLE_DEPRECATION) && !defined(BUILDING_LIBCURL)
#define CURL_DEPRECATED(version, message)                       \
  __attribute__((deprecated("since " # version ". " message)))
#ifdef __IAR_SYSTEMS_ICC__
#define CURL_IGNORE_DEPRECATION(statements) \
      _Pragma("diag_suppress=Pe1444") \
      statements \
      _Pragma("diag_default=Pe1444")
#else
#define CURL_IGNORE_DEPRECATION(statements) \
      _Pragma("GCC diagnostic push") \
      _Pragma("GCC diagnostic ignored \"-Wdeprecated-declarations\"") \
      statements \
      _Pragma("GCC diagnostic pop")
#endif
#else
#define CURL_DEPRECATED(version, message)
#define CURL_IGNORE_DEPRECATION(statements)     statements
#endif

#include "curlver.h"         /* libcurl version defines   */
#include "system.h"          /* determine things runtime */

#include <stdio.h>
#include <limits.h>

#if defined(__FreeBSD__) || defined(__MidnightBSD__)
/* Needed for __FreeBSD_version or __MidnightBSD_version symbol definition */
#include <sys/param.h>
#endif

/* The include stuff here below is mainly for time_t! */
#include <sys/types.h>
#include <time.h>

#if defined(_WIN32) && !defined(_WIN32_WCE) && !defined(__CYGWIN__)
#if !(defined(_WINSOCKAPI_) || defined(_WINSOCK_H) || \
      defined(__LWIP_OPT_H__) || defined(LWIP_HDR_OPT_H))
/* The check above prevents the winsock2.h inclusion if winsock.h already was
   included, since they cannot co-exist without problems */
#include <winsock2.h>
#include <ws2tcpip.h>
#endif
#endif

/* HP-UX systems version 9, 10 and 11 lack sys/select.h and so does oldish
   libc5-based Linux systems. Only include it on systems that are known to
   require it! */
#if defined(_AIX) || defined(__NOVELL_LIBC__) || defined(__NetBSD__) || \
    defined(__minix) || defined(__INTEGRITY) || \
    defined(ANDROID) || defined(__ANDROID__) || defined(__OpenBSD__) || \
    defined(__CYGWIN__) || defined(AMIGA) || defined(__NuttX__) || \
   (defined(__FreeBSD_version) && (__FreeBSD_version < 800000)) || \
   (defined(__MidnightBSD_version) && (__MidnightBSD_version < 100000)) || \
    defined(__sun__) || defined(__serenity__) || defined(__vxworks__)
#include <sys/select.h>
#endif

#ifndef _WIN32
#include <sys/socket.h>
#include <sys/time.h>
#endif

#ifdef __cplusplus
extern "C" {
#endif

typedef void CURL;
typedef void CURLSH;

/*
 * libcurl external API function linkage decorations.
 */

#ifdef __has_declspec_attribute
#define CURL_HAS_DECLSPEC_ATTRIBUTE(x) __has_declspec_attribute(x)
#else
#define CURL_HAS_DECLSPEC_ATTRIBUTE(x) 0
#endif

#ifdef CURL_STATICLIB
#  define CURL_EXTERN
#elif defined(_WIN32) || \
     (CURL_HAS_DECLSPEC_ATTRIBUTE(dllexport) && \
      CURL_HAS_DECLSPEC_ATTRIBUTE(dllimport))
#  ifdef BUILDING_LIBCURL
#    define CURL_EXTERN  __declspec(dllexport)
#  else
#    define CURL_EXTERN  __declspec(dllimport)
#  endif
#elif defined(BUILDING_LIBCURL) && defined(CURL_HIDDEN_SYMBOLS)
#  define CURL_EXTERN CURL_EXTERN_SYMBOL
#else
#  define CURL_EXTERN
#endif

#ifndef curl_socket_typedef
/* socket typedef */
#if defined(_WIN32) && !defined(__LWIP_OPT_H__) && !defined(LWIP_HDR_OPT_H)
typedef SOCKET curl_socket_t;
#define CURL_SOCKET_BAD INVALID_SOCKET
#else
typedef int curl_socket_t;
#define CURL_SOCKET_BAD (-1)
#endif
#define curl_socket_typedef
#endif /* curl_socket_typedef */'''
# `trailer` -- the verbatim epilogue, curl.h:3308-3344 byte for byte
# Four blocks, in curl.h's own order. Line numbers were measured, not
# inherited: the extern "C" close is at :3308-3310, one line earlier than is
# commonly cited.
#
#   (1) :3308-3310  the extern "C" close, spelled
#                   `} /* end of extern "C" */`. Verbatim because cpp_compat
#                   would emit `}  // extern "C"` instead, which
#                   scripts/checksrc.pl:162 rejects as a // comment.
#   (2) :3312-3320  the umbrella include block, comment included. THE ORDER
#                   IS A COMPILE-ORDER DEPENDENCY, NOT A STYLE CHOICE.
#                   multi.h:347-408 defines CURLMoption using curl.h's
#                   CURLOPT(na,t,nu) macro, so multi.h can neither be
#                   generated nor included independently of curl.h. Measured
#                   include graph: only multi.h, urlapi.h and mprintf.h
#                   include curl.h themselves; easy.h, options.h, header.h
#                   and websockets.h contain NO #include at all and depend
#                   entirely on curl.h having already defined CURL, CURLcode,
#                   CURLoption, CURLINFO, CURL_EXTERN and size_t. Note the
#                   two-space continuation indent on the comment's second
#                   line and the inline comment on the easy.h line; both are
#                   preserved.
#   (3) :3322-3342  the typechecker block. BOTH branches are live, exercised
#                   paths: .github/scripts/verify-examples.pl:40 compiles
#                   with typecheck-gcc.h ACTIVE, while
#                   .github/scripts/verify-synopsis.pl:38 passes
#                   -DCURL_DISABLE_TYPECHECK and so takes the #else branch.
#                   Note the asymmetry at :3339: the curl_multi_setopt macro
#                   parameter list is spelled `(handle,opt,param)` with NO
#                   spaces after the commas, unlike the other three. It is
#                   reproduced exactly, because normalising it would be an
#                   unrequested change to a frozen file.
#   (4) :3343-3344  a blank line, then the guard close
#                   `#endif /* CURLINC_CURL_H */`.
#
# GUARD-CLOSE ASYMMETRY ACROSS THE TWELVE HEADERS, measured so that build.rs
# gets its per-header trailer table right: only easy.h and multi.h end with a
# BARE `#endif`. The other ten use `#endif /* CURLINC_<NAME>_H */`, namely
# curl.h, curlver.h, header.h, mprintf.h, options.h, stdcheaders.h, system.h,
# typecheck-gcc.h, urlapi.h and websockets.h.
#
# As with `header`, this string must NOT end with a newline. cbindgen's
# write_trailer appends one only when the trailer lacks it, so ending here
# yields exactly one newline at end of file -- which is what
# scripts/spacecheck.pl requires, since it rejects both a missing EOL at EOF
# and a duplicated one.
trailer = '''
#ifdef __cplusplus
} /* end of extern "C" */
#endif

/* unfortunately, the easy.h and multi.h include files need options and info
  stuff before they can be included! */
#include "easy.h" /* nothing in curl is fun without the easy stuff */
#include "multi.h"
#include "urlapi.h"
#include "options.h"
#include "header.h"
#include "websockets.h"
#include "mprintf.h"

/* the typechecker does not work in C++ (yet) */
#if ((defined(__GNUC__) && defined(__GNUC_MINOR__) && \
      ((__GNUC__ > 4) || (__GNUC__ == 4 && __GNUC_MINOR__ >= 3))) || \
    (defined(__clang__) && __clang_major__ >= 14)) && \
    !defined(__cplusplus) && !defined(CURL_DISABLE_TYPECHECK)
#include "typecheck-gcc.h"
#else
#if defined(__STDC__) && (__STDC__ >= 1)
/* This preprocessor magic that replaces a call with the exact same call is
   only done to make sure application authors pass exactly three arguments
   to these functions. */
#define curl_easy_setopt(handle, opt, param) \
  (curl_easy_setopt)(handle, opt, param)
#define curl_easy_getinfo(handle, info, arg) \
  (curl_easy_getinfo)(handle, info, arg)
#define curl_share_setopt(share, opt, param) \
  (curl_share_setopt)(share, opt, param)
#define curl_multi_setopt(handle,opt,param) \
  (curl_multi_setopt)(handle, opt, param)
#endif /* __STDC__ >= 1 */
#endif /* gcc >= 4.3 && !__cplusplus && !CURL_DISABLE_TYPECHECK */

#endif /* CURLINC_CURL_H */'''

# [parse] -- read this crate and nothing else
[parse]
# false, and this is the mechanism that gives internal linkage real
# enforcement. cbindgen must not walk into curl-rs-lib, whose internals are
# pub(crate) and must never reach the public header. C declares internals
# extern in a header and relies on a Curl_ prefix, so they are private by
# convention but visible to the linker; Rust makes them private by
# enforcement. Parsing dependencies would quietly undo that and leak engine
# types into the ABI contract.
parse_deps = false
# Belt and braces. With parse_deps false this list is inert, but it is
# declared so that flipping that flag cannot silently pull either of this
# crate's two dependencies into the header. curl-rs-ffi/Cargo.toml declares
# exactly these two: the engine and libc.
exclude = ["curl-rs-lib", "libc"]

[parse.expand]
# Empty on purpose. Macro expansion runs `cargo expand`, which requires a
# nightly toolchain, and rust-toolchain.toml pins the workspace to stable
# 1.97.1. Enabling it would break every build on the pinned toolchain and would
# make the generated header depend on a compiler this project does not ship
# with. Nothing in curl-rs-ffi's public surface is macro-generated: the option
# identifiers come from an ordinary const table in curl-rs-ffi/src/ffi/opts.rs,
# which must be the SINGLE source of truth for both the generated enumeration
# and the curl_easy_option_by_name / _by_id / _next introspection API backed by
# struct curl_easyoption (include/curl/options.h:51-56). Two populations of that
# data would drift, and the drift would be invisible until a consumer looked an
# option up by name and got the wrong identifier.
crates = []

# [defines] -- deliberately EMPTY, and that is a decision
# This table maps Rust cfg predicates onto C preprocessor symbols so that a
# conditionally compiled item is emitted inside an #ifdef. Not one entry is
# justified here, for a reason that goes to the heart of the contract:
#
#   The libcurl API is frozen, including the integer value behind every
#   public enumerator. A [defines]-driven #ifdef would make the public header
#   vary with build configuration, so the same header would describe
#   different ABIs depending on which features were selected.
#
#   The concrete case is the 24 unimplemented schemes: out of scope for
#   implementation but NOT for the ABI. Their CURLPROTO_*
#   constants (curl.h:1080-1107) and the stub schemes' CURLoption entries
#   must appear UNCONDITIONALLY, and a request for one of them returns
#   CURLE_UNSUPPORTED_PROTOCOL at run time. Honest reporting happens through
#   the Protocols: line of curl --version, which the harness parses, NOT
#   through #ifdefs in the header. Handled that way, 283 fixtures skip
#   cleanly; handled with #ifdefs, consumers would compile
#   against a header that silently lost declarations.
#
# The fifteen Cargo features (curl-rs-ffi/Cargo.toml [features]) are all pure
# forwards to curl-rs-lib and none of them changes a public declaration, so
# there is nothing for this table to map even if it were desirable. If a
# future feature ever did gate a public declaration, that would be a design
# error to report rather than to encode here.
[defines]

# [export] -- partition the surface; keep cbindgen away from what it cannot
#             express
[export]
# Six kinds, and the two omissions are the load-bearing part.
#
#   OMITTED "globals". Measured: lines 2-101 of lib/libcurl.def contain 100
#   names and every one is a function; zero data symbols are exported. The
#   symbol-parity gate looks for text symbols (nm -D --defined-only ... | grep '
#   T curl_'). Allowing globals could only ever add a symbol that fails that
#   comparison.
#
#   OMITTED "opaque". This is the mechanical guard for the handle-typedef
#   problem. cbindgen renders an opaque Rust type as `typedef struct X X;`.
#   For CURL, CURLM and CURLSH that is simply wrong -- they are
#   `typedef void` (curl.h:109, curl.h:110, multi.h:57) -- and for CURLU it
#   is wrong in a subtler way, because urlapi.h:107 spells it
#   `typedef struct Curl_URL CURLU;`, where the tag differs from the typedef
#   name and cbindgen would emit `typedef struct CURLU CURLU;`. Omitting the
#   item type means no accident of visibility can ever produce those lines;
#   all five handle declarations are verbatim instead. The three genuinely
#   opaque contexts curl_mime, curl_mimepart (curl.h:2428-2429) and
#   curl_pushheaders (curl.h:500, forward declaration only) are verbatim for
#   the same reason.
#
# "typedefs" is required and not optional: 30 of curl's public declarations
# are callback function-pointer typedefs (measured across include/curl/*.h),
# and they are the largest single category cbindgen genuinely generates well.
item_types = ["enums", "structs", "unions", "typedefs", "constants", "functions"]

# Forced emission. cbindgen only writes a type that is REACHABLE from the
# exported API -- verified by observation: a public #[repr(C)] struct used by
# no exported signature was silently omitted until it was named here. Because
# the prototypes listed under `exclude` below are the only referents of
# several enums (CURLMoption appears solely in curl_multi_setopt,
# CURLSHoption solely in curl_share_setopt, CURLMSG solely inside
# struct CURLMsg), those enums would vanish from the header without this
# list, and a vanished enum is an ABI regression that compiles cleanly until
# a consumer uses it.
#
# The list is therefore complete rather than minimal: it names every one of
# curl's public enums that is NOT excluded, and every generated callback
# typedef. Measured against the twelve frozen headers: 35 declarations of the
# form `} NAME;` close an anonymous `typedef enum`, five are excluded below
# (CURLFORMcode, CURLINFO, CURLformoption, CURLoption, curl_sslbackend), and
# these are the remaining 30.
#
# CORRECTED. This comment previously read "31 declarations ... these are the
# remaining 26", which was wrong twice over: the true total is 35, and
# curlfiletype, curliocmd, curlioerr and curlsocktype appeared in NEITHER
# list, so the "complete" claim was false and those four enums were silently
# absent from the generated header. They are included below.
#
# The 34 callback typedefs are listed for the same reason as the enums: with
# no exported prototypes referencing them yet, none is reachable from an
# exported signature, so each would be omitted. The 35th public callback,
# curl_sshkeycallback, is deliberately NOT here -- its fourth parameter is
# `enum curl_khmatch`, a bare enum tag the authority never typedefs, and
# cbindgen emits only anonymous `typedef enum { .. } NAME;` so it declares no
# tag to refer to. That one prototype is verbatim in build.rs.
include = [
  "CURLcode",
  "CURLHcode",
  "CURLMcode",
  "CURLMinfo_offt",
  "CURLMoption",
  "CURLMSG",
  "CURLproxycode",
  "CURLSHcode",
  "CURLSHoption",
  "CURLsslset",
  "CURLSTScode",
  "CURLUcode",
  "CURLUPart",
  "CURLversion",
  "curl_closepolicy",
  "curl_easytype",
  "curl_ftpauth",
  "curl_ftpccc",
  "curl_ftpcreatedir",
  "curl_ftpmethod",
  "curl_infotype",
  "curl_lock_access",
  "curl_lock_data",
  "curl_proxytype",
  "curl_TimeCond",
  "curl_usessl",
  "curlfiletype",
  "curliocmd",
  "curlioerr",
  "curlsocktype",

  # The 34 generated callback typedefs (see the note above).
  "curl_calloc_callback",
  "curl_chunk_bgn_callback",
  "curl_chunk_end_callback",
  "curl_closesocket_callback",
  "curl_conv_callback",
  "curl_debug_callback",
  "curl_fnmatch_callback",
  "curl_formget_callback",
  "curl_free_callback",
  "curl_hstsread_callback",
  "curl_hstswrite_callback",
  "curl_ioctl_callback",
  "curl_lock_function",
  "curl_malloc_callback",
  "curl_multi_timer_callback",
  "curl_notify_callback",
  "curl_prereq_callback",
  "curl_progress_callback",
  "curl_push_callback",
  "curl_read_callback",
  "curl_realloc_callback",
  "curl_resolver_start_callback",
  "curl_seek_callback",
  "curl_socket_callback",
  "curl_sockopt_callback",
  "curl_sshhostkeycallback",
  "curl_ssl_ctx_callback",
  "curl_strdup_callback",
  "curl_trailer_callback",
  "curl_unlock_function",
  "curl_write_callback",
  "curl_xferinfo_callback",
]

# Everything cbindgen must not emit, grouped by the reason it cannot. Each
# group carries its justification, because the ABI is a contract and an
# unexplained exclusion is precisely how a declaration disappears from it
# unnoticed. The names are the C names cbindgen would
# emit; no renaming is configured, so they are also the Rust names.
#
# GROUP 1 -- the five handle declarations, pinned verbatim.
#   CURL, CURLSH   curl.h:109-110, `typedef void`
#   CURLM          multi.h:57, `typedef void`
#   CURLU          urlapi.h:107, `typedef struct Curl_URL CURLU;`
#   Curl_URL       the tag behind CURLU; excluded so no stray definition of
#                  it can appear
#   curl_socket_t  curl.h:138-148, a conditional typedef (SOCKET on Windows
#                  outside lwIP, int elsewhere) behind an idempotence guard
#                  that no emitter can reproduce
#
# GROUP 2 -- the three opaque contexts, verbatim for the reason under
# item_types: curl_mime, curl_mimepart, curl_pushheaders.
#
# GROUP 3 -- the five enums whose members carry CURL_DEPRECATED between the
# enumerator name and its value. The reason is sharper than "cbindgen has no
# mechanism". cbindgen 0.29.4 DOES have a mechanism -- [enum]
# deprecated_variant_with_note -- and it places the attribute in exactly the
# right position:
#     CURLE_OBSOLETE20 CURL_DEPRECATED(8.3.0, "8.3.0") = 20,
# It still cannot be used, for two reasons found by reading
# cbindgen-0.29.4/src/bindgen/ir/annotation.rs:70-100 and confirming the
# output. First, the substitution is `format.replace("{}", &format!("{note:?}"))`,
# so the note is always rendered with Rust's Debug formatting and therefore
# always wrapped in escaped double quotes; curl.h needs an UNQUOTED version
# token as the first argument, as in CURL_DEPRECATED(8.3.0, ""). Second, the
# format string is global to the whole config, while curl.h uses seven
# different versions across these declarations -- 7.19.5, 7.56.0, 7.61.0,
# 7.69.0, 7.82.0, 8.3.0 and 8.15.0 -- and one global format cannot vary per
# declaration. Measured occurrence counts, which also correct the commonly
# cited minimum list:
#   curl_sslbackend  7   curl.h:151-167
#   CURLINFO         9
#   CURLformoption  18
#   CURLFORMcode     8
#   CURLoption       0 literal tokens, but its 17 CURLOPTDEPRECATED members
#                    expand to CURL_DEPRECATED, and all 308 of its members
#                    are spelled through the CURLOPT / CURLOPTDEPRECATED
#                    macros (curl.h:1120-1122), which no emitter reproduces
#
# GROUP 4 -- the 18 public structs. curl.h declares every one of them with a
# tag and no typedef, and `style = "type"` (see above) cannot produce that
# form; for the self-referential ones it produces code that does not compile.
# CURLMsg additionally has a LAYOUT-VISIBLE shape that consumers read
# directly, so it is verbatim on its own merits -- see [struct] below.
#
# GROUP 5 -- the prototypes. Two overlapping problems, both measured:
#   Variadic:    cbindgen will not emit `...` from a non-variadic Rust
#                function, and a genuinely C-variadic extern "C" Rust
#                function fails on stable with error[E0658] (tracking
#                issue 44930). The Rust side is
#                therefore non-variadic with a single trailing *mut c_void
#                and C calls it through the variadic prototype in the header.
#   Decorated:   [fn] deprecated_with_note emits the attribute BEFORE the
#                return type (verified output:
#                `CURL_EXTERN\nCURL_DEPRECATED(...)\nCURLcode f(...);`),
#                whereas curl.h puts it AFTER the return type
#                (multi.h:317-318). And the ten mprintf prototypes each carry
#                a CURL_TEMP_PRINTF(n, m) attribute on the FOLLOWING line
#                with a two-space indent, keyed on a preprocessor cascade
#                that mprintf.h defines at :35-54 and #undefs at :81; [fn]
#                postfix is global, single-valued and same-line, so it
#                cannot express any of that.
exclude = [
  # Group 1: handle declarations (curl.h:109-110, multi.h:57, urlapi.h:107,
  # curl.h:138-148)
  "CURL",
  "CURLSH",
  "CURLM",
  "CURLU",
  "Curl_URL",
  "curl_socket_t",
  # Group 2: opaque contexts (curl.h:2428-2429, curl.h:500)
  "curl_mime",
  "curl_mimepart",
  "curl_pushheaders",
  # Group 3: enums spelled with CURL_DEPRECATED or the CURLOPT macros
  "curl_sslbackend",
  "CURLoption",
  "CURLINFO",
  "CURLformoption",
  "CURLFORMcode",
  # Group 4: the 18 tag-form structs, all layout-visible
  "CURLMsg",
  "curl_blob",
  "curl_certinfo",
  "curl_easyoption",
  "curl_fileinfo",
  "curl_forms",
  "curl_header",
  "curl_hstsentry",
  "curl_httppost",
  "curl_index",
  "curl_khkey",
  "curl_slist",
  "curl_sockaddr",
  "curl_ssl_backend",
  "curl_tlssessioninfo",
  "curl_version_info_data",
  "curl_waitfd",
  "curl_ws_frame",
  # Group 5a: the four option setters and getter, C-variadic
  # (easy.h:42, easy.h:59, multi.h:429-430, curl.h:3080-3081)
  "curl_easy_setopt",
  "curl_easy_getinfo",
  "curl_multi_setopt",
  "curl_share_setopt",
  # Group 5b: variadic AND CURL_DEPRECATED (curl.h:2632-2635)
  "curl_formadd",
  # Group 5c: CURL_DEPRECATED after the return type (curl.h:2658, curl.h:2668,
  # multi.h:317, multi.h:325). A deprecated exported symbol may not be
  # removed, so all four stay DECLARED -- verbatim, with their
  # attribute intact -- and all four remain in the 100-symbol parity set.
  "curl_formget",
  "curl_formfree",
  "curl_multi_socket",
  "curl_multi_socket_all",
  # Group 5e: twelve prototypes whose FROZEN signature names a type that this
  # crate's Rust spelling cannot ask cbindgen to produce. All four reasons were
  # measured against the generated output and against gcc; none is a matter of
  # taste, and AAP 0.8.1 freezes parameter lists and return types, so the
  # frozen declaration is carried verbatim instead.
  #
  #   REASON 1 -- an enum where the Rust parameter or return must be a plain
  #   integer. Measured against the frozen libcurl.so.4.8.0: curl_easy_strerror
  #   answers for -2, curl_easy_option_by_id answers for 0, -1, 99999 and
  #   INT_MAX, and curl_version_info answers for values that are not CURLversion
  #   variants. A C caller may therefore legally pass any int, and materialising
  #   such a value in a Rust #[repr(C)] enum parameter is undefined behaviour.
  #   cbindgen has no directive that declares a parameter as an enum type while
  #   the Rust type is an integer, so it emitted `int error` for the four
  #   strerror functions, `int` returns for curl_global_init and
  #   curl_global_init_mem, `int id` for curl_easy_option_by_id and
  #   `int stamp` for curl_version_info.
  #
  #   REASON 2 -- a tag-form struct in the signature. curl_easyoption is already
  #   excluded above (group 4) because curl.h declares it with a tag and no
  #   typedef, so cbindgen rendered the three introspection prototypes as
  #   `const curl_easyoption *`, which is not a valid C type name without the
  #   `struct` keyword and which gcc rejects outright.
  #
  #   REASON 3 -- a leaked internal type. The frozen curl_getdate returns
  #   `time_t`; the engine's type is i64, and cbindgen emitted
  #   `typedef int64_t TimeT;` into the public curl.h along with
  #   `TimeT curl_getdate(...)`. That adds a new public type to a frozen ABI.
  #   Excluding the prototype removes the typedef with it, because no other
  #   exported signature references it.
  #
  #   REASON 4 -- const qualification. curl_global_sslset's out-parameter is
  #   `const curl_ssl_backend ***avail` in the frozen header; cbindgen emitted
  #   `const curl_ssl_backend *const **avail`, which is a qualification
  #   mismatch at every call site.
  #
  # The symbols themselves are still defined and exported by this crate; only
  # the DECLARATION is hand-written. `check_export_coverage` in build.rs counts
  # them as verbatim, and VERBATIM_FUNCTIONS is 31 rather than 19 because of
  # these twelve.
  "curl_easy_strerror",
  "curl_multi_strerror",
  "curl_share_strerror",
  "curl_url_strerror",
  "curl_global_init",
  "curl_global_init_mem",
  "curl_global_sslset",
  "curl_getdate",
  "curl_version_info",
  "curl_easy_option_by_name",
  "curl_easy_option_by_id",
  "curl_easy_option_next",
  # Group 5d: the ten mprintf prototypes, every one carrying
  # CURL_TEMP_PRINTF(n, m) on the next line; five are variadic and five take
  # a va_list, which would additionally require the <stdarg.h> that
  # no_includes suppresses (mprintf.h:56-79)
  "curl_mprintf",
  "curl_off_t",
  "curl_mfprintf",
  "curl_msprintf",
  "curl_msnprintf",
  "curl_mvprintf",
  "curl_mvfprintf",
  "curl_mvsprintf",
  "curl_mvsnprintf",
  "curl_maprintf",
  "curl_mvaprintf",
]

# `prefix` is deliberately absent rather than set to an empty string, which
# cbindgen would treat as a real prefix. The C names are already spelled in
# full in the Rust source, so any prefix would corrupt all 100 of them.
# `renaming_overrides_prefixing` is absent for the same reason: with no
# prefix and no renaming there is nothing for it to arbitrate.
#
# No [export.rename] table and no [export.mangle] table. Every exported name
# is frozen and the set is asserted by nm parity against lib/libcurl.def, so
# not one of the 100 functions may be renamed. No
# legitimate case exists in this crate either: curl-rs-ffi/src/ffi/*.rs
# spells each item with its C name, which is what makes the `exclude` list
# above readable as C names.
#
# PARTITIONING ACROSS THE OUTPUT HEADERS. This file holds the SHARED
# configuration plus the umbrella curl.h prologue and epilogue.
# curl-rs-ffi/build.rs owns the per-header split: it loads this config once
# and, for each generated header, overrides `header`, `trailer` and
# `[export] include` before running cbindgen again. That is also where the
# verbatim blocks excluded above are spliced back in, and where the
# per-header guard-close form and extern "C" close form recorded under
# `trailer` are applied. The four headers named as non-targets in limit (b)
# are never written by any of those passes.

# [enum] -- integer exactness is the entire point
# A C program compiled against curl 8.x embeds the numeric value of every
# enumerator it uses. Reproducing the names without the numbers produces a
# library that links and then misbehaves: an error compared against
# CURLE_SSL_CONNECT_ERROR matches a different condition entirely, with no
# diagnostic anywhere.
#
# The facts every emitted enum must satisfy, all measured in this tree so a
# reviewer can check them from here:
#
# CURLcode -- 103 tokens. Only CURLE_OK = 0 is explicit in the C source
#   (curl.h:519); the enum closes at curl.h:648 with CURL_LAST = 102 on :647.
#   CURLE_ECH_REQUIRED = 101 is the highest real error and
#   CURLE_TOO_LARGE = 100 precedes it. Verified anchors: CURLE_OK 0,
#   CURLE_UNSUPPORTED_PROTOCOL 1, CURLE_FAILED_INIT 2, CURLE_URL_MALFORMAT 3,
#   CURLE_COULDNT_RESOLVE_HOST 6, CURLE_COULDNT_CONNECT 7,
#   CURLE_OUT_OF_MEMORY 27, CURLE_OPERATION_TIMEDOUT 28,
#   CURLE_SSL_CONNECT_ERROR 35, CURLE_TOO_MANY_REDIRECTS 47,
#   CURLE_PEER_FAILED_VERIFICATION 60.
#   EXACTLY 15 retired CURLE_OBSOLETE* placeholders occupy
#   {20, 24, 29, 32, 34, 40, 41, 44, 46, 50, 51, 57, 62, 75, 76} -- names
#   CURLE_OBSOLETE20/24/29/32/34/40/41/44/46/50/51/57/62/75/76 -- and every
#   one must be present, because omitting a single placeholder shifts every
#   later code by one. ORDINAL INFERENCE IS PROHIBITED:
#   curl-rs-ffi/src/ffi/codes.rs is to write all 103 discriminants
#   explicitly, and cbindgen then emits them explicitly, which it does
#   whenever the Rust discriminants are explicit. Do not be misled by the
#   four further CURLE_OBSOLETE10/12/16 names near curl.h:660-664: those
#   are back-compat #defines OUTSIDE the enum and are not placeholders
#   within it.
#
# CURLoption -- excluded above, but its arithmetic is recorded here because
#   the same table drives the introspection API. Measured: 291 `CURLOPT(`
#   invocations plus 17 `CURLOPTDEPRECATED(` invocations give 308 enum
#   members. SEPARATELY there are 19 `#define CURLOPT_*` lines, of which 17
#   are true aliases and 2 are numeric (CURLOPT_OBSOLETE72 9999 at :733 and
#   CURLOPT_OBSOLETE40 9999 at :734), so the public CURLOPT_ name universe is
#   327. NOTE the arithmetic trap: the familiar phrase "291 invocations plus
#   17 aliases = 308" conflates two different 17s -- the 17 deprecated
#   members and the 17 true aliases are distinct sets that happen to be the
#   same size. The sum is right and the structure is wrong. The highest index
#   is 328, at CURLOPT_LASTENTRY (curl.h:2261, "the last unused"). Aliases
#   must resolve to identical integers: CURLOPT_ENCODING to
#   CURLOPT_ACCEPT_ENCODING (:667), CURLOPT_FILE to CURLOPT_WRITEDATA (:725),
#   CURLOPT_INFILE to CURLOPT_READDATA (:726), CURLOPT_WRITEHEADER to
#   CURLOPT_HEADERDATA (:727), and so on to CURLOPT_RTSPHEADER at :2306.
#
# curl_sslbackend -- excluded above; 15 members explicitly numbered 0 to 14,
#   with CURLSSLBACKEND_RUSTLS = 14 at curl.h:166. That value already
#   exists, so curl_global_sslset reports a rustls backend without inventing
#   an enumerant.
#
# CURLMcode -- generated, and its FIRST discriminant is NEGATIVE:
#   CURLM_CALL_MULTI_PERFORM = -1 at multi.h:60, with CURLM_OK = 0 next.
#   Verified that cbindgen emits the -1 unchanged. Do not confuse this enum
#   with CURLMSG (multi.h:91-95: CURLMSG_NONE, CURLMSG_DONE, CURLMSG_LAST),
#   which is a different enum with a confusingly similar name.
#
# curl_easytype -- generated, and the cleanest case in the header: 9 members,
#   ordinal 0 to 8, no explicit values and no CURL_DEPRECATED --
#   CURLOT_LONG, CURLOT_VALUES, CURLOT_OFF_T, CURLOT_OBJECT, CURLOT_STRING,
#   CURLOT_SLIST, CURLOT_CBPTR, CURLOT_BLOB, CURLOT_FUNCTION
#   (options.h:31-41), with the single flag CURLOT_FLAG_ALIAS (1 << 0) at
#   options.h:47.
#
# CURLUcode -- generated; ordinal, with each value carried in a trailing
#   comment: CURLUE_OK, then CURLUE_BAD_HANDLE /* 1 */,
#   CURLUE_BAD_PARTPOINTER /* 2 */, CURLUE_MALFORMED_INPUT /* 3 */,
#   CURLUE_BAD_PORT_NUMBER /* 4 */, CURLUE_UNSUPPORTED_SCHEME /* 5 */ and
#   onward. Those comments survive because `documentation` is on, provided
#   the Rust source carries them as doc comments.
[enum]
# The C enumerators already carry their full names -- CURLE_OK, not
# CURLcode_OK -- so no name may be prepended.
prefix_with_name = false
# MANDATORY. A sentinel is an extra variant appended to the enum, which would
# occupy the next integer and, for any enum whose last member is a real
# contract value, change what CURL_LAST and the *_LAST members mean.
add_sentinel = false
# All of these emit C++ helper methods, cast helpers, stream operators or
# tagged-union machinery. None has any counterpart in curl's headers, and
# several would additionally emit // comments or static_assert lines that
# scripts/checksrc.pl:162 and the C89-declaration compatibility of the
# generated header would reject.
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_ostream = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
derive_tagged_enum_copy_assignment = false
private_default_tagged_enum_constructor = false
# Irrelevant under language = "C" -- it selects `enum class` for C++ -- and
# set explicitly so the value reads as a decision rather than a default.
enum_class = false
# No variant renaming is configured anywhere in this table. The key that
# would do it is absent by design: every enumerator name is frozen, and a
# renamed enumerator is an ABI break that compiles.
# `cast_assert_name`, `must_use`, `deprecated`, `deprecated_variant` and the
# two *_with_note formats are likewise absent -- see GROUP 3 above for the
# measured reason the deprecation formats cannot be used.

# [struct] -- no operators, no constructors, nothing C would not accept
# Every one of curl's 18 public structs is excluded above, so this table
# governs nothing today. It is declared in full anyway, because the defaults
# it pins are what keep a future addition from silently emitting C++ into a C
# header.
#
# The struct that matters most, and why it can never be generated:
# struct CURLMsg is LAYOUT-VISIBLE. Measured at multi.h:97-105:
#     struct CURLMsg {
#       CURLMSG msg;       /* what this message means */
#       CURL *easy_handle; /* the handle it concerns */
#       union {
#         void *whatever;    /* message-specific data */
#         CURLcode result;   /* return code for transfer */
#       } data;
#     };
#     typedef struct CURLMsg CURLMsg;
# Consumers write msg->data.result directly, so the field name `data` and
# BOTH union member names `whatever` and `result` are part of the ABI.
# cbindgen names anonymous unions itself, so the shape is not reproducible;
# the struct is pinned verbatim in the multi.h prologue instead. Its layout
# must be asserted by test, which a #[cfg(test)] module in
# curl-rs-ffi/src/ffi/handle.rs is to do by checking size_of, align_of and
# every field offset.
#
# The other 17 are curl_blob (easy.h:34-38, with CURL_BLOB_COPY 1 and
# CURL_BLOB_NOCOPY 0 at easy.h:31-32), curl_slist, curl_waitfd
# (multi.h:114-118, with CURL_WAIT_POLLIN 0x0001, CURL_WAIT_POLLPRI 0x0002
# and CURL_WAIT_POLLOUT 0x0004 at multi.h:110-112 -- note these live in
# multi.h, not easy.h), curl_httppost, curl_forms, curl_fileinfo,
# curl_sockaddr, curl_khkey, curl_certinfo, curl_tlssessioninfo,
# curl_version_info_data, curl_ssl_backend, curl_header, curl_ws_frame,
# curl_easyoption, curl_hstsentry and curl_index.
#
# curl_slist KEEPS ITS C SHAPE ONLY AT THE BOUNDARY. Internally it is a Vec: the
# intrusive linked list is one of the constructs the rewrite exists to remove.
# Nothing should try to make the header describe the internal representation.
[struct]
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false
derive_ostream = false
# Would move associated constants inside the struct body as C++ static
# members. C has no such construct.
associated_constants_in_body = false
# `rename_fields` is absent: field names are ABI-visible, as CURLMsg's `data`
# proves. `must_use`, `deprecated`, `deprecated_with_note` and
# `rename_associated_constant` are absent for want of any use.

# [fn] -- prototypes
[fn]
# YES, THIS WORKS, and it answers the one open question this file was asked
# to settle. Verified by building a crate and running cbindgen 0.29.4: the
# prefix is written immediately before the return type
# (cbindgen-0.29.4/src/bindgen/language_backend/mod.rs:59 and
# write_function_with_layout), producing exactly curl.h's form:
#     CURL_EXTERN CURLcode curl_easy_perform(CURL *curl);
# Every one of the 100 exported prototypes is decorated CURL_EXTERN
# (curl.h:112-136 defines the five-branch cascade), so this is not optional
# decoration -- an undecorated prototype would fail to import correctly on
# Windows and would differ from the frozen declaration.
#
# MEASURED LIMIT. write_function_with_layout emits the prefix and then calls
# write_space(), which writes a NEWLINE when the layout is Vertical. So a
# prototype too long for `line_length` comes out as
#     CURL_EXTERN
#     CURLcode curl_easy_ssls_export(CURL *handle,
#                                    curl_ssls_export_cb *export_fn,
#                                    void *userptr);
# whereas curl.h:3304-3306 keeps CURL_EXTERN on the same line as the return
# type. No setting changes this: `args` offers only horizontal, vertical and
# auto, and "horizontal" would emit lines past 79 columns that
# scripts/checksrc.pl:588 rejects. The output is valid, checksrc-clean C that
# declares the identical function, so it is a justified difference rather
# than a defect -- and every prototype whose exact spelling IS part of the
# contract (the variadics, the CURL_DEPRECATED-bearing ones and the ten
# mprintf ones) is verbatim under `exclude` anyway.
prefix = "CURL_EXTERN"
# Horizontal where it fits within line_length, vertical otherwise, with
# continuation arguments aligned under the opening parenthesis. This is the
# only value that keeps every generated prototype inside 79 columns without
# putting all of them on one line each.
args = "auto"
# Source order, for the same reason as the top-level sort_by: curl.h groups
# its prototypes by interface (easy, multi, share, url, ws) and the
# docs/libcurl manual pages follow that grouping.
sort_by = "None"
# `postfix` is absent. It is global and same-line, so it could not express
# mprintf.h's CURL_TEMP_PRINTF(n, m), which differs per function, sits on the
# following line with a two-space indent, and depends on a preprocessor
# cascade. `deprecated` and `deprecated_with_note` are absent because they
# place the attribute before the return type instead of after it -- see
# GROUP 5 above for the verified output. `must_use`, `no_return`,
# `rename_args` and `swift_name_macro` have no counterpart in curl's headers.
#
# THE FOUR C-VARIADIC SETTERS, and the honest caveats that come with them.
# The prototypes are frozen exactly as follows and are reproduced verbatim:
#     CURL_EXTERN CURLcode curl_easy_setopt(CURL *curl, CURLoption option,
#                                           ...);
#     CURL_EXTERN CURLcode curl_easy_getinfo(CURL *curl, CURLINFO info, ...);
#     CURL_EXTERN CURLMcode curl_multi_setopt(CURLM *multi_handle,
#                                             CURLMoption option, ...);
#     CURL_EXTERN CURLSHcode curl_share_setopt(CURLSH *share,
#                                              CURLSHoption option, ...);
# (easy.h:42, easy.h:59, multi.h:429-430, curl.h:3080-3081; the two-line
# spellings there are curl.h's own wrapping.) The Rust side must be
# NON-variadic, taking one trailing *mut c_void, because a
# true C-variadic extern "C" Rust function fails on stable rustc with
# error[E0658] (tracking issue 44930); C then calls it through the variadic
# prototype above. That was proven end to end -- a C driver compiled against
# the variadic declaration and linked against the Rust definition round-
# tripped all five argument classes exactly: long 30 to 30, long -1 to -1,
# data pointer received, function pointer received, off_t 1<<40 to
# 1099511627776. It is type-safe because the option identifier already
# encodes the argument's type class, so integer division of the option value
# by 10000 recovers its CURLOPTTYPE_* base before the slot is read.
#
# 32-BIT PORTABILITY IS DELIBERATELY FORFEITED AND MUST NOT BE CLAIMED: a
# single register-width slot holds a curl_off_t only where off_t fits a
# register, and all four mandated targets are 64-bit.
#
# ESCALATED AND ENFORCED BY A HARD BUILD FAILURE, never silently accepted. On
# aarch64-apple-darwin -- one of the four required targets -- Apple's arm64
# ABI passes variadic arguments ON THE STACK, while the non-variadic Rust
# callee reads register x2 (measured codegen: "mov x0, x2; ret"). Caller and
# callee would disagree, and the failure is SILENT.
# The remedy is c_variadic, whose current API is ap.next_arg::<T>() with
# VaArgSafe sealed and NOT implemented for raw pointers (which must be read
# as usize and cast); it is stable only on nightly 1.99 and so exceeds the
# mandated MSRV 1.75. Two of the user's own requirements cannot both be met
# by any implementation. The three options -- raise the MSRV, drop that
# target, or accept that one target's varargs entry points are unsupported --
# are all user decisions.
#
# Silent acceptance is the worst of them, so it is impossible rather than
# merely discouraged. build.rs's check_variadic_abi REFUSES to build for
# aarch64-apple-darwin unless the decision is on record as
# CURL_RS_A4_VARIADIC_DECISION=accept-unsupported-varargs, and it refuses on
# ANY target if src/ffi/printf.rs or src/ffi/form.rs appears while the
# decision is unrecorded -- those two own the eleven exports (the ten
# curl_m*printf forms and curl_formadd) that have no ABI-correct expression
# at MSRV 1.75 on any target at all. A cargo:warning would not have been
# enough: it is not a refusal, and the build gate requires a warning-free
# build, so a permanent warning is one that is either suppressed or scrolled
# past. The one warning the gate does emit fires only where the recorded
# acceptance actually suppressed a refusal, so the three targets whose
# variadic ABI is sound stay warning-free and that gate keeps meaning
# something. This file pins the prototypes; build.rs stops the build. Neither
# may be changed without the other.

# [const] -- #define, never static const
# Verified by running it: with both allow_* false, a public Rust const emits
# as `#define NAME value`, which is curl.h's own form. With
# allow_static_const true it would become a `static const` definition in a
# HEADER -- a separate object in every translation unit that includes it,
# usable neither in a case label nor in a preprocessor conditional, which is
# how consumers actually use these values.
#
# The literal spellings are frozen and the asymmetries are real, so they are
# recorded here to be preserved by whoever writes the Rust constants:
#   websockets.h  CURLWS_TEXT (1 << 0), CURLWS_BINARY (1 << 1),
#                 CURLWS_CONT (1 << 2), CURLWS_CLOSE (1 << 3),
#                 CURLWS_PING (1 << 4) and CURLWS_OFFSET (1 << 5) appear
#                 BEFORE curl_ws_recv (:39-44), while
#                 CURLWS_PONG (1 << 6) appears AFTER it (:58); and
#                 CURLWS_RAW_MODE (1L << 0) with
#                 CURLWS_NOAUTOPONG (1L << 1) at :88-89 use the `L` suffix
#                 where the others do not. Both the suffix and the placement
#                 are reproduced.
#   urlapi.h      the flag bits run up to
#                 CURLU_NO_GUESS_SCHEME (1 << 15) at :106.
#   options.h     the single flag CURLOT_FLAG_ALIAS (1 << 0) at :47.
#   curl.h        CURLPROTO_* at :1080-1107 (with
#                 CURLPROTO_ALL ((unsigned long)0xffffffff) at :1107),
#                 CURLSSH_AUTH_* at :853-860, CURLAUTH_*,
#                 CURL_HTTPPOST_*, CURLFOLLOW_ALL 1L at :179 and
#                 CURL_SOCKET_BAD, which is part of the verbatim
#                 curl_socket_typedef block instead.
[const]
allow_static_const = false
allow_constexpr = false
sort_by = "None"

# Tables deliberately absent, so nothing is added back by accident
# [layout] -- `packed` and `aligned_n` would stamp a packing or alignment
#   attribute on every generated struct. curl's public structs use the
#   platform's natural layout, and forcing either would change the ABI of
#   every one of them.
# [ptr] -- `non_null_attribute` and `nullable_attribute` would add nullability
#   annotations that appear nowhere in curl's headers and that the 129
#   examples are not compiled with.
# [macro_expansion] -- `bitflags` expands the bitflags crate's macro. This
#   crate does not use it; the flag constants are plain consts, which is what
#   makes them emit as #define.
# [cython] -- irrelevant under language = "C".
# `namespace`, `namespaces` and `using_namespaces` -- C++ only, and with
#   cpp_compat false they would be inert even in principle.
# `braces` -- left at cbindgen's default, which places the opening brace on
#   the same line, matching curl's headers.
# `after_includes` -- unused: with no_includes set there is no include
#   section for it to follow, and everything it might carry is already in the
#   verbatim prologue in its correct position.

# [export.rename] -- spell tag-only structs with the `struct` keyword
#
# NECESSARY, and proven so rather than assumed. These five structs are
# declared in the frozen headers in TAG form only --  `struct curl_slist { .. };`
# -- and are never typedef'd, so the bare name is not a type in C. Measured
# with gcc against the frozen headers:
#
#     typedef CURLSTScode (*probe)(CURL *easy, curl_hstsentry *e, void *userp);
#     error: unknown type name 'curl_hstsentry'
#
# With `style = "type"` cbindgen refers to a struct by its bare name, which
# produced exactly that invalid C in five generated callback prototypes
# (curl_hstsread_callback, curl_hstswrite_callback, curl_trailer_callback,
# curl_push_callback and curl_opensocket_callback). The header still compiled
# as far as the build script was concerned -- the Rust built, every count
# matched and the column guard passed -- so nothing but compiling the emitted
# C could have caught it.
#
# Renaming the referenced type to include the keyword is the narrowest fix.
# `style` is global: switching it to "tag" or "both" would also change how the
# 19 generated enums are declared, and their `typedef enum { .. } NAME;` form
# is already verified EXACT against the authority on name, value and order.
#
# curl_khkey is tag-only too but needs no entry: its only referent,
# curl_sshkeycallback, is written verbatim.
[export.rename]
"curl_hstsentry" = "struct curl_hstsentry"
"curl_index" = "struct curl_index"
"curl_pushheaders" = "struct curl_pushheaders"
"curl_slist" = "struct curl_slist"
"curl_sockaddr" = "struct curl_sockaddr"
