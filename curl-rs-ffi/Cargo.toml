# curl-rs-ffi -- libcurl's C ABI shim
#
# Role. This crate is a facade: it presents libcurl's C surface over the
# curl-rs-lib engine and holds no protocol logic, so the ABI shim stays
# auditable in isolation.
#
# The surface is measured, not estimated. lib/libcurl.def is 101 lines: the
# literal "EXPORTS" on line 1 followed by exactly 100 symbol names, from
# curl_easy_cleanup to curl_ws_start_frame. Those 100 names are the oracle the
# symbol-parity gate compares against, and the deprecated-but-still-exported
# curl_multi_socket and curl_multi_socket_all are part of the set.
#
# Position in the graph. curl-rs-ffi -> curl-rs-lib <- curl-rs, acyclic, with
# this crate a leaf: no workspace member depends on curl-rs-ffi.
#
# Text hygiene. This file is pure ASCII, spaces only, LF endings, no trailing
# whitespace, no consecutive blank lines and exactly one newline at EOF.
# scripts/spacecheck.pl enforces every one of those over `git ls-files` and this
# path appears in none of its allow-lists, so a tab, a CRLF or any byte in
# 0x80-0xff would fail the hygiene gate. The [*] section of .editorconfig
# applies too; it has no TOML-specific section.

[package]
# Must match the root manifest's member list character for character.
name = "curl-rs-ffi"

# Shared metadata is inherited, never restated: the workspace manifest is the
# single place versions are declared, so a literal version, edition or
# rust-version here would reintroduce exactly the drift the root exists to
# prevent. This file carries no version literal of any kind.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

# description is deliberately crate-local rather than inherited. The root's
# description names the project as a whole, but package metadata is consumed
# per crate (cargo metadata, cargo tree, cargo deny and cargo audit reports),
# and this crate's job -- the C ABI -- is distinct from the engine's and the
# CLI's. Inheriting would make all three members indistinguishable there.
#
# It states the crate's ROLE, not a symbol count. "exporting libcurl's
# 100-symbol surface" would be a current-state claim, and it is not true yet:
# src/ffi/ carries 13 of the 16 files the design assigns those 100 exports to,
# and 24 of the 100 names are declared `#[no_mangle] pub extern "C"` at this
# commit -- every one of them present in lib/libcurl.def, none invented. The
# description becomes the fuller sentence once the export set is complete and
# the parity gate confirms it.
description = "The C ABI shim for libcurl"

# Not a crates.io package, and this key is load-bearing rather than cosmetic.
# The curl-rs-lib dependency below is a path dependency with no version
# requirement, which cargo reports as an any-version requirement. deny.toml sets
# [bans] wildcards = "deny" with allow-wildcard-paths = true, and cargo-deny
# grants that path exemption only to PRIVATE crates: without `publish = false`
# the bans check fails with "allow-wildcard-paths is enabled, but does not apply
# to public crates as crates.io disallows path dependencies". Restating a
# version on the path dependency would also satisfy the check, but it would
# duplicate the workspace version, so this is the option that keeps both
# invariants. It is honest besides: the artifacts are libcurl.so.4 and libcurl.a
# for system consumers, not a Rust crate.
publish = false

# Version provenance, recorded so that nobody "refreshes" it. The reported
# libcurl version string is 8.19.0-DEV -- include/curl/curlver.h:35
# (LIBCURL_VERSION "8.19.0-DEV"), :39-41 (LIBCURL_VERSION_MAJOR 8, _MINOR 19,
# _PATCH 0) and :61 (LIBCURL_VERSION_NUM 0x081300). AAP 0.8.5 C6 binds every
# parity claim in this workspace to that exact tree at commit 54cf587b9c, and
# AAP 0.8.1 freezes the contract: no version is to be bumped here.
#
# The inherited edition and MSRV come from AAP 0.8.3, which preserves the
# directive verbatim: "Rust edition 2021, MSRV 1.75." That floor is MEASURED
# AND MET. The contrary claim - that home 0.5.12 forces the edition2024 cargo
# feature and that 46 of 327 locked crates exceed 1.75, giving a lowest
# reachable value of 1.88 - is refuted in every part by the committed
# lockfile: it resolves home 0.5.9
# (declared rust-version 1.70.0), and filtering the graph by each of the four
# mandated targets, with and without the implementable feature set, yields a
# maximum declared rust-version of 1.75 in all eight cases, that maximum being
# this workspace's own three crates rather than any dependency, with zero
# edition-2024 packages anywhere.
#
# This crate's own dependencies respect the floor too: libc 0.2.189 at 1.65,
# cbindgen 0.29.4 at 1.74 as a build dependency - which matters here because a
# build-dependency has to compile on the declared floor like any other unit -
# and curl-rs-lib at 1.75 itself. Measured, not inferred: rustc 1.75.0 compiles
# this crate, its build script and every dependency of both, and the resulting
# build emits this crate's two artifacts with the right identity - libcurl.so
# carrying SONAME libcurl.so.4, plus libcurl.a.
#
# The value stays inherited from the one place -- the root manifest -- where it
# could be raised once for all three crates, and
# .github/workflows/rust-build.yml's MSRV job is the gate that keeps the claim
# true rather than merely asserted. The root Cargo.toml carries the full
# derivation, including the two lockfile pins that keep `wasip2` and
# `wit-bindgen` out of the graph, both of which would otherwise arrive
# through cc's build-dependency chain and breach the floor.
#
# The MSRV conflict that remains OPEN is a different one, and it belongs to
# this manifest because this crate declares the artifact it affects: AAP 0.8.6
# ambiguity A4, the varargs ABI on aarch64-apple-darwin, whose remedy
# (`c_variadic`) is stable only on nightly. It is stated in full under
# "Open items" near the end of this file. The dependency-edition matter is AAP
# 0.8.6 ambiguity A6 and is Resolved.

# [lib] -- the two settings every downstream consumer depends on
[lib]
# name = "curl", NOT the package name. Cargo derives artifact file names from
# the lib TARGET name with '-' replaced by '_', so omitting this would emit
# libcurl_rs_ffi.so and libcurl_rs_ffi.a. "curl" plus cargo's automatic "lib"
# prefix yields libcurl.so and libcurl.a, which is what every consumer of this
# build already requires: libcurl.pc.in and curl-config.in both emit `-lcurl`,
# Autotools builds libcurl.la, and CMake sets the output name to libcurl with an
# empty prefix. The literal -lcurl is frozen, and a soname of libcurl.so.4
# stamped on a file named libcurl_rs_ffi.so would be incoherent and would break
# ldconfig. Verified: with this exact pair of settings cargo emits
# target/release/libcurl.so and target/release/libcurl.a. Do not "tidy" this
# name.
name = "curl"

# Exactly two artifacts.
#   cdylib    -> the shared library, whose soname is libcurl.so.4. The number is
#                derived, not chosen: lib/Makefile.soname gives
#                VERSIONCHANGE=12, VERSIONADD=0 and VERSIONDEL=8, hence libtool
#                -version-info 12:0:8 and SONAME = current - age = 12 - 8 = 4.
#                configure.ac and lib/CMakeLists.txt derive the same 4
#                independently.
#   staticlib -> libcurl.a, which `curl-config --static-libs` reports.
# No rlib. This crate is a leaf, nothing depends on it as a Rust library, and a
# third crate type would produce an artifact with no consumer. This is also the
# only crate-type declaration in the workspace: curl-rs-lib stays a plain rlib,
# because a second cdylib would emit a second shared object and destroy the
# single-artifact identity libcurl.so.4.
#
# The soname itself is NOT set here. A rustflag in .cargo/config.toml would
# apply to the curl-rs executable as well -- a real packaging defect, since
# RPM, dpkg and ldconfig read DT_SONAME -- so it is emitted from build.rs as a
# cdylib-scoped link argument. The directive build.rs emits is spelled,
# exactly:
#   println!("cargo:rustc-link-arg-cdylib=-Wl,--soname=libcurl.so.4");
# with a `-Wl,-install_name,@rpath/libcurl.4.dylib` form on macOS; both are
# emitted from the soname stamping step near the head of build.rs's main. The
# trailing `-cdylib` placement is not interchangeable with the older
# `rustc-cdylib-link-arg` spelling, so it is quoted here verbatim rather than
# paraphrased: a manifest comment naming a directive the build script does not
# emit sends the next reader looking for the wrong string.
# That mechanism was measured to work (readelf -d then reports "Library soname:
# [libcurl.so.4]"), while the opposite approach - a linker version script handed
# through -C link-arg - was measured NOT to control Rust exports, because
# rustc's internal export list takes precedence. Export parity therefore comes
# from declaration discipline, not from link-time filtering: a cdylib exporting
# only its #[no_mangle] pub extern "C" items measured two dynamic symbols, both
# curl_*, with nothing leaked.
crate-type = ["cdylib", "staticlib"]
# path is omitted on purpose: the default src/lib.rs is the intended root.

# [dependencies] -- two entries, each one justified
[dependencies]
# The engine, and the only path dependency of this crate. The workspace has
# exactly three path dependencies among its own members and no private registry,
# vendored crate or internal package feed.
#
# default-features = false is a decision, not a habit. The twelve default-on
# capabilities are re-enabled below through this crate's own `default` feature,
# one forward per capability, so the engine ends up with exactly the same set.
# Without it, `cargo build -p curl-rs-ffi --no-default-features` would still
# leave the engine's twelve enabled and the ABI-visible capability report -
# curl_version, curl_version_info, @SUPPORT_FEATURES@, @SUPPORT_PROTOCOLS@ -
# would over-state what was actually built. Under-reporting a capability is
# safe; over-reporting is not.
#
# No version key: see publish = false above for the measured cargo-deny reason.
curl-rs-lib = { path = "../curl-rs-lib", default-features = false }

# Required, not speculative. core::ffi covers c_char, c_int, c_long and c_void,
# and usize covers size_t, but on the declared MSRV it has neither fd_set nor
# time_t, and both appear in the 100-symbol surface - curl_multi_fdset takes
# three `fd_set *` arguments, and curl_getdate returns time_t. curl_socket_t
# needs no help: it is a plain int on non-Windows targets, so c_int is exact
# there. The version is pinned once in the root's [workspace.dependencies].
libc = { workspace = true }

# [build-dependencies] -- exactly two crates
[build-dependencies]
# curl-rs-ffi is the only crate in the workspace that generates a C header, so
# it is the only one with a cbindgen build dependency. The generation direction
# inverts relative to the C build, where lib/optiontable.pl read
# include/curl/curl.h to emit easyoptions.c; here Rust source is the source of
# truth and include/curl/curl.h is the output.
#
# deny.toml grants MPL-2.0 to cbindgen alone, on the stated grounds that it is a
# build-time header generator never linked into libcurl.so.4 or the curl-rs
# binary - which holds precisely because it appears here, as a build dependency,
# and nowhere else. The version is pinned once in the root's
# [workspace.dependencies].
cbindgen = { workspace = true }

# The `log` facade, and the reason it is here rather than in [dependencies]:
# only a BUILD dependency is visible to build.rs, so an entry in the runtime
# table resolves to `error[E0433]: cannot find module or crate log` when the
# build script names it.
#
# It exists so cbindgen's own diagnostics can be captured and made fatal.
# cbindgen reports a dropped module through `log::warn!`
# (cbindgen-0.29.4/src/bindgen/parser.rs:390, whose own comment reads "This
# should be an error, but it's common enough to just elicit a warning") and
# installs a logger only in its command-line binary
# (cbindgen-0.29.4/src/main.rs:323-328). Used as a library, `log`'s default
# no-op logger discards every one of the 36 warn!/error! records in
# src/bindgen/ and `generate()` returns Ok -- the measured fail-open behind
# measured: a live run warned "can't find mod ffi", exited 0
# and emitted a header containing neither CURLE_OK nor curl_easy_init.
#
# This adds a dependency EDGE and no new package: cbindgen already depends on
# log, the version is already pinned once in the root's
# [workspace.dependencies] and already resolved in Cargo.lock, so the audited
# package set is unchanged and cargo-deny's duplicate-version ban is unaffected.
log = { workspace = true }

# Nothing else belongs here. build.rs compiles no C and links no system
# library, so cc, bindgen and pkg-config have no role; needing one would be
# evidence the design had drifted, to be reported rather than accommodated.
# build.rs also renders curl-config and libcurl.pc from the repository's
# curl-config.in and libcurl.pc.in templates, which AAP 0.5.3 requires to
# "continue to report the correct version, soname, feature set, and link line"
# -- plain substitution of the @VARIABLE@ tokens those templates already use,
# which deliberately needs no templating crate and keeps the build-dependency
# surface at exactly one crate.

# Cryptographic provider: this manifest's obligation is entirely NEGATIVE
#
# rustls, tokio-rustls and quinn are deliberately absent from this file, and no
# feature declared below can reach them. They are pinned once, in the root's
# [workspace.dependencies], each with default-features = false and the "ring"
# provider, and with platform-verifier omitted so that curl's own --cacert,
# --capath and --insecure semantics stay authoritative.
#
# The mechanism that makes this a whole-graph concern: CARGO UNIONS FEATURES
# ACROSS THE ENTIRE DEPENDENCY GRAPH. There is no local scope for feature
# selection. Enabling aws_lc_rs here, or any feature that transitively enables
# it, would silently link a second cryptographic provider even though the root
# said default-features = false.
#
# The provider declaration is the single most consequential manifest decision in
# the workspace, because the upstream default feature sets disagree with one
# another - rustls and tokio-rustls default to aws_lc_rs while quinn and
# quinn-proto default to rustls-ring. Accepting them causes four defects at
# once: duplicated cryptographic code; a build-time requirement for CMake and
# NASM from aws-lc-rs's vendored C and assembly, likely to break the
# cross-compiled aarch64 Linux leg; a large vendored-C surface sitting awkwardly
# against the no-C-TLS requirement; and rustls's default `prefer-post-quantum`,
# whose hybrid X25519MLKEM768 key exchange changes the bytes of the TLS
# ClientHello relative to curl 8.x - which, against a byte-exact and
# order-significant fixture comparison, puts every HTTPS fixture at risk.
# deny.toml bans aws-lc-rs and aws-lc-sys outright as a second line of defence.
#
# Disclosed caveat, escalated rather than resolved: neither ring nor aws-lc-rs
# is pure Rust; both contain C and assembly. The constraint is satisfied in the
# sense that matters - no C TLS library is linked, because rustls implements the
# TLS state machine, record layer and certificate verification in Rust and the
# provider supplies only primitives. ring is chosen as the more portable and
# more readily cross-compiled of the two. This reaches the ABI:
# curl_global_sslset reports CURLSSLBACKEND_RUSTLS, whose value 14 already
# exists in curl_sslbackend, so no enumerant is invented.
#
# One related decision, resolved in favour of accuracy: build.rs renders
# @SSL_BACKENDS@ as the truthful token "rustls", never "rustls-ffi", even though
# the harness keys its `rustls` feature off a rustls-ffi token. The truthful
# token costs the rustls-gated fixtures a skip, which is the safe direction, and
# deny.toml independently bans the rustls-ffi crate.

# [features] -- forward to the engine, never redefine
#
# Cargo has no [workspace.features] table, so the root fixes the vocabulary at
# exactly fifteen names and each member declares a working table. Every entry
# below is a pure forward, because this crate holds no protocol logic.
#
# Why the ABI crate needs the table at all: the capability set is ABI-visible.
# curl_version and curl_version_info report the feature and protocol set through
# the public ABI, curl_global_sslset reports the TLS backend, and build.rs
# renders @SUPPORT_FEATURES@ and @SUPPORT_PROTOCOLS@ into curl-config and
# libcurl.pc from the same facts. A mismatch between this crate's view and
# curl-rs-lib's view is exactly what the single-vocabulary rule exists to
# prevent: feature advertisement must be truthful, because advertising a
# capability that is not implemented converts a clean fixture skip into a hard
# failure.
[features]
# The twelve default-on capabilities, re-enabling on the engine exactly what
# default-features = false switched off. negotiate, hickory-dns and memdebug are
# absent from this list by design; each is justified where it is declared.
default = [
  "http2",
  "http3",
  "ftp",
  "ssh",
  "websockets",
  "cookies",
  "hsts",
  "altsvc",
  "doh",
  "brotli",
  "zstd",
  "gzip",
]

# Protocols and transports. http2 is h2 over ALPN negotiated by rustls, http3 is
# quinn plus h3 over AsyncUdpSocket, and ssh is russh for SFTP and SCP. HTTP/1.1
# and file have no feature of their own: both are unconditionally in core scope.
http2 = ["curl-rs-lib/http2"]
http3 = ["curl-rs-lib/http3"]
ftp = ["curl-rs-lib/ftp"]
ssh = ["curl-rs-lib/ssh"]
websockets = ["curl-rs-lib/websockets"]

# State stores. Each owns an on-disk format that must stay byte-compatible with
# curl 8.x, which is why they are the engine's to implement and are only
# forwarded from here.
cookies = ["curl-rs-lib/cookies"]
hsts = ["curl-rs-lib/hsts"]
altsvc = ["curl-rs-lib/altsvc"]

# DNS-over-HTTPS, served by the engine's own HTTP client.
doh = ["curl-rs-lib/doh"]

# Content encodings, replacing the C brotli, zstd and zlib dependencies with the
# brotli, zstd and flate2 crates.
brotli = ["curl-rs-lib/brotli"]
zstd = ["curl-rs-lib/zstd"]
gzip = ["curl-rs-lib/gzip"]

# Default OFF. Negotiate binds the operating system's GSS-API, which is an
# authentication mechanism rather than a TLS library; confining it to a
# non-default feature, with the binding in curl-rs-lib/src/ffi/gss.rs, is what
# keeps the default build free of any linked C security library.
negotiate = ["curl-rs-lib/negotiate"]

# Default OFF: the system resolver is the default, and hickory-dns is the
# opt-in alternative. Forwarding only -- and it forwards to a name that is
# currently reserved rather than implementable, so enabling it is a deliberate
# build failure raised in curl-rs-lib/src/lib.rs rather than a silent no-op.
# It is also the one feature in the vocabulary with no pinned crate version
# anywhere; because this crate only forwards the flag, no version decision
# arises here and none is invented.
hickory-dns = ["curl-rs-lib/hickory-dns"]

# Default OFF. A counting GlobalAlloc reproducing the log format of
# lib/memdebug.c, needed only if the decision to withhold the Debug token from
# the version banner is reversed: the harness gates its entire memory-checking
# block on TrackMemory, which it sets from that token.
memdebug = ["curl-rs-lib/memdebug"]

# Deliberately absent, with reasons, so nothing is added back by accident
#
# [dev-dependencies]: none. The ABI assertions belong at repo-root tests-rs/abi/
# (symbol_parity, enum_values, examples_compile), a directory that does not
# exist at this commit, and the in-crate checks - the
# RAII behaviour of the handle module and the layout of CURLMsg, which is
# layout-visible because consumers read msg->data.result directly - are plain
# #[cfg(test)] modules that need no external crate. Every crate omitted here is
# one fewer version for deny.toml's multiple-versions = "deny" to reconcile.
#
# No tls feature. An off-switchable one would permit a build with no TLS at all,
# contradicting the requirement of rustls exclusively with validation on by
# default. TLS is unconditional.
#
# No staticlib or shared feature, and nothing that selects CURL_STATICLIB.
# crate-type already produces both artifacts unconditionally, and
# -DCURL_STATICLIB is a CONSUMER-side compile flag surfaced through the
# Cflags.private field of libcurl.pc, not a cargo feature.
#
# No [profile.*] table and no panic setting under any profile. Profiles are
# honoured only in the workspace root manifest and cargo WARNS that a member's
# profile is ignored, which would break the zero-warning gate. More importantly,
# panic = "abort" is prohibited workspace-wide precisely because of this crate:
# unwinding must not cross the C ABI boundary, so panics are caught at the
# boundary, and aborting would kill the host process instead. Do not add it for
# smaller binaries.
#
# No [lints] table and no lint levels. The root manifest defines no
# [workspace.lints], so `[lints] workspace = true` would fail to resolve, and
# -D warnings is applied on the command line by the clippy gate so that a lint
# failure names itself rather than hiding inside a build log.
#
# No manifest-level unsafe policy, and none is possible: an unsafe policy is a
# crate-root attribute, not manifest metadata. All three crates carry one, and
# they are not identical. curl-rs-lib and this crate both carry
# `#![deny(unsafe_code)]` at their roots with exactly ONE
# `#[allow(unsafe_code)]` each -- on `pub(crate) mod ffi;` in the engine, and
# on `mod ffi;` here -- while
# curl-rs carries the literal `#![forbid(unsafe_code)]` on both of its roots,
# because it needs no exemption at all. `forbid` is not available where an
# exemption is needed: `#![forbid(unsafe_code)]` plus an inner
# `#[allow(unsafe_code)]` is error[E0453] and does not compile, which is why
# the two crates that need one deny instead. The single allowance in this crate
# is asserted by a test that walks every file under src/, and every unsafe
# block additionally carries a `// SAFETY:` comment.
#
# No [patch], [replace], [source.*] or [registries] table, and no git
# dependency: deny.toml sets allow-git = [] and allows only the public crates.io
# index. No wildcard version anywhere: deny.toml sets wildcards = "deny". No
# links key: this crate links no native library. No link arguments at all, and
# no reference to a linker version script: both belong to .cargo/config.toml and
# build.rs.
#
# No [[bin]], [[bench]], [[example]] or [[test]] target. The only binaries
# belong to curl-rs, and all Rust tests live at repo-root tests-rs/, outside the
# C tests/ tree so the Perl harness stays untouched. There is no benchmark
# harness because performance is an explicit non-goal.

# Open items no setting in this file can resolve
#
# Unresolved, and deliberately not papered over: on aarch64-apple-darwin - one
# of the four mandated targets - Apple's arm64 ABI passes variadic arguments on
# the stack, while the non-variadic single-trailing-pointer callee this ABI
# design relies on reads register x2 (codegen: "mov x0, x2; ret"). Caller and
# callee would disagree, and the failure is silent. The remedy, c_variadic, is
# stable only on nightly 1.99 and so exceeds the mandated MSRV 1.75, which means
# two of the user's own requirements cannot both be met by any implementation.
# The three options are all user decisions: raise the MSRV, drop that target, or
# accept that one target's varargs entry points are unsupported. Silent
# acceptance is the worst of the three, so it is recorded here at the manifest
# that declares the affected artifact.
#
# 32-bit portability is deliberately forfeited and must not be claimed. A single
# register-width slot holds a curl_off_t only where off_t fits a register, and
# all four mandated targets are 64-bit.
