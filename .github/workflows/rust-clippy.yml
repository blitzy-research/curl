# The LINT gate for the Rust workspace.
#
# This workflow runs `cargo clippy` with warnings denied, and it runs
# `cargo fmt --check`. It does nothing else. One workflow per validation gate,
# so that a failure names its own cause: compilation is rust-build.yml's, the
# tests rust-test.yml's, undefined behaviour rust-miri.yml's, the sanitizer
# rust-asan.yml's, coverage rust-coverage.yml's, the supply chain
# rust-audit.yml's, symbol and public-header parity rust-abi.yml's, and the curl
# fixture corpus curl-testsuite.yml's. All nine are on disk, this file among
# them, alongside hygiene.yml, which owns the spelling, prohibited-wording and
# public-header style checks.
#
# That is also why this is not a job inside rust-build.yml: folding it in would
# put a clippy diagnostic and a genuine compilation error behind the same red
# cross.
#
# LINEAGE, AND THE ONE PART OF IT THIS FILE DOES NOT INHERIT. This file
# succeeds the `checksrc` job of the deleted .github/workflows/checksrc.yml,
# whose sole substantive step ran scripts/checksrc-all.pl. That job's coverage
# did NOT all land here, and writing down where the rest went is the point of
# this paragraph, because a workflow that claims a whole inheritance it only
# partly received is how a gate goes missing without anyone noticing.
#
# checksrc-all.pl graded two different populations under one command: the C
# implementation sources, and the public C headers. The two have opposite
# fates under this migration. The C sources in lib/ and src/ are superseded
# by Rust, so a C style linter over them has no target and clippy plus
# rustfmt are its replacement - that half is this file's. The twelve headers
# under include/curl/ are NOT superseded: specification 0.2.1 keeps every one
# of them in scope as the shipped ABI contract, and eight of the twelve are
# now *generated* by curl-rs-ffi/build.rs, which means their style is the
# generator's output rather than anything a human edits. Nothing in this file
# can grade them - clippy does not read C - so that half is owned by the
# `checksrc` job of .github/workflows/hygiene.yml, which runs
# scripts/checksrc.pl over `git ls-files 'include/curl/*.h'`. One gate per
# cause, in two files, rather than one file claiming both.
#
# Two details of the half this file DID inherit are worth writing down:
#
#   scripts/checksrc.pl enforced a 79-column limit (`my $max_column = 79`)
#   among many other C-specific rules. Over Rust code its successor is not a
#   rule in this file but the `max_width` setting in rustfmt.toml, which the
#   rustfmt step below enforces. Over the public headers the original limit
#   still applies literally, enforced by hygiene.yml.
#
#   scripts/checksrc.pl itself MUST REMAIN ON DISK even though
#   scripts/checksrc-all.pl is superseded, and there are now two independent
#   reasons rather than one: .github/scripts/verify-examples.pl hardcodes
#   `./scripts/checksrc.pl` and checkdocs.yml still invokes
#   verify-examples.pl, and hygiene.yml's `checksrc` job invokes the script
#   directly. This workflow neither runs that script nor removes it.
#
# checksrc.yml's other four jobs - `linters`, `complexity`, `xmllint` and
# `miscchecks`, fifteen checks including `reuse lint`, codespell, typos,
# actionlint, zizmor, shellcheck, yamlcheck, spacecheck and badwords - went to
# hygiene.yml, NOT here. Duplicating one would give a single check two owners
# and break the one-gate-per-workflow property above.
#
# WHAT THIS GATE CONTRIBUTES TO THE SAFETY INVARIANT. The invariant is enforced
# by rustc itself, so a violation of it is a compilation error and
# rust-build.yml is where it is owned. The exact mechanism, stated precisely
# because the wording matters: curl-rs-lib/src/lib.rs and
# curl-rs-ffi/src/lib.rs each carry `#![deny(unsafe_code)]` at the crate root
# together with exactly ONE `#[allow(unsafe_code)]`, on `mod ffi`, which is the
# sole sanctioned unsafe island. It is `deny` rather than `forbid` for a reason
# that is not a matter of preference: `forbid` cannot be locally overridden, so
# `forbid` at the root plus an `allow` on the island is rejected outright with
# `error[E0453]: allow(unsafe_code) incompatible with previous forbid`, and AAP
# goal G1 permits only three crates, ruling out moving the island into a fourth.
# `deny` is therefore the strongest attribute that expresses the invariant AAP
# goal G6 actually states. It is not weaker in effect: a stray `unsafe` block
# anywhere outside the island is a hard error, not a warning. curl-rs needs no
# exemption at all, so both of its roots - curl-rs/src/main.rs and
# curl-rs/src/bin/curlinfo.rs - carry `#![forbid(unsafe_code)]` literally, as
# does curl-rs/build.rs.
#
# Measured, so that the division of labour is stated accurately rather
# than assumed: clippy stops on it too, because clippy-driver wraps rustc and
# inherits its lints - a stray `unsafe` block in curl-rs-lib reports here as
# `error: usage of an unsafe block`. That overlap is harmless and this gate
# does not rely on it.
#
# The `// SAFETY:` comment on every unsafe block is NOT held by a clippy lint:
# `clippy::undocumented_unsafe_blocks` is enabled nowhere in this workspace -
# not in clippy.toml, not in a crate attribute, and not in a [lints] table,
# because no member declares one. It is held by an executable test instead,
# `mod source_policy`'s
# `every_unsafe_block_in_this_crate_is_covered_by_a_safety_comment` in
# curl-rs-lib/src/lib.rs, which walks the crate's own sources and runs under
# rust-test.yml. Enabling the lint as well would be a change to a crate root or
# a manifest, not to this file. What this file must do is never weaken
# `-D warnings`, the only mechanism that turns a clippy finding into a failure
# anywhere in the workspace. Hence no `--cap-lints`, no `continue-on-error` and
# no `if:` condition on any step below.

name: 'Rust lint'

'on':
  push:
    branches:
      - master
      - '*/ci'
    # A deny-list, never a `paths:` allow-list. checkdocs.yml uses an allow-list
    # restricted to documentation paths, which is why the hygiene jobs could not
    # be folded into it: an allow-list here would have to name Cargo.toml,
    # clippy.toml, rustfmt.toml, rust-toolchain.toml and every source path in
    # three crates, and the day one was forgotten is the day unlinted code
    # merged without this gate firing. The four entries below are the ones the C
    # build workflows ignore; `projects/**` holds the OS400, Windows and VMS
    # project files, out of scope for this migration entirely.
    paths-ignore:
      - '.circleci/**'
      - 'appveyor.*'
      - 'Dockerfile'
      - 'projects/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.circleci/**'
      - 'appveyor.*'
      - 'Dockerfile'
      - 'projects/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  # Colour off, and not for tidiness. The rustfmt step parses tool output with
  # grep to decide whether rustfmt rejected a configuration option; an ANSI
  # escape sequence embedded in a diagnostic would make an anchored pattern
  # silently stop matching, and an assertion that silently stops matching is
  # worse than no assertion at all.
  CARGO_TERM_COLOR: never

  # This job resolves and downloads the locked dependency graph. A transient
  # registry hiccup should retry, not fail the lint gate and send somebody
  # looking for a clippy finding that is not there.
  CARGO_NET_RETRY: '3'

  # Incremental state is never restored between runs here - no cache is
  # loaded - so it is output that nothing ever reads. This is not a speed
  # tuning; performance is an explicit non-goal of this work and no step
  # below is ordered or configured for it.
  CARGO_INCREMENTAL: '0'

  # THE FOURTEEN IMPLEMENTABLE FEATURES, and never `--all-features`.
  #
  # This was an explicit fourteen-name list, matching rust-build.yml, because the
  # fifteenth declared feature `hickory-dns` used to raise a `compile_error!` and
  # Cargo has no "all except one" selector, so `--all-features` failed this gate
  # on a feature-set error wearing a lint gate's name. That is fixed at the
  # source: the feature still has no crate behind it, but it BUILDS and
  # advertises nothing, so `--all-features` is admissible and covers a future
  # sixteenth feature without an edit here. rust-build.yml's env block carries
  # the full reasoning.
  #
  # Two of the fifteen are default-OFF - `negotiate` and `memdebug` - and are
  # therefore linted by no other step in this file. Their code is where a lint
  # is most likely to go unnoticed, since `negotiate` is the crate's entire
  # GSS-API binding and `memdebug` is a `#[global_allocator]`.

  # CURL_RS_A4_VARIADIC_DECISION MUST NOT BE SET HERE, AND SETTING IT NOW FAILS.
  #
  # curl-rs-ffi's build script refuses to build aarch64-apple-darwin
  # unconditionally, and `cargo clippy --workspace` does run that build script.
  # This job is linux/x86_64-hosted and passes no `--target`, so that refusal's
  # condition is never met here - but the variable is no longer inert on any
  # target: the script refuses outright when it is set, because the acceptance
  # path it used to name has been removed. So a leftover setting would now break
  # this job rather than being ignored by it, which is the intended direction.
  #
  # It was previously set to 'accept-unsupported-varargs' to keep the gate
  # working "if the runner ever changes". That was exactly backwards: on an Apple
  # arm64 runner a pre-set acceptance would have linted an artifact whose
  # variadic ABI is known-wrong and reported a clean verdict. It cannot do that
  # any more, and the setting is gone from here as well. Specification 0.8.6
  # escalates A4 to whoever set the requirements; rust-build.yml's env block
  # enumerates the two options that remain.

jobs:
  clippy:
    name: 'clippy + rustfmt'

    # ubuntu-latest rather than the leaner ubuntu-slim used by the C source
    # checks. clippy is a full type-check of the workspace and of all 300-odd
    # crates beneath it, which needs a general-purpose runner; ubuntu-slim
    # suited scripts/checksrc-all.pl because that was a Perl pass over text.
    runs-on: ubuntu-latest

    # A single job, and no matrix, because the lint gate is specified without
    # one. This carries a real and deliberate coverage limitation that must not
    # be mistaken for target-independence: the workspace DOES have
    # cfg-gated code that only one triple reaches. curl-rs-lib/src/version.rs
    # selects its OS-and-architecture string from `#[cfg(target_arch)]` x
    # `#[cfg(target_os)]` arms; curl-rs-lib/src/ffi/sys.rs and
    # curl-rs/src/output/dirhie.rs both branch on `#[cfg(target_os)]`. Running
    # on ubuntu-latest lints the x86_64-unknown-linux-gnu arms only, so a
    # clippy finding inside an aarch64 or macOS arm is NOT caught here.
    #
    # The four-target compilation matrix in rust-build.yml is what compiles
    # those arms, so a target-specific defect that rustc can see still
    # surfaces. What no gate currently covers is a clippy-only finding confined
    # to a non-host arm. Closing that would mean adding
    # `--target <triple>` legs here; until it is, the limitation is recorded
    # rather than implied away. Were a matrix ever added, `fail-fast: false`
    # would be mandatory - every matrix in this repository carries it - because
    # a lint gate that cancels its siblings on the first failure hides the rest
    # of the findings.
    #
    # 20 minutes. The tree's common values are 5, 10 and 15, and this job is
    # heavier than any of them: it type-checks the whole workspace twice, once
    # for the default target set and once for `--all-targets`, after fetching
    # the locked graph. 20 leaves headroom on a cold cache. A timeout must not
    # be the thing that fails a lint gate.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 'toolchain versions'
        run: |
          # Every claim this workflow makes downstream is a statement about
          # which toolchain produced it, so the versions are printed first.
          echo '::group::rust toolchain'
          command -v rustc
          command -v cargo
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version
          echo '::endgroup::'

          # Nothing installs a toolchain or a component here, deliberately.
          # rust-toolchain.toml pins an exact stable channel and names rustfmt,
          # clippy and llvm-tools-preview among its components; rustup honours
          # all of it on the first `cargo` invocation. A `rustup component add
          # clippy` here would only create a way for the two to disagree, and
          # the four calls above having succeeded already proves the components
          # resolved.
          echo '::group::rust-toolchain.toml (the pin this leg honours)'
          grep -v -E '^(#|$)' rust-toolchain.toml
          echo '::endgroup::'

          # The two configuration files this gate exists to enforce, printed
          # so a reader of the log can see what the verdict was passed on.
          echo '::group::clippy.toml (validated by the clippy steps below)'
          grep -v -E '^(#|$)' clippy.toml
          echo '::endgroup::'
          echo '::group::rustfmt.toml (validated by the rustfmt step below)'
          grep -v -E '^(#|$)' rustfmt.toml
          echo '::endgroup::'

      - name: 'assert: the pinned stable toolchain is the active one'
        run: |
          # Nightly is deliberately absent from rust-toolchain.toml: the Miri
          # and AddressSanitizer gates need it and install it for themselves.
          # rust-miri.yml does so today; the AddressSanitizer leg is required
          # but not yet added, and when it lands it must install nightly the
          # same way. This gate must run on the pinned stable channel, and the
          # assertion below enforces it rather than trusting that no `+nightly`
          # crept into a step.
          #
          # It matters for correctness, not only for tidiness. rustfmt silently
          # ACCEPTS a nightly-only configuration key on nightly and only warns
          # about it on stable, so the channel determines what the rustfmt step
          # below is actually able to detect.
          pinned="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "${pinned}" ]; then
            echo 'FAIL: rust-toolchain.toml declares no [toolchain] channel'
            exit 1
          fi
          case "${pinned}" in
            nightly*|beta*)
              echo "FAIL: rust-toolchain.toml pins ${pinned}."
              echo 'This gate runs on the pinned stable channel. Nightly belongs to rust-miri.yml,'
              echo 'and to rust-asan.yml; both install their own dated nightly for themselves.'
              exit 1
              ;;
          esac
          if rustc --version | grep -q -E 'nightly|beta'; then
            echo 'FAIL: the active rustc is a nightly or beta build, but this gate requires the pinned stable channel'
            rustc --version
            exit 1
          fi
          active="$(rustc --version | awk '{ print $2 }')"
          case "${pinned}" in
            [0-9]*)
              if [ "${active}" != "${pinned}" ]; then
                echo "FAIL: rustc reports ${active}, but rust-toolchain.toml pins the exact version ${pinned}."
                echo 'An exact pin is honoured by rustup on the first cargo invocation, so a mismatch means'
                echo 'something in this job overrode the toolchain. Find and remove the override.'
                exit 1
              fi
              echo "rustc ${active} matches the exact pin in rust-toolchain.toml"
              ;;
            *)
              echo "rust-toolchain.toml pins the ${pinned} channel; the active rustc is ${active}"
              ;;
          esac

      - name: 'fetch the locked dependency graph'
        run: |
          # Its own step, so a registry or network failure is reported as a
          # fetch failure rather than arriving disguised as a clippy failure -
          # the same attribution argument that put this gate in its own file.
          #
          # --locked because Cargo.lock is committed and reproducible builds
          # are non-negotiable. It makes a lockfile that disagrees with the
          # manifests fail loudly here rather than be silently regenerated
          # under the gate - and every cargo invocation in this file that reads
          # the lockfile carries it, for the same reason. `cargo fmt` does not
          # resolve dependencies, so the flag is not applicable there and is
          # correctly absent from that step.
          cargo fetch --locked

      - name: 'clippy: cargo clippy --workspace -- -D warnings'
        run: |
          # The gate command itself, with --locked added.
          #
          # -D warnings goes on the COMMAND LINE, after `--`, and nowhere else.
          # It must never be set in a repo-wide RUSTFLAGS or in
          # .cargo/config.toml: `rustflags` participate in cargo's fingerprint,
          # so a global -D warnings would force a full rebuild between the
          # build leg and this one and would destroy per-gate attribution by
          # turning every other workflow's warnings into errors too. Neither
          # the workspace manifest nor any member manifest declares a [lints]
          # table either, which means this command line is the ONLY mechanism
          # that denies warnings anywhere in the workspace. Weakening it
          # weakens the whole invariant.
          #
          # This step also validates clippy.toml. An unknown key there is a
          # HARD ERROR, not a warning - clippy refuses to start, reporting
          # `error reading Clippy's configuration file: unknown field ...` - so
          # getting this far proves clippy.toml is well-formed and schema-valid
          # against the pinned toolchain, and a clippy.toml typo surfaces as a
          # failure of THIS workflow.
          #
          # The narrow form runs before the broad one below so a finding in
          # library and binary code is reported without test-code noise. It
          # covers the lib and bin targets of all three members.
          cargo clippy --locked --workspace -- -D warnings

      - name: 'clippy: cargo clippy --workspace --all-targets -- -D warnings'
        run: |
          # The broad form, and it is not redundant. With a `needless_return`
          # planted in two places, the narrow form above reported NOTHING while
          # this form reported both: a `#[cfg(test)] mod tests` module inside a
          # library, and a [[test]] target whose `path` lies outside its package
          # directory.
          #
          # Both matter. The assertions from the C tree's tests/libtest and
          # tests/unit programs - 235 and 59 files, which cannot link against a
          # Rust static library because pub(crate) items are absent from its
          # symbol table - are relocated into the crates as `#[cfg(test)]`
          # modules or behind a `testing` feature, so that is a large body of
          # code that must not escape the linter. And tests-rs/ sits at the
          # repository root and is deliberately not a workspace member: it is
          # reached only through [[test]] targets declared in the member
          # manifests with `path = "../tests-rs/..."`. --all-targets is what
          # puts both inside this gate.
          #
          # A [[test]] path outside its package directory produces no cargo
          # warning on the pinned cargo and is still compiled and linted, so
          # there is nothing here for -D warnings to surface on that account -
          # and nothing in principle either, since a cargo diagnostic is not a
          # rustc lint. Were such a warning to appear, the remedy would be in
          # the manifest, never a suppression in this workflow.
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 'clippy: every declared feature -- -D warnings'
        run: |
          # THE FEATURE-GATED CODE, WHICH THE TWO STEPS ABOVE NEVER SEE.
          #
          # `negotiate` and `memdebug` are default-off, so under the default
          # feature set the two steps above do not compile them and therefore
          # cannot lint them. That is not a small gap: `negotiate` is the whole
          # of curl-rs-lib/src/ffi/gss.rs - the crate's only foreign-function
          # surface outside src/ffi/sys.rs, and the one place a `// SAFETY:`
          # claim is most consequential - plus src/auth/negotiate.rs and
          # src/proxy/socks_gss.rs, and `memdebug` installs a counting
          # `#[global_allocator]`. Code that no linter ever reads is code whose
          # style and correctness nobody has checked.
          #
          # --all-targets as well, so the `#[cfg(test)]` modules that exist only
          # under these features are linted too. The narrow-then-broad ordering
          # used above is not repeated here: it exists to keep library findings
          # free of test noise on the DEFAULT set, and repeating it would double
          # a type-check of the whole workspace for no new information.
          #
          # --all-features, now that the workspace can pass it; see this file's
          # env block for what used to prevent it.
          cargo clippy --locked --workspace --all-targets \
            --all-features -- -D warnings

      - name: 'rustfmt: cargo fmt --all -- --check'
        run: |
          # --check, never a bare `cargo fmt`. A continuous-integration job
          # that rewrites source is not a gate: it would hide the very
          # violation it exists to report, and the minimal-change mandate
          # forbids this workflow from changing the tree at all. There is no
          # --fix anywhere in this file, for clippy or for rustfmt.
          #
          # The formatting gate lands here because no separate formatting
          # workflow is specified, and because style enforcement is precisely
          # what the C linter this file replaces used to do.
          fmt_out="${RUNNER_TEMP}/cargo-fmt-check.out"
          fmt_err="${RUNNER_TEMP}/cargo-fmt-check.err"
          status=0
          cargo fmt --all -- --check >"${fmt_out}" 2>"${fmt_err}" || status=$?

          echo '::group::cargo fmt --all -- --check : stdout (the diff, if any)'
          cat "${fmt_out}"
          echo '::endgroup::'
          echo '::group::cargo fmt --all -- --check : stderr (configuration diagnostics)'
          cat "${fmt_err}"
          echo '::endgroup::'

          # The configuration assertion, and it must come before the exit
          # status is examined, because the failure it catches is SILENT.
          # Measured on the pinned stable channel: a nightly-only key yields
          # `Warning: can't set ... unstable features are only available in
          # nightly channel.` and an unrecognised key yields `Warning: Unknown
          # configuration option ...` - and in BOTH cases rustfmt ignores the
          # key and still exits 0. Without this check, a nightly-only setting
          # in rustfmt.toml would leave the formatting contract quietly
          # unenforced while this gate reported success. rustfmt.toml must
          # therefore use stable options only, and this is what holds it to it.
          if grep -F 'Warning' "${fmt_err}"; then
            echo 'FAIL: rustfmt ignored a configuration option, so rustfmt.toml is not fully in force.'
            echo 'Either the option is unknown, or it is nightly-only and this gate runs on the pinned'
            echo 'stable channel. Fix rustfmt.toml; do not silence this check.'
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo 'FAIL: the workspace is not rustfmt-clean. The diff above is what cargo fmt --all would'
            echo 'change. Run it locally and commit the result; this gate reports, it does not rewrite.'
            exit "${status}"
          fi

          echo 'the workspace is rustfmt-clean, and rustfmt.toml uses only options that exist on the pinned stable channel'

      - name: 'assert: this gate rewrote nothing'
        run: |
          # The property that makes the two steps above trustworthy. Every
          # cargo invocation here either only reads the tree or was passed
          # --locked, so nothing should have been able to modify a tracked file
          # or write Cargo.lock. This asserts it rather than assuming it.
          #
          # A finding means one of three things, all of them defects worth
          # failing on: --check was dropped from the rustfmt step, --fix
          # reached a clippy step, or --locked was dropped somewhere and cargo
          # regenerated the lockfile. target/ is git-ignored, so a normal run
          # leaves this empty.
          changed="${RUNNER_TEMP}/worktree-status.txt"
          git status --porcelain > "${changed}"
          if [ -s "${changed}" ]; then
            echo 'FAIL: the working tree changed while this gate ran:'
            cat "${changed}"
            exit 1
          fi
          echo 'the working tree is byte-identical to the checkout: this gate reports, it does not rewrite'
