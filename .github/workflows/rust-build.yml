# The BUILD gate for the Rust workspace.
#
# This workflow runs `cargo build --locked --release --workspace` once per
# mandated target triple, with warnings denied, and it confirms the minimum
# supported Rust version still builds the workspace. It does nothing else.
# One workflow per validation gate, so that a failure names its own cause: lint
# is rust-clippy.yml's, the tests rust-test.yml's, undefined behaviour
# rust-miri.yml's, the sanitizer rust-asan.yml's, coverage rust-coverage.yml's,
# the supply chain rust-audit.yml's, symbol and public-header parity
# rust-abi.yml's, and the curl fixture corpus curl-testsuite.yml's. All nine are
# on disk, this file among them, alongside hygiene.yml, which owns the spelling,
# prohibited-wording and public-header style checks.
#
# That principle is why there is no clippy step, no `cargo fmt`, no
# `cargo test`, no coverage instrumentation, no `cargo audit`, no symbol
# comparison and no invocation of tests/runtests.pl anywhere below. Every one
# of those has a designated owner - rust-clippy.yml, rust-test.yml,
# rust-coverage.yml, rust-audit.yml, rust-abi.yml and curl-testsuite.yml - and a
# second owner would mean a red cross that does not say what broke.
#
# LINEAGE. This file is the successor to the compilation half of two C build
# workflows, .github/workflows/linux.yml and .github/workflows/macos.yml, both
# of which remain on disk unmodified because they still build the C tree. What
# was inherited from them is convention rather than content: the trigger shape,
# the pinned checkout, the fail-fast policy, the per-job timeout, the apt
# invocation, the ::group:: log idiom, the `command -v` habit, and above all
# the practice of hoisting every matrix value into an `env:` block instead of
# interpolating it into a shell body. What was NOT inherited is their
# structure: those two workflows configure, build, install and test in one job
# because the C build system offers no way to separate them. Cargo does, so
# this file builds and stops.
#
# WHAT THIS GATE PROVES: the committed lockfile resolves; every workspace
# member compiles for each of the four mandated triples in release
# configuration; the compilation is free of rustc warnings; the four expected
# artifacts appear; and the minimum supported Rust version accepts the same tree
# and the same lockfile.
#
# WHAT IT DOES NOT PROVE: that the artifacts export the right symbols, that the
# generated public header is correct, that the code behaves correctly, or that
# the dependency graph is free of advisories. Those belong to other gates.

name: 'Rust build'

'on':
  push:
    branches:
      - master
      - '*/ci'
    # A deny-list, not an allow-list, and the same four entries the sibling
    # Rust workflows and the two C build workflows use. An allow-list would have
    # to enumerate Cargo.toml, Cargo.lock, rust-toolchain.toml,
    # .cargo/config.toml, three member manifests, two build scripts and every
    # source path in three crates, and the day one was left out is the day a
    # change merged without ever having been compiled. `projects/**` holds the
    # OS400, Windows and VMS project files, outside this migration entirely.
    #
    # ONE ENTRY IS DELIBERATELY ABSENT. macos.yml also ignores '**/*.md', which
    # is reasonable there and wrong here, because in this workspace markdown is
    # a BUILD INPUT: curl-rs/build.rs drives scripts/managen over
    # docs/cmdline-opts to generate the embedded manual, naming the directory
    # and all 293 `*.md` pages in `cargo:rerun-if-changed=` directives, and it
    # asserts the page count - so a page added or removed without its companion
    # table being updated is a BUILD FAILURE. Ignoring markdown would let
    # exactly that class of change reach master without this gate running.
    paths-ignore:
      - '.circleci/**'
      - 'appveyor.*'
      - 'Dockerfile'
      - 'projects/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.circleci/**'
      - 'appveyor.*'
      - 'Dockerfile'
      - 'projects/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  # Colour off. Nothing below parses cargo's output to reach a verdict - the
  # verdicts come from exit statuses and from file existence - but an escape
  # sequence in a diagnostic makes a log harder to read for the person who has
  # to diagnose a four-target failure, and it would silently break any future
  # anchored pattern somebody adds here.
  CARGO_TERM_COLOR: never

  # The dependency graph is fetched in its own step below. A transient registry
  # hiccup should retry rather than be reported as a compilation failure and
  # send somebody looking for a compiler error that is not there.
  CARGO_NET_RETRY: '3'

  # No cache is restored into these jobs, so incremental state is output that
  # nothing ever reads. This is not a speed setting: performance is an explicit
  # non-goal of this work, and no step below is ordered or configured for it.
  CARGO_INCREMENTAL: '0'

  # The minimum supported Rust version, used by the `msrv` job. It is declared
  # here as a three-component rustup toolchain name because that is what
  # `rustup toolchain install` wants, while Cargo.toml declares the floor as
  # the two-component `rust-version = "1.75"`. The `msrv` job asserts that the
  # two agree, so this value cannot drift away from the manifest unnoticed.
  MSRV_TOOLCHAIN: '1.75.0'

  # The cross-compilation toolchain for the aarch64-unknown-linux-gnu leg.
  #
  # This is the ONLY place the package list is written. The matrix entry below
  # carries a selector - the name of the cross toolchain it needs - and not the
  # list itself, because a list written in two places is a list that will
  # eventually disagree with itself. The house pattern is the same: linux.yml
  # declares its version pins in the workflow `env:` block and lets the matrix
  # reference them.
  #
  #   gcc-aarch64-linux-gnu   supplies aarch64-linux-gnu-gcc, which is the
  #                           `linker` .cargo/config.toml already names for
  #                           this triple, and the CC the same file exports
  #   g++-aarch64-linux-gnu   supplies the CXX that same file exports; it is
  #                           listed because the variable is exported
  #                           unconditionally, so a crate that probes CXX must
  #                           find something rather than a missing binary
  #   libc6-dev-arm64-cross   the target headers and CRT that the C-compiling
  #                           crates in the graph need; it arrives as a
  #                           dependency of the compiler packages, and is
  #                           named anyway so the requirement is visible
  CROSS_LINUX_PACKAGES: 'gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross'

  # ALL FIFTEEN DECLARED FEATURES, and `--all-features` is now the correct form.
  #
  # This was an explicit fourteen-name list for one reason: `hickory-dns` used
  # to raise a `compile_error!`, Cargo has no "all except one" selector, and
  # `--all-features` therefore failed the gate on a feature-set error wearing a
  # build gate's name. That is fixed at the source. The feature is still backed
  # by no crate - every hickory-resolver release satisfying the workspace floor
  # requires a hickory-proto affected by RUSTSEC-2026-0119, and every release
  # carrying the fix declares `rust-version 1.88` - but it now BUILDS and
  # advertises nothing, because curl-rs-lib/src/version.rs holds `ENGINE_DNS`
  # absent and the resolver token is withheld at every feature setting. So
  # `--all-features` is both admissible and strictly better than a list: a
  # sixteenth feature added to the manifests is covered here automatically
  # instead of being silently skipped until somebody updated two workflows in
  # lockstep. deny.toml already audits with `all-features = true` for exactly
  # that reason.
  #
  # The two names that matter most here are the two that are default-OFF and
  # therefore reach no other step in this file: `negotiate`, which compiles
  # curl-rs-lib/src/ffi/gss.rs and links a platform GSS-API provider, and
  # `memdebug`, which installs a counting `#[global_allocator]`. Neither is
  # exercised by a default build at all, so without this step they would be
  # shipped never having been compiled for any target.
  #
  # The fifteen, for the reader: altsvc, brotli, cookies, doh, ftp, gzip, hsts,
  # http2, http3, ssh, websockets, zstd, negotiate, memdebug, hickory-dns.

  # What `negotiate` needs at LINK time on a Linux runner.
  #
  # curl-rs-lib/src/ffi/gss.rs declares its GSS-API entry points under
  # `#[cfg_attr(target_os = "linux", link(name = "gssapi_krb5"))]` and
  # `#[cfg_attr(target_os = "macos", link(name = "GSS", kind = "framework"))]`.
  # Linkage follows the platform and not the feature: the feature gates the
  # capability, `target_os` decides which library provides it. On macOS the
  # provider is Apple's GSS.framework, which every Xcode toolchain ships, so no
  # installation step is needed there. On Linux it is MIT Kerberos, and
  # `libgssapi_krb5.so` - the unversioned symlink a linker needs, as distinct
  # from the `libgssapi_krb5.so.2` a runtime needs - arrives only with the
  # development package. `krb5-config --libs gssapi` reports
  # `-lgssapi_krb5 -lkrb5 -lk5crypto -lcom_err`; the transitive three arrive
  # through the shared object's own DT_NEEDED entries, so only the first is
  # named as a Rust `link` attribute and only this one package is needed.
  NATIVE_LINK_PACKAGES: 'libkrb5-dev'

  # A4 IS OPEN, AND THIS FILE DELIBERATELY RECORDS NO DECISION ABOUT IT.
  #
  # curl-rs-ffi/build.rs REFUSES to build aarch64-apple-darwin unless
  # CURL_RS_A4_VARIADIC_DECISION is set to exactly `accept-unsupported-varargs`.
  # That variable is NOT set anywhere in this repository's workflows, and it must
  # not be: specification 0.8.6 escalates A4 as requiring a decision from
  # whoever set the requirements, and lists exactly three options -
  #
  #   1. raise the minimum supported Rust version above 1.75 and implement the
  #      four variadic entry points with c_variadic / VaList::next_arg;
  #   2. drop aarch64-apple-darwin from the mandated target matrix;
  #   3. accept that this target's varargs entry points are unsupported.
  #
  # - none of which a workflow may choose on its own behalf. Setting the variable
  # here would take option 3 unilaterally AND would then report a leg whose
  # variadic ABI is known-wrong as a SUCCESSFUL target build, which is the one
  # outcome specification 0.8.6 calls out as worse than a red gate ("this defect
  # would not surface in local testing, which makes silent acceptance the worst
  # option").
  #
  # WHAT HAPPENS INSTEAD. The aarch64-apple-darwin leg of the matrix below runs
  # in full and FAILS at the build step, by design, with the build script's own
  # A4 diagnostic. The step asserts that the failure is precisely that refusal
  # and nothing else, so the red leg carries a diagnosis rather than a mystery.
  # There is no `continue-on-error`, no `if:` that skips the leg, and the triple
  # is not removed: gate 1 reports three targets green and one blocked on an
  # owner decision, which is the true state of affairs.
  #
  # THE ONE-LINE CHANGE, for whoever decides. Option 1 lifts the refusal at its
  # root and needs no variable. Option 2 removes the triple from the matrix.
  # Option 3 is a `CURL_RS_A4_VARIADIC_DECISION: 'accept-unsupported-varargs'`
  # line in this block - and if it is ever added, the assertion step below must
  # be inverted with it, because the build script then emits an advisory instead
  # of refusing.

jobs:
  # The gate proper: the four-target release build, warnings denied
  build:
    name: ${{ matrix.build.target }}

    # One runner per target, chosen so that every leg links natively where it
    # can. The two Apple triples share macos-latest, whose Xcode toolchain
    # links both arm64 and x86_64 Mach-O out of the box; no Linux runner can
    # link a Mach-O object at all, which is why they are not cross-compiled
    # from Ubuntu the way the aarch64 Linux leg is.
    runs-on: ${{ matrix.build.image }}

    # 30 minutes. The tree's common values are 5, 10 and 15, and its ceiling is
    # 45; the closest comparable job is rust-audit.yml at 30. This leg is
    # heavier than any of the C build jobs it descends from: a cold release
    # build of the whole workspace over a locked graph of 320 packages, several
    # of which compile vendored C or assembly (the ring cryptographic provider
    # and the zstd bindings among them), with no cache restored. 30 leaves
    # headroom on a cold start. A timeout must never be the thing that fails a
    # build gate, because a timeout tells you nothing about the code.
    timeout-minutes: 30

    # EVERY matrix value is hoisted here and referenced as a plain shell
    # variable inside the `run:` bodies below. Not one `${{ ... }}` expression
    # appears in a shell body anywhere in this file. Three independent reasons,
    # all of them measured on this repository's own tooling:
    #
    #   1. zizmor --pedantic runs a template-injection audit over
    #      .github/workflows/*.yml and treats an expression interpolated into a
    #      shell body as a finding.
    #   2. .github/scripts/shellcheck-ci.sh extracts every `run:` string into
    #      one synthetic bash script and rewrites expressions with
    #      `sed -E 's|\$\{\{ .+ \}\}|GHA_EXPRESSION|g'`. That pattern is
    #      GREEDY, so two expressions on one line collapse into a single token
    #      and the shell the linter then checks is not the shell that would
    #      run.
    #   3. It is what linux.yml and macos.yml already do, and consistency is
    #      what makes the convention enforceable.
    env:
      MATRIX_TARGET: '${{ matrix.build.target }}'
      MATRIX_IMAGE: '${{ matrix.build.image }}'
      MATRIX_CROSS_TOOLCHAIN: '${{ matrix.build.cross_toolchain }}'
      MATRIX_NATIVE_LINK: '${{ matrix.build.native_link }}'

    strategy:
      # Present on every matrix in this repository, and load-bearing for a
      # four-target gate in particular. A target-specific defect is exactly
      # what this matrix exists to find, and cancelling the other three legs
      # the moment one fails would hide whether the defect is specific to one
      # triple or common to all four - which is the first question anybody
      # diagnosing it will ask.
      fail-fast: false
      matrix:
        # THE FOUR MANDATED TARGETS, and only four. This list is identical,
        # character for character and in the same order, to rust-toolchain.toml
        # `targets` and to deny.toml `[graph] targets`, so the toolchain that
        # is provisioned, the graph that is audited and the artifacts that are
        # built all describe one identical set. An assertion step below proves
        # the three files still agree rather than trusting that they do.
        #
        # ALL FOUR ARE 64-BIT, AND THAT IS LOAD-BEARING RATHER THAN INCIDENTAL.
        # The C ABI shim reaches curl's four variadic entry points -
        # curl_easy_setopt, curl_easy_getinfo, curl_multi_setopt and
        # curl_share_setopt - with a non-variadic extern "C" function taking
        # one trailing pointer, because true C-variadic functions are unstable
        # at the workspace's minimum supported Rust version. That design
        # carries a curl_off_t through a single register-width slot, which is
        # sound only where off_t fits a register. 32-bit portability is
        # therefore a DELIBERATE FORFEIT rather than an oversight, and it must
        # not be claimed: no 32-bit triple belongs in this matrix, and neither
        # does any Windows triple.
        #
        # `cross_toolchain` is a SELECTOR, not a package list: it names which
        # cross toolchain a leg needs, and the packages themselves live once in
        # the workflow `env:` block above. It is set on every entry, including
        # the three that need nothing, because actionlint infers a matrix
        # entry's shape from the entries it sees and reports a key that is
        # absent from some of them. macos.yml solves the same problem the same
        # way, with the note "Set it once to silence actionlint."
        build:
          # The host triple, and the primary leg. Native compile, native link.
          - target: 'x86_64-unknown-linux-gnu'
            image: 'ubuntu-latest'
            cross_toolchain: ''
            native_link: 'yes'

          # Cross-compiled from an Ubuntu runner.
          #
          # TWO ROUTES EXIST AND THIS ONE WAS CHOSEN BY MEASUREMENT. The
          # alternative is `cross`, pinned at 0.2.5 in Cargo.toml's
          # [workspace.metadata.curl-rs.ci-tools] table for exactly this leg,
          # which drives the build inside a container. It is deliberately NOT
          # installed here. The route taken instead is the linker
          # .cargo/config.toml already configures for this triple, plus the
          # matching CC, CXX and AR that the same file exports through its
          # [env] table.
          #
          # Why: this leg then runs the IDENTICAL cargo command line as the
          # other three, on the identical toolchain that rust-toolchain.toml
          # pins, differing only in the linker the configuration already
          # names. `cross` would introduce a second build driver, a container
          # image and a second toolchain provisioning path on one leg out of
          # four, and a failure there would be ambiguous between the container
          # and the code - which is precisely the attribution property this
          # gate exists to preserve. Verified before being chosen: this route
          # produces an `ELF 64-bit LSB shared object, ARM aarch64` libcurl
          # carrying the intended soname, together with the static archive.
          #
          # ONE THING TO KNOW IF THIS LEG SUDDENLY DEMANDS CMake OR NASM. That
          # is not a cross-compilation fault, it is a cryptographic-provider
          # regression. rustls, tokio-rustls and quinn are all pinned to the
          # `ring` provider with default features off; letting defaults back in
          # pulls aws-lc-rs, whose vendored C and assembly add CMake and NASM
          # to the requirements and are hostile to a cross build. The
          # assertions that hold the provider pinning in place live in
          # rust-audit.yml and are deliberately not duplicated here.
          #
          # `native_link` IS EMPTY ON THIS LEG AND ONLY ON THIS LEG, and it is
          # what decides whether the all-features step below LINKS or only
          # type-checks. The reason is specific: `negotiate` needs an aarch64
          # `libgssapi_krb5.so` in the cross sysroot, which means enabling the
          # arm64 dpkg architecture and pulling libkrb5-dev:arm64 from the
          # ports archive - a second package source on one leg out of four,
          # whose failure would be indistinguishable from a link failure in the
          # code. `cargo check` type-checks src/ffi/gss.rs completely for this
          # triple without needing it, and the two Apple legs plus the x86_64
          # Linux leg prove the LINK. That is the division this matrix is built
          # around: four-target all-feature checks, plus Linux and macOS
          # native-link builds.
          - target: 'aarch64-unknown-linux-gnu'
            image: 'ubuntu-latest'
            cross_toolchain: 'aarch64-linux'
            native_link: ''

          # Cross-compiled on an arm64 macOS runner, which links Mach-O for
          # both architectures through one Xcode toolchain.
          - target: 'x86_64-apple-darwin'
            image: 'macos-latest'
            cross_toolchain: ''
            native_link: 'yes'

          # aarch64-apple-darwin -- AN UNRESOLVED ABI CONFLICT. READ THIS BEFORE
          # DEBUGGING A FAILURE HERE.
          #
          # Apple's arm64 ABI passes variadic arguments ON THE STACK. Standard
          # AAPCS64, which Linux aarch64 follows, passes them in registers. The
          # C ABI shim's setopt and getinfo entry points are declared
          # non-variadic and take one trailing pointer, and the generated
          # aarch64 code for that shape was measured to read the third
          # argument out of register x2 - literally `mov x0, x2; ret`. Reached
          # through the variadic prototype the public header declares, that
          # callee therefore reads a register the caller never populated, on
          # this target and on no other.
          #
          # THE FAILURE IS SILENT, AND IT WOULD NOT SURFACE IN A LINUX-ONLY
          # ENVIRONMENT. It is not a compilation error, so this leg compiling
          # green is not evidence that the entry points work. Conversely, if
          # this leg ever fails, suspect the argument-passing conflict before
          # suspecting this workflow.
          #
          # The remedy is the stabilised c_variadic feature, which is stable on
          # nightly 1.99 and therefore requires a toolchain NEWER than the
          # mandated floor of 1.75. The MSRV floor and this four-target matrix
          # cannot both be met by any implementation. Resolving that is a
          # decision for whoever set them: raise the MSRV, drop this target, or
          # accept that this target's varargs entry points are unsupported.
          #
          # UNTIL THAT DECISION IS MADE, NOTHING HERE MAY PAPER OVER IT. There
          # is no `continue-on-error` on this entry, no `if:` that skips it, no
          # `if: always()` masking anywhere in this file, and the triple is not
          # removed. A gate that hides a known unresolved defect is worse than
          # no gate, because it converts an open question into a false
          # assurance.
          #
          # Related and expected: curl-rs-ffi/build.rs deliberately emits a
          # `cargo:warning=` advisory about this conflict when it sees this
          # target. That advisory MUST NOT fail this leg, and under the
          # zero-warning mechanism chosen below it cannot - see the build step
          # for why that is a property of the mechanism rather than an exception
          # carved out for it.
          - target: 'aarch64-apple-darwin'
            image: 'macos-latest'
            cross_toolchain: ''
            native_link: 'yes'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 'toolchain versions'
        run: |
          # Evidence before use. Everything this leg concludes is a statement
          # about which toolchain produced it and which target it produced it
          # for, so both are printed before anything is judged by them.
          echo '::group::rust toolchain'
          command -v rustc
          command -v cargo
          command -v rustup
          rustc --version
          cargo --version
          rustup --version
          echo '::endgroup::'

          # NOTHING INSTALLS A TOOLCHAIN, A COMPONENT OR A TARGET IN THIS JOB,
          # and that is deliberate. rust-toolchain.toml pins an exact stable
          # channel, names rustfmt, clippy and llvm-tools-preview among its
          # components, and lists all four mandated targets; rustup honours the
          # whole file on the first `cargo` invocation. A `rustup target add`
          # or a `rustup component add` here would add nothing except a second
          # place for the two to disagree. The commands above having succeeded,
          # and the target list below being complete, is the proof that the pin
          # resolved.
          #
          # `cross` is likewise not installed - see the aarch64 matrix entry.
          echo '::group::rust-toolchain.toml (the pin this leg honours)'
          grep -v -E '^(#|$)' rust-toolchain.toml
          echo '::endgroup::'
          echo '::group::targets installed by that pin'
          rustup target list --installed
          echo '::endgroup::'

          # The target for this leg, printed plainly and then in full, so that
          # the wrong triple is visible in the log rather than inferred from a
          # puzzling link error two steps later.
          echo "this leg builds for: ${MATRIX_TARGET}"
          echo "on runner image: ${MATRIX_IMAGE}"
          echo '::group::rustc --print cfg for this target'
          rustc --print cfg --target "${MATRIX_TARGET}"
          echo '::endgroup::'

      - name: 'assert: the pinned stable toolchain, and a mandated target'
        run: |
          # Nightly is deliberately absent from rust-toolchain.toml, because
          # only two gates need it and each must install it for itself and name
          # it per invocation. rust-miri.yml does; the AddressSanitizer leg is
          # required but not yet added and must do the same when it lands. THIS
          # FILE MUST NOT INSTALL OR INVOKE NIGHTLY. The assertion below is what
          # says so out loud rather than trusting that no `+nightly` crept into
          # a step, and it matters beyond tidiness: an unstable flag or a
          # nightly-only construct that compiled here would break every consumer
          # building on the pinned stable channel.
          pinned="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "${pinned}" ]; then
            echo 'FAIL: rust-toolchain.toml declares no [toolchain] channel'
            exit 1
          fi
          case "${pinned}" in
            nightly*|beta*)
              echo "FAIL: rust-toolchain.toml pins ${pinned}."
              echo 'Gate 1 builds on the pinned stable channel. Nightly belongs to rust-miri.yml,'
              echo 'and to rust-asan.yml; both install their own dated nightly for themselves.'
              exit 1
              ;;
          esac
          if rustc --version | grep -q -E 'nightly|beta'; then
            echo 'FAIL: the active rustc is a nightly or beta build, but this gate requires the pinned stable channel'
            rustc --version
            exit 1
          fi
          active="$(rustc --version | awk '{ print $2 }')"
          case "${pinned}" in
            [0-9]*)
              if [ "${active}" != "${pinned}" ]; then
                echo "FAIL: rustc reports ${active}, but rust-toolchain.toml pins the exact version ${pinned}."
                echo 'An exact pin is honoured by rustup on the first cargo invocation, so a mismatch means'
                echo 'something in this job overrode the toolchain. Find and remove the override.'
                exit 1
              fi
              echo "rustc ${active} matches the exact pin in rust-toolchain.toml"
              ;;
            *)
              echo "rust-toolchain.toml pins the ${pinned} channel; the active rustc is ${active}"
              ;;
          esac

          # The three-file target agreement. The
          # matrix above, rust-toolchain.toml `targets` and deny.toml
          # [graph] targets must describe one identical set of four triples: if
          # they drift, this gate builds a triple the toolchain does not
          # provision or the supply-chain gate never audits, and neither
          # failure would name its own cause.
          toolchain_targets="$(sed -n '/^targets = \[/,/^]/p' rust-toolchain.toml | sed -n 's/^ *"\([^"]*\)".*/\1/p')"
          deny_targets="$(sed -n '/^targets = \[/,/^]/p' deny.toml | sed -n 's/^ *"\([^"]*\)".*/\1/p')"
          echo '::group::declared target sets'
          echo "rust-toolchain.toml: ${toolchain_targets}"
          echo "deny.toml: ${deny_targets}"
          echo '::endgroup::'
          toolchain_count="$(printf '%s\n' "${toolchain_targets}" | grep -c .)"
          if [ "${toolchain_count}" -ne 4 ]; then
            echo "FAIL: rust-toolchain.toml declares ${toolchain_count} targets; the mandated matrix has exactly 4."
            echo 'Adding a fifth target, or dropping one, is a requirements change and not a CI change.'
            exit 1
          fi
          if [ "${toolchain_targets}" != "${deny_targets}" ]; then
            echo 'FAIL: rust-toolchain.toml and deny.toml no longer declare the same targets in the same order.'
            exit 1
          fi
          if ! printf '%s\n' "${toolchain_targets}" | grep -q -x -F "${MATRIX_TARGET}"; then
            echo "FAIL: this leg builds ${MATRIX_TARGET}, which rust-toolchain.toml does not provision."
            exit 1
          fi
          echo "${MATRIX_TARGET} is one of the four mandated triples, and all three files agree"

      - name: 'install the cross-compilation toolchain'
        # Runs only on the leg that names a cross toolchain, which today is
        # the aarch64 Linux leg alone. This is a guard on a step that would be
        # meaningless elsewhere - apt does not exist on the macOS runners - and
        # not a mask over a failure: no step in this file is conditional on the
        # outcome of another, and none carries `continue-on-error` or
        # `if: always()`.
        if: ${{ matrix.build.cross_toolchain }}
        run: |
          # The house apt pattern, taken verbatim from linux.yml and
          # checksrc.yml: drop the pre-seeded third-party sources first,
          # because they are the usual cause of an `apt-get update` failure on
          # a hosted runner, then update, then install without a pseudo-tty so
          # the log stays readable.
          sudo rm -f /etc/apt/sources.list.d/{azure-cli.sources,microsoft-prod.list,ondrej-ubuntu-php-noble.sources}
          sudo apt-get -o Dpkg::Use-Pty=0 update
          echo "installing the ${MATRIX_CROSS_TOOLCHAIN} cross toolchain"
          sudo apt-get -o Dpkg::Use-Pty=0 install \
            ${CROSS_LINUX_PACKAGES}

          # Prove the linker Cargo will actually reach is present, and prove it
          # by READING THE NAME OUT OF .cargo/config.toml rather than repeating
          # it here. That is the point of the check: it fails loudly if the
          # configuration key is ever renamed, retargeted or removed, which
          # would otherwise surface as an inscrutable link error - or, worse,
          # as a silent fallback to the host linker producing a host object.
          linker="$(sed -n '/^\[target\.aarch64-unknown-linux-gnu\]/,/^\[/p' .cargo/config.toml |
            sed -n 's/^linker = "\([^"]*\)".*/\1/p')"
          if [ -z "${linker}" ]; then
            echo 'FAIL: .cargo/config.toml no longer names a linker for aarch64-unknown-linux-gnu.'
            exit 1
          fi
          echo '::group::cross toolchain'
          command -v "${linker}"
          "${linker}" --version | head -n 1
          echo '::endgroup::'
          echo "the linker .cargo/config.toml names for this triple is present: ${linker}"

      - name: 'fetch the locked dependency graph'
        run: |
          # Its own step, so that a registry or network failure is reported as
          # a fetch failure instead of arriving disguised as a build failure.
          # That is the same attribution argument that put this gate in its own
          # workflow, applied one level down.
          #
          # --locked because Cargo.lock is committed: it makes a lockfile that
          # disagrees with the manifests fail loudly here rather than be
          # silently regenerated underneath the gate. Every cargo invocation in
          # this file that reads the lockfile carries it.
          #
          # --target narrows the fetch to the graph this leg actually needs,
          # which also means a dependency that is unresolvable for this triple
          # is reported here, by name, rather than mid-compilation.
          cargo fetch --locked --target "${MATRIX_TARGET}"

      - name: 'build: cargo build --locked --release --workspace'
        # ZERO WARNINGS IS THE GATE, NOT A NICETY, AND THIS IS THE WHOLE
        # MECHANISM. One env var, scoped to this single step.
        #
        # WHY HERE AND NOWHERE ELSE. It must never be set in a repo-wide
        # RUSTFLAGS or in .cargo/config.toml - that file explicitly forbids it
        # - because `rustflags` participate in Cargo's fingerprint. A global
        # deny would force a full rebuild between this leg and the clippy leg
        # AND would destroy per-gate attribution by turning every other
        # workflow's warnings into errors too. Step scope is what keeps the
        # deny inside this gate.
        #
        # WHAT IT COVERS, established by inspecting every rustc invocation of
        # a build shaped like this workspace:
        #
        #   workspace member lib/bin   no cap-lints, receives the deny  DENIED
        #   registry dependency lib    receives the deny, but Cargo also
        #                              applies --cap-lints allow to it   capped
        #   build script (any)         host unit; does not receive it    exempt
        #
        # So the deny effectively scopes to the workspace's own code, which is
        # what is wanted: a warning inside one of the 325 external crates is not
        # ours to fix and must not be able to fail this gate, while a warning in
        # our own code fails it immediately. Confirmed end-to-end - one unused
        # variable planted in a workspace crate turns this step red with
        # `error: unused variable`, and the identical tree exits 0 with the deny
        # removed.
        #
        # WHY NOT THE LOG-GREP ALTERNATIVE. Capturing the build log and failing
        # on the text `warning:` is DISQUALIFIED, not merely ranked lower: on a
        # clean, warning-free build that grep still matches, because cargo
        # renders build-script advisories as `warning: <crate>@<version>:
        # <text>`. curl-rs-ffi/build.rs emits exactly such an advisory, on
        # purpose, for the unresolved Apple arm64 variadic conflict whenever it
        # sees aarch64-apple-darwin, and curl-rs/build.rs emits others when an
        # optional input such as Perl is absent. A log grep would therefore fail
        # the Apple arm64 leg on an INTENTIONAL advisory - a false negative on
        # the one target whose real defect is silent, which is the worst
        # possible failure mode here. The deny-flag mechanism is immune by
        # construction: a build-script advisory is a cargo diagnostic, not a
        # rustc lint, so it is reported in the log and does not affect the exit
        # status. Verified: a build carrying that advisory and nothing else
        # exits 0.
        #
        # WHAT IT HONESTLY DOES NOT COVER, stated rather than glossed over.
        # Because every leg passes --target, build scripts are host units and
        # RUSTFLAGS does not reach them, so a warning in build-script SOURCE is
        # not denied here. That warning is target-independent, so replicating a
        # check for it four times would be the wrong shape anyway; it is caught
        # by `cargo clippy --workspace -- -D warnings` in rust-clippy.yml,
        # which was verified to stop on it. Cargo's own manifest diagnostics
        # are likewise not rustc lints and are outside this flag; the remedy
        # for one of those is always the manifest, never a suppression here.
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          # The gate command itself, with --locked and the per-leg --target.
          #
          # --workspace covers all three members in one invocation:
          #   curl-rs-lib   the engine, an rlib
          #   curl-rs       two binaries, curl and curlinfo
          #   curl-rs-ffi   a cdylib and a staticlib, named `curl` by its
          #                 [lib] table so the artifacts are libcurl.*
          #
          # --release because that is what the gate names, and because the
          # release profile is where the workspace's own settings apply -
          # link-time optimisation off, unwinding preserved so a panic stays
          # contained at the FFI boundary, and overflow checks deliberately
          # left ON. A debug build would not exercise any of them.
          #
          # No Perl install step, and none is needed: curl-rs/build.rs drives
          # scripts/managen through Perl to generate the embedded manual, and
          # both the ubuntu and the macos runner images ship Perl. If it were
          # ever absent the script degrades to a stub with an advisory rather
          # than failing, so its absence would be a quietly smaller manual and
          # not a red build - which is precisely why no step here asserts
          # anything about Perl that the build script does not.
          #
          # STREAMED THROUGH tee, AND THIS IS NOT THE LOG-GREP THAT WAS
          # DISQUALIFIED ABOVE. Nothing here greps for the word `warning:` -
          # that is still the deny flag's job and still the reason a
          # build-script advisory cannot fail this step. The log is kept for
          # ONE narrow purpose, in its own step below: asserting that the A4
          # variadic advisory is PRESENT on aarch64-apple-darwin and ABSENT on
          # the other three triples. That is the opposite of tolerating it. The
          # real status is recovered from PIPESTATUS because tee always
          # succeeds and the default shell is `bash -e` without `pipefail`.
          log="${RUNNER_TEMP}/build-default.log"

          status=0
          cargo build --locked --release --workspace --target "${MATRIX_TARGET}" 2>&1 | tee "${log}"
          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo "FAIL: the default-feature release build failed for ${MATRIX_TARGET}."

            # aarch64-apple-darwin is EXPECTED to fail here while A4 is open,
            # and the expectation is asserted rather than assumed: the failure
            # must be the build script's A4 refusal and not some other defect
            # hiding behind it. See this file's env block for why no workflow
            # records an A4 decision on the requirement owner's behalf.
            if [ "${MATRIX_TARGET}" = 'aarch64-apple-darwin' ]; then
              if grep -q -F 'aarch64-apple-darwin cannot be built: its variadic ABI is known-wrong' "${log}"; then
                echo 'DIAGNOSIS: this is open ambiguity A4 of specification 0.8.6, not a regression.'
                echo 'Apple arm64 passes variadic arguments on the stack; the non-variadic Rust callees'
                echo 'behind curl_easy_setopt, curl_easy_getinfo, curl_multi_setopt and curl_share_setopt'
                echo 'read register x2, which such a caller never populates. The requirement owner must'
                echo 'choose one of the three options the refusal prints. Until then this leg stays red on'
                echo 'purpose: reporting a known-wrong ABI as a successful target build is not available.'
                exit "${status}"
              fi
              echo 'DIAGNOSIS: aarch64-apple-darwin failed for a reason OTHER than the A4 refusal.'
              echo 'A4 is a known, documented block; anything else on this target is a real defect and'
              echo 'must be fixed rather than attributed to A4. The build log is above.'
            fi

            exit "${status}"
          fi

          echo "the default-feature release build succeeded for ${MATRIX_TARGET} with warnings denied"

          # THE ZERO-WARNING GATE.
          #
          # `RUSTFLAGS=-D warnings` denies rustc lints in workspace code, and the
          # block comment above explains why it cannot see a cargo diagnostic: a
          # `cargo:warning=` from a build script is reported in the log and does
          # not affect the exit status. Calling the deny flag alone a zero-warning
          # gate would therefore be inaccurate, so the remaining diagnostics are
          # enumerated here and anything unenumerated fails the leg.
          #
          # The allow-list is deliberately short, exact and prefix-anchored. Every
          # entry names a deterministic, reviewed advisory that this checkpoint
          # cannot remove:
          #
          #   * the two include/curl/ advisories from curl-rs-ffi/build.rs, which
          #     announce that the public headers were NOT regenerated because the
          #     100-symbol export surface is incomplete. They disappear on their
          #     own when the last export lands; until then they are the honest
          #     report that the committed headers remain the ABI contract.
          #   * cargo's future-incompatibility notice for russh 0.54.5, an
          #     external crate this workspace pins exactly (specification 0.5.1)
          #     and cannot patch. Recorded as dependency debt in Cargo.toml.
          #
          # An advisory that is NOT on this list fails the build, which is what
          # makes the list a gate instead of a comment. Adding to it is a
          # reviewable one-line change, and that is the point.
          diagnostics="$(grep -E '^(warning|error)(:|\[)' "${log}" || true)"
          unapproved="$(printf '%s\n' "${diagnostics}" \
            | grep -v -F 'include/curl/ NOT regenerated:' \
            | grep -v -F 'include/curl/ first missing exports:' \
            | grep -v -F 'the following packages contain code that will be rejected by a future version of Rust' \
            | grep -v -E '^[[:space:]]*$' || true)"

          if [ -n "${unapproved}" ]; then
            echo 'FAIL: the build emitted cargo diagnostics that are not on the reviewed allow-list.'
            echo 'Gate 1 of specification 0.8.4 is a ZERO-WARNING gate, and a cargo diagnostic is a'
            echo 'warning even though it does not change the exit status. Fix the cause, or - if the'
            echo 'advisory is deliberate and reviewed - add it to the allow-list in this step.'
            echo '::group::unapproved diagnostics'
            printf '%s\n' "${unapproved}"
            echo '::endgroup::'
            exit 1
          fi

          echo 'no unapproved cargo diagnostics: the zero-warning gate covers rustc lints AND cargo output'

      - name: 'artifacts'
        run: |
          # A build that exits 0 while producing nothing is not a build, and
          # cargo will happily do it if a [[bin]] or [lib] table is edited
          # wrongly. This step is what turns "the compiler was happy" into "the
          # four artifacts this gate promises exist".
          #
          # The names are not arbitrary. curl-rs/Cargo.toml declares two [[bin]]
          # targets, `curl` and `curlinfo` - the PACKAGE is curl-rs, the primary
          # BINARY is curl, matching src/Makefile.am:49 so the artifact answers to
          # the name every consumer types. curl-rs-ffi/Cargo.toml declares
          # [lib] name = "curl" with crate-type ["cdylib", "staticlib"], and
          # that name is the reason the library artifacts are libcurl.* rather
          # than libcurl_rs_ffi.* - a drop-in replacement has to be findable
          # under the name its consumers already use.
          #
          # The shared-library extension is target-dependent, so it is derived
          # from the triple rather than hardcoded: a Mach-O dynamic library is
          # a .dylib and looking for a .so on the Apple legs would fail every
          # one of them for the wrong reason.
          case "${MATRIX_TARGET}" in
            *-apple-darwin)
              shared='libcurl.dylib'
              ;;
            *-unknown-linux-gnu)
              shared='libcurl.so'
              ;;
            *)
              echo "FAIL: no shared-library naming convention is known for ${MATRIX_TARGET}."
              echo 'The four mandated triples are two -unknown-linux-gnu and two -apple-darwin.'
              exit 1
              ;;
          esac

          out="target/${MATRIX_TARGET}/release"
          echo '::group::release directory'
          ls -l "${out}"
          echo '::endgroup::'

          missing=''
          for artifact in curl curlinfo "${shared}" libcurl.a; do
            if [ ! -f "${out}/${artifact}" ]; then
              missing="${missing} ${artifact}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "FAIL: the build reported success but these artifacts are absent from ${out}:${missing}"
            echo 'Check the [[bin]] tables in curl-rs/Cargo.toml and the [lib] table in curl-rs-ffi/Cargo.toml.'
            exit 1
          fi

          # Identify each one, so the log records what was actually produced
          # and a cross-compiled leg that quietly emitted a host object is
          # visible. `file` is used because it is present on both runner
          # families; `stat` is not, its flags differ between GNU and BSD.
          #
          # Deliberately NOT done here: no nm, no objdump, no symbol counting
          # and no soname inspection. Exported-symbol parity against the
          # 100-name export list, and the generated public header, belong to
          # the symbol-and-header parity gate, which is required but not yet
          # added. This gate asks only whether the artifacts were built.
          echo '::group::artifact identity'
          for artifact in curl curlinfo "${shared}" libcurl.a; do
            file -- "${out}/${artifact}"
          done
          echo '::endgroup::'
          echo "all four artifacts were produced for ${MATRIX_TARGET}"

      - name: 'package: versioned shared library and consumer metadata'
        run: |
          set -eu
          # WHY A PACKAGING STEP EXISTS IN GATE 1 AT ALL. The step above proves
          # the four artifacts were produced. It does NOT prove they are
          # installable, and two of the things a drop-in replacement needs are
          # not Cargo outputs at all.
          #
          # First, the shared library's file name. curl-rs-ffi/build.rs stamps
          # DT_SONAME=libcurl.so.4 (and -install_name @rpath/libcurl.4.dylib),
          # derived from lib/Makefile.soname's -version-info 12:0:8, but Cargo
          # emits one file and calls it libcurl.so. So the artifact DECLARES a
          # runtime name that no file carries. That is not a load failure - it
          # is worse. Measured on x86_64-unknown-linux-gnu: a consumer linked
          # with -lcurl against the unversioned file records DT_NEEDED
          # libcurl.so.4, the loader does not find it in our tree, searches on,
          # and resolves to /lib/x86_64-linux-gnu/libcurl.so.4 - the SYSTEM C
          # libcurl. The consumer then runs successfully against a completely
          # different implementation, which no test of our artifact would
          # notice.
          #
          # Second, curl-config and libcurl.pc. Both are target-specific and
          # feature-specific, so a matrix of four builds cannot share one path;
          # curl-rs-ffi/build.rs writes them into OUT_DIR and into an install
          # staging tree beneath it. Collecting them here is what makes gate 1's
          # output an installable set rather than four loose binaries.
          out="target/${MATRIX_TARGET}/release"

          # ONE authority for every derived name, shared with rust-abi.yml, so
          # the packaging step and the assertion step cannot disagree.
          echo '::group::derived names'
          .github/scripts/materialize-soname.sh names "${MATRIX_TARGET}"
          echo '::endgroup::'
          eval "$(.github/scripts/materialize-soname.sh names "${MATRIX_TARGET}")"

          .github/scripts/materialize-soname.sh materialize "${MATRIX_TARGET}" "${out}"

          # Assert the chain rather than trusting the script that just built
          # it: the real object must be a regular file and both other names
          # must be symlinks, because that is the layout -lcurl and the loader
          # each resolve through.
          if [ ! -f "${out}/${LIBCURL_REAL}" ] || [ -L "${out}/${LIBCURL_REAL}" ]; then
            echo "FAIL: ${out}/${LIBCURL_REAL} is not a regular file."
            exit 1
          fi
          for link in "${LIBCURL_SONAME}" "${LIBCURL_DEV}"; do
            if [ ! -L "${out}/${link}" ]; then
              echo "FAIL: ${out}/${link} is not a symlink, so the versioned"
              echo 'name and the development name are independent copies that'
              echo 'will diverge on the next rebuild.'
              exit 1
            fi
          done

          # The consumer metadata, collected out of the build script's staging
          # tree. Its location is derived from Cargo's own OUT_DIR rather than
          # guessed, and there is exactly one because OUT_DIR is unique per
          # target and per feature set.
          staging="$(find "target/${MATRIX_TARGET}/release/build" \
            -maxdepth 3 -type d -path '*curl-rs-ffi-*/out/staging' 2>/dev/null | head -1)"
          if [ -z "${staging}" ]; then
            echo 'FAIL: curl-rs-ffi produced no install staging tree. It must render'
            echo 'curl-config and libcurl.pc into OUT_DIR/staging.'
            exit 1
          fi
          for rel in 'bin/curl-config' 'lib/pkgconfig/libcurl.pc'; do
            if [ ! -f "${staging}/${rel}" ]; then
              echo "FAIL: ${staging}/${rel} is missing, so consumers of this build"
              echo 'have no way to discover its flags.'
              exit 1
            fi
          done
          if [ ! -x "${staging}/bin/curl-config" ]; then
            echo 'FAIL: the generated curl-config is not executable.'
            exit 1
          fi

          # Assemble the installable set. Copied, never moved, so nothing above
          # is invalidated and a rerun of this step is idempotent.
          dist="${out}/dist"
          rm -rf "${dist}"
          mkdir -p "${dist}/bin" "${dist}/lib/pkgconfig" "${dist}/include"
          cp -R "${staging}/bin/." "${dist}/bin/"
          cp -R "${staging}/lib/pkgconfig/." "${dist}/lib/pkgconfig/"
          # Headers only. include/curl/ also holds Makefile.am, which belongs to
          # the build system being replaced and has no place in an install set.
          mkdir -p "${dist}/include/curl"
          find include/curl -maxdepth 1 -name '*.h' -exec cp {} "${dist}/include/curl/" \;
          cp "${out}/curl" "${out}/curlinfo" "${dist}/bin/"
          cp "${out}/libcurl.a" "${dist}/lib/"
          # -P so the symlinks are copied AS symlinks; without it the chain
          # would become three identical 4 MB regular files.
          cp -P "${out}/${LIBCURL_REAL}" "${out}/${LIBCURL_SONAME}" \
                "${out}/${LIBCURL_DEV}" "${dist}/lib/"

          echo '::group::installable set'
          find "${dist}" -mindepth 1 -maxdepth 3 \( -type f -o -type l \) \
            -exec ls -ld {} +
          echo '::endgroup::'
          echo "packaged ${LIBCURL_REAL} and the consumer metadata for ${MATRIX_TARGET}"

      - name: 'assert: a static C consumer links through both generated interfaces'
        run: |
          set -eu
          # THE FOUR-TARGET CLAUSE. A Rust staticlib carries no record of
          # the native libraries the Rust standard library itself needs, so a C
          # program linking libcurl.a must name them, and its only sources are
          # `curl-config --static-libs` and `pkg-config --libs --static libcurl`.
          # The required set is target-specific -- Linux needs -lgcc_s -lutil
          # -lrt -lpthread -lm -ldl -lc, Apple needs -lSystem -lm plus the
          # Security and CoreFoundation frameworks that rustls-native-certs
          # reaches through security-framework -- which is exactly why this runs
          # inside the matrix rather than once on the host.
          #
          # TWO FLAGS MAKE THE TEST NON-VACUOUS, and without either one it
          # silently proves nothing. Measured on x86_64-unknown-linux-gnu:
          #
          #   plain link                     rc=0 with libs AND rc=0 without
          #   -nodefaultlibs + whole-archive rc=0 with libs, rc=1 / 4368
          #                                  undefined references without
          #
          # `-nodefaultlibs` stops the compiler driver from silently supplying
          # -lc and -lgcc_s, which would mask anything the metadata omitted.
          # Forcing every archive member in is equally necessary: a C program
          # that references nothing from the archive pulls in no objects, so no
          # undefined symbol can arise however incomplete the metadata is. The
          # spelling of "force every member" differs by linker.
          out="target/${MATRIX_TARGET}/release"
          staging="$(find "${out}/build" -maxdepth 3 -type d \
            -path '*curl-rs-ffi-*/out/staging' 2>/dev/null | head -1)"
          if [ -z "${staging}" ]; then
            echo 'FAIL: no install staging tree, so there is no generated metadata to test.'
            exit 1
          fi

          case "${MATRIX_TARGET}" in
            *-apple-darwin)
              force_open="-Wl,-force_load,${out}/libcurl.a"
              force_close=''
              ;;
            *-unknown-linux-gnu)
              force_open="-Wl,--whole-archive ${out}/libcurl.a"
              force_close='-Wl,--no-whole-archive'
              ;;
            *)
              echo "FAIL: no force-load spelling known for ${MATRIX_TARGET}."
              exit 1
              ;;
          esac

          # Cross-compiled legs are built but not linked here: this runner has no
          # linker for the foreign target, and a host link would silently test
          # the wrong object. The metadata is still asserted below, so a
          # cross leg is not skipped outright.
          probe="${RUNNER_TEMP}/static_consumer.c"
          printf 'int main(void) { return 0; }\n' > "${probe}"

          cc_libs="$("${staging}/bin/curl-config" --static-libs | sed 's#[^ ]*libcurl\.a##')"
          pc_libs="$(PKG_CONFIG_PATH="${PWD}/${staging}/lib/pkgconfig" \
            pkg-config --libs --static libcurl | sed 's#-lcurl##; s#-L[^ ]*##g')"

          echo "curl-config --static-libs :${cc_libs}"
          echo "pkg-config  Libs.private :${pc_libs}"

          # ONE AUTHORITY means the two must be identical, not merely similar.
          # This is the required property and it is checked on every target,
          # including the cross ones that cannot be linked here.
          norm_cc="$(printf '%s\n' "${cc_libs}" | tr -s ' ' | sed 's/^ //; s/ $//')"
          norm_pc="$(printf '%s\n' "${pc_libs}" | tr -s ' ' | sed 's/^ //; s/ $//')"
          if [ "${norm_cc}" != "${norm_pc}" ]; then
            echo 'FAIL: the two generated interfaces disagree about the native link set.'
            echo "  curl-config: [${norm_cc}]"
            echo "  pkg-config : [${norm_pc}]"
            echo 'Both must be rendered from the single native-link authority in'
            echo 'curl-rs-ffi/build.rs.'
            exit 1
          fi
          if [ -z "${norm_cc}" ]; then
            echo 'FAIL: neither interface reports any native library. A Rust staticlib'
            echo 'always needs some, so an empty set means the authority was not consulted.'
            exit 1
          fi
          echo 'both interfaces report the same native link set'

          # Read the host triple from the toolchain rather than inferring it from
          # the runner image, so this stays correct if an image's architecture
          # changes underneath the matrix.
          host="$(rustc -vV | awk '/^host: / { print $2 }')"
          if [ "${MATRIX_TARGET}" != "${host}" ]; then
            echo "cross leg (host ${host}): metadata asserted, link skipped because"
            echo "this runner has no ${MATRIX_TARGET} linker and a host link would"
            echo 'silently test the wrong object.'
          else

          for interface in 'curl-config' 'pkg-config'; do
            case "${interface}" in
              curl-config) libs="${cc_libs}" ;;
              pkg-config)  libs="${pc_libs}" ;;
            esac
            log="${RUNNER_TEMP}/static-${interface}.log"
            # shellcheck disable=SC2086
            if ! cc -nodefaultlibs "${probe}" ${force_open} ${force_close} ${libs} \
                 -o "${RUNNER_TEMP}/static_consumer" > "${log}" 2>&1; then
              echo "FAIL: a static consumer following ${interface} does not link on ${MATRIX_TARGET}."
              echo "reported libraries:${libs}"
              grep -E 'undefined (reference|symbol)' "${log}" | head -40
              echo "total: $(grep -cE 'undefined (reference|symbol)' "${log}") undefined symbol(s)"
              echo 'The native-link authority in curl-rs-ffi/build.rs is incomplete for'
              echo 'this target. Re-measure it with:'
              echo "  cargo rustc -p curl-rs-ffi --release --target ${MATRIX_TARGET} --crate-type staticlib -- --print native-static-libs"
              exit 1
            fi
            echo "${interface}: a static consumer links on ${MATRIX_TARGET}"
          done

          # Vacuity check, in this run rather than on trust: omitting the
          # reported libraries must fail. If it does not, -nodefaultlibs is not
          # being honoured and both passes above are meaningless.
          # shellcheck disable=SC2086
          if cc -nodefaultlibs "${probe}" ${force_open} ${force_close} \
               -o "${RUNNER_TEMP}/static_vacuity" > /dev/null 2>&1; then
            echo 'FAIL: linking with NO reported libraries succeeded, so this gate cannot'
            echo 'detect an under-reported native-link set.'
            exit 1
          fi
          echo 'vacuity check: omitting the reported libraries fails, as required'

          fi
      - name: 'assert: no target was built under an A4 acceptance'
        run: |
          # THE COUNTERPART TO THIS FILE RECORDING NO A4 DECISION.
          #
          # Only a target that BUILT reaches this step, and while A4 is open the
          # set of such targets is exactly the three whose variadic ABI is sound.
          # aarch64-apple-darwin cannot reach it: its build step refuses, with the
          # diagnosis printed there.
          #
          # So the property to assert is absence, and it is worth asserting rather
          # than assuming. curl-rs-ffi/build.rs emits its `A4 decision on record`
          # advisory ONLY when an acceptance suppressed a refusal that would
          # otherwise have fired. Seeing that advisory here would therefore mean
          # one of two things, both of which must fail the gate: an acceptance has
          # been reintroduced into the environment and a known-wrong ABI is being
          # reported as a successful build, or the refusal's own conditions have
          # widened to a target that is not Apple arm64.
          log="${RUNNER_TEMP}/build-default.log"
          if [ ! -s "${log}" ]; then
            echo 'FAIL: the build step produced no log, so there is nothing to assert on.'
            exit 1
          fi

          echo '::group::build-script advisories emitted for this target'
          grep -F 'warning: curl-rs-ffi@' "${log}" || echo '(none)'
          echo '::endgroup::'

          # Anchored on the exact prefix curl-rs-ffi/build.rs emits, not on the
          # bare token A4, so that the word appearing in a source comment that
          # rustc happens to quote cannot satisfy this assertion.
          if grep -q -F 'A4 decision on record (CURL_RS_A4_VARIADIC_DECISION=' "${log}"; then
            echo "FAIL: ${MATRIX_TARGET} was built under a recorded A4 acceptance."
            echo 'No workflow in this repository may record that decision: specification 0.8.6 escalates A4'
            echo 'to whoever set the requirements, and accepting it here would report an artifact whose'
            echo 'variadic ABI is known-wrong as a successful target build. Remove'
            echo 'CURL_RS_A4_VARIADIC_DECISION from the environment; see this file env block for the three'
            echo 'options that are actually available.'
            exit 1
          fi

          echo "${MATRIX_TARGET} was built with no A4 acceptance in force, as every certifiable target must be"

          # aarch64-apple-darwin must remain IN the matrix. A leg that is blocked
          # on an owner decision is information; a leg that has been deleted is
          # not, and deleting it is how option 2 would get taken by accident.
          if ! grep -q -F "target: 'aarch64-apple-darwin'" "${GITHUB_WORKSPACE}/.github/workflows/rust-build.yml"; then
            echo 'FAIL: aarch64-apple-darwin is no longer in this matrix.'
            echo 'Dropping the triple IS option 2 of specification 0.8.6 A4, and it is not a workflow'
            echo 'edit to make on the requirement owner behalf. Restore the matrix entry.'
            exit 1
          fi
          echo 'aarch64-apple-darwin is still one of the four mandated matrix entries'

      - name: 'assert: the DEFAULT artifacts link no GSS-API'
        run: |
          # THE DEFAULT NO-GSS PROOF, retained as its own step precisely so that
          # adding the feature legs below cannot dilute it.
          #
          # curl-rs-lib/src/ffi/gss.rs states the claim itself: with `negotiate`
          # off the module is not compiled, so there is "no item, no `#[link]`
          # directive, no linker input, no symbol", and `ldd` on a default build
          # finds no libgssapi_krb5. This step is what turns that comment into a
          # checked property of the shipped artifact.
          #
          # The direction matters. ABSENCE is assertable without qualification,
          # because with the feature off nothing ever passes -lgssapi_krb5 to
          # the linker, so the entry cannot appear for any reason. That is why
          # the mirror-image assertion in the link step below is deliberately
          # weaker - see the comment there.
          #
          # readelf, not ldd, for the ELF targets: this job may hold a
          # cross-built aarch64 object that ldd on an x86_64 host refuses to
          # examine, while readelf reads any architecture. otool for Mach-O.
          #
          # `anchor` is a string that EVERY genuine listing for the platform
          # contains. It exists because of a measured weakness in the obvious
          # vacuity guard; the assertion that uses it explains why.
          case "${MATRIX_TARGET}" in
            *-apple-darwin)
              shared='libcurl.dylib'
              lister='otool -L'
              anchor='libSystem'
              ;;
            *-unknown-linux-gnu)
              shared='libcurl.so'
              lister='readelf -d'
              anchor='libc.so'
              ;;
            *)
              echo "FAIL: no dynamic-dependency lister is known for ${MATRIX_TARGET}."
              exit 1
              ;;
          esac

          out="target/${MATRIX_TARGET}/release"
          deps="${RUNNER_TEMP}/default-deps.txt"
          # shellcheck disable=SC2086 # ${lister} is a command plus one flag, and must split
          ${lister} "${out}/${shared}" > "${deps}"

          echo '::group::dynamic dependencies of the default-feature libcurl'
          cat "${deps}"
          echo '::endgroup::'

          # NON-VACUITY, and deliberately NOT `[ ! -s "${deps}" ]`. That test was
          # tried first and MEASURED to be too weak: it only catches a listing of
          # zero bytes, so a lister that succeeds and emits nothing but a blank
          # line - which is also what a changed output format or a wrong flag
          # would look like - sails past it, both greps below find nothing, and
          # the step passes for entirely the wrong reason. The two assertions
          # here are ABSENCE assertions, and an absence assertion over an empty
          # haystack is always satisfied, so the haystack has to be proved real
          # before it is searched.
          #
          # The anchor is the C runtime, because every dynamically linked
          # artifact on either platform records it: an ELF libcurl.so always
          # carries a NEEDED entry for libc.so, and a Mach-O libcurl.dylib always
          # carries /usr/lib/libSystem.B.dylib. A listing that does not even name
          # the C library is not a dependency listing.
          if ! grep -q -F "${anchor}" "${deps}"; then
            echo "FAIL: ${lister} produced no recognisable dependency listing for ${out}/${shared}."
            echo "Every genuine listing on this platform names ${anchor}; this one does not, so the"
            echo 'absence assertions below would be vacuously true. Either the artifact is not a'
            echo 'dynamically linked library, or the lister invocation has stopped working.'
            exit 1
          fi

          if grep -q -i -E 'gssapi|GSS\.framework|libkrb5|Kerberos' "${deps}"; then
            echo 'FAIL: a DEFAULT build of libcurl records a dependency on a GSS-API provider.'
            echo 'The negotiate feature is default-off and gates the whole of curl-rs-lib/src/ffi/gss.rs,'
            echo 'so a default artifact must contain no GSS item, no #[link] directive and no symbol.'
            echo 'A dependency here means the cfg gate on that module has been weakened.'
            exit 1
          fi

          # The same artifact, checked for the OTHER thing it must never link.
          # rustls is the sole TLS implementation at every configuration, so a
          # C TLS library appearing here would be a far larger regression than a
          # GSS one. rust-audit.yml proves no such crate is in the dependency
          # GRAPH; this proves none reached the LINKED artifact, which is a
          # different statement and the one a consumer actually experiences.
          if grep -q -i -E 'libssl|libcrypto|libgnutls|libmbedtls|libwolfssl|Security\.framework|libssh' "${deps}"; then
            echo 'FAIL: libcurl links a C TLS or SSH library. rustls and russh are the only permitted'
            echo 'implementations, at every configuration - not as a default, not behind a feature flag'
            echo 'and not as a fallback.'
            exit 1
          fi

          echo "the default ${shared} links no GSS-API provider and no C TLS or SSH library"

      - name: 'install the native-link prerequisites for negotiate'
        # Only on the legs that will LINK the feature build, and only on Linux:
        # macOS needs nothing because GSS.framework ships with Xcode. A guard on
        # a step that would be meaningless elsewhere, not a mask over failure.
        if: ${{ matrix.build.native_link && startsWith(matrix.build.image, 'ubuntu') }}
        run: |
          sudo rm -f /etc/apt/sources.list.d/{azure-cli.sources,microsoft-prod.list,ondrej-ubuntu-php-noble.sources}
          sudo apt-get -o Dpkg::Use-Pty=0 update
          sudo apt-get -o Dpkg::Use-Pty=0 install \
            ${NATIVE_LINK_PACKAGES}

          # Prove the linker input exists, and prove it by the name the Rust
          # `#[link]` attribute actually asks for. `-lgssapi_krb5` resolves
          # against the UNVERSIONED libgssapi_krb5.so symlink, which only the
          # development package provides; the runtime libgssapi_krb5.so.2 is
          # present on far more systems and is not sufficient. Checking the
          # wrong one of the two would pass here and fail at link time.
          echo '::group::the GSS-API provider this leg will link'
          krb5-config --libs gssapi
          ldconfig -p | grep -F 'libgssapi_krb5.so' || true
          echo '::endgroup::'

          if ! krb5-config --libs gssapi | grep -q -F '\-lgssapi_krb5'; then
            echo 'NOTE: krb5-config does not name -lgssapi_krb5; the link step below is the real test.'
          fi

          echo 'the MIT Kerberos development package is installed'

      - name: 'check: every declared feature, all four targets'
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          # THE FOUR-TARGET ALL-FEATURE CHECK.
          #
          # Two features are default-OFF and are therefore compiled by no other
          # step in any workflow: `negotiate`, which is the whole of
          # curl-rs-lib/src/ffi/gss.rs plus curl-rs-lib/src/auth/negotiate.rs
          # and src/proxy/socks_gss.rs, and `memdebug`, which installs a
          # counting `#[global_allocator]`. Shipping either having never been
          # type-checked for any target is not acceptable, and type-checking
          # them on ONE target is not acceptable either: gss.rs selects its
          # provider with `#[cfg_attr(target_os = ...)]` and raises a
          # `compile_error!` on any target that is neither Linux nor macOS, so
          # the per-target arms are exactly the code most likely to rot.
          #
          # `cargo check` and not `cargo build`, deliberately. This step's
          # question is "does every feature combination type-check for every
          # mandated triple", and a check answers it for all four including the
          # cross-compiled aarch64 Linux leg, which would otherwise need an
          # aarch64 GSS-API provider in its sysroot. The LINK question is a
          # different question and is asked by the next step, on the three legs
          # that can answer it natively.
          #
          # --all-features, which this workspace can now pass; see this file's
          # env block for why it used to be an explicit list and what changed.
          #
          # RUSTFLAGS is step-scoped here for the same reason it is on the build
          # step: a repo-wide deny would participate in Cargo's fingerprint and
          # destroy per-gate attribution.
          echo "checking ${MATRIX_TARGET} with every declared feature"
          cargo check --locked --release --workspace \
            --target "${MATRIX_TARGET}" \
            --all-features

          echo "all declared features type-check for ${MATRIX_TARGET} with warnings denied"

      - name: 'build: every declared feature, natively linked'
        # Every leg but the cross-compiled aarch64 Linux one; the matrix entry
        # for that leg explains why it checks rather than links.
        if: ${{ matrix.build.native_link }}
        env:
          RUSTFLAGS: '-D warnings'
        run: |
          # THE NATIVE-LINK PROOF, and the reason it is a separate step from the
          # check above: a type-check cannot discover that a library is missing.
          # rustc emits `-lgssapi_krb5` for this feature set from the `#[link]`
          # attribute on the extern block in curl-rs-lib/src/ffi/gss.rs, and a
          # provider that is absent is a HARD LINK ERROR - `cannot find
          # -lgssapi_krb5`. So this step succeeding IS the verification that the
          # platform GSS-API provider was located and linked; there is no weaker
          # reading of it.
          #
          # It rebuilds into the same target directory as the default build, so
          # the artifacts it leaves behind are the feature-built ones. That is
          # why the default no-GSS assertion runs BEFORE this step and not
          # after: the order is load-bearing, not incidental.
          echo "building ${MATRIX_TARGET} with every declared feature"
          cargo build --locked --release --workspace \
            --target "${MATRIX_TARGET}" \
            --all-features

          # No `anchor` here, unlike the default no-GSS step above, and the
          # difference is not an oversight: this step PRINTS the listing rather
          # than asserting anything absent from it, so there is no absence
          # assertion that an empty listing could satisfy vacuously.
          case "${MATRIX_TARGET}" in
            *-apple-darwin)
              shared='libcurl.dylib'
              lister='otool -L'
              ;;
            *-unknown-linux-gnu)
              shared='libcurl.so'
              lister='readelf -d'
              ;;
            *)
              echo "FAIL: no dynamic-dependency lister is known for ${MATRIX_TARGET}."
              exit 1
              ;;
          esac

          out="target/${MATRIX_TARGET}/release"
          missing=''
          for artifact in curl curlinfo "${shared}" libcurl.a; do
            if [ ! -f "${out}/${artifact}" ]; then
              missing="${missing} ${artifact}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "FAIL: the feature build reported success but these artifacts are absent:${missing}"
            exit 1
          fi

          # PRINTED, NOT ASSERTED, and the asymmetry with the default step above
          # is deliberate rather than a weaker standard applied twice. Ubuntu's
          # toolchain links with --as-needed by default, so a NEEDED entry for a
          # library whose symbols no reachable path references is legitimately
          # pruned. Asserting the entry's PRESENCE would therefore be asserting
          # a property of the linker's pruning rather than of this build, and it
          # would turn a correct link into a red cross. The link having
          # succeeded at all is the assertion; this listing is the evidence a
          # reader needs to see beside it.
          echo '::group::dynamic dependencies of the feature-built libcurl'
          # shellcheck disable=SC2086 # ${lister} is a command plus one flag, and must split
          ${lister} "${out}/${shared}"
          echo '::endgroup::'

          echo "every declared feature LINKS natively for ${MATRIX_TARGET}, GSS-API provider included"

      - name: 'assert: this gate wrote nothing outside target/'
        run: |
          # The property that makes everything above trustworthy. Every cargo
          # invocation in this job either only reads the tree or was passed
          # --locked, so nothing should have been able to modify a tracked file
          # or regenerate Cargo.lock. This asserts it rather than
          # assuming it.
          #
          # A finding means one of three things, all of them worth failing on:
          # --locked was dropped somewhere and cargo rewrote the lockfile, a
          # build script wrote into the source tree instead of OUT_DIR, or a
          # generated artifact that .gitignore does not cover appeared. The
          # root .gitignore already covers /target, the per-crate target
          # directories, the coverage intermediates and the cbindgen staging
          # files, so a normal run leaves this empty.
          changed="${RUNNER_TEMP}/worktree-status.txt"
          git status --porcelain > "${changed}"
          if [ -s "${changed}" ]; then
            echo 'FAIL: the working tree changed while this gate ran:'
            cat "${changed}"
            exit 1
          fi
          echo 'the working tree is byte-identical to the checkout: this gate builds, it does not rewrite'

  # The minimum supported Rust version floor
  #
  # WHY THIS IS A JOB IN THIS FILE, AND WHY IT IS NOT A MATRIX LEG ABOVE.
  #
  # It belongs in this file because the MSRV floor is a property of the BUILD:
  # the question it answers is whether the declared minimum toolchain still
  # compiles the workspace against the committed lockfile. It is one of the
  # four items the previous attempt at this migration left unfinished - a
  # header that broke C consumers, an advisory scan never executed, the aarch64
  # and macOS targets never built, and THE MSRV PIN NEVER CONFIRMED - and all
  # four are designed in from the start here rather than deferred again.
  #
  # It is a separate job rather than a fifth matrix leg so that a failure names
  # itself. A matrix leg would report as "the build failed for one entry" and
  # send somebody looking at a target triple; a distinct job called `MSRV
  # floor` reports the actual finding, which is that a dependency has raised
  # its own minimum.
  msrv:
    name: 'MSRV floor'
    runs-on: ubuntu-latest

    # 20 minutes. This job compiles the same workspace as one build leg, minus
    # the release profile's optimisation work, on a toolchain that has to be
    # downloaded first.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 'install the MSRV toolchain'
        run: |
          # THE ONE TOOLCHAIN INSTALLATION IN THIS FILE, and the only one that
          # is justified: rust-toolchain.toml pins the stable channel the build
          # legs use and deliberately does not mention the floor, because the
          # floor is not a channel anybody develops on.
          #
          # --profile minimal because this job needs rustc, cargo and the host
          # standard library and nothing else. rustfmt, clippy and
          # llvm-tools-preview belong to the pinned channel for the gates that
          # use them; downloading them for a toolchain that only has to answer
          # "does this compile" would be waste, and a component that failed to
          # download would fail this job for a reason unrelated to the MSRV.
          #
          # Explicitly NOT nightly. Nightly appears nowhere in this file; it
          # belongs to rust-miri.yml, which installs it itself, and to the
          # AddressSanitizer leg once that is added.
          rustup toolchain install "${MSRV_TOOLCHAIN}" --profile minimal

      - name: 'toolchain versions'
        run: |
          # Both toolchains are printed: the pinned stable channel, so it is
          # clear which one this job is NOT using, and the floor, so it is
          # clear which one it is.
          echo '::group::the pinned stable channel (not used by this job)'
          rustc --version
          cargo --version
          echo '::endgroup::'
          echo '::group::the MSRV toolchain this job uses'
          rustc "+${MSRV_TOOLCHAIN}" --version
          cargo "+${MSRV_TOOLCHAIN}" --version
          echo '::endgroup::'
          # The manifest section that declares the floor. awk rather than a sed
          # line range because a range ends ON its terminator, so it would
          # print the next section's header too and the log would suggest this
          # step read more than it did.
          echo '::group::Cargo.toml [workspace.package]'
          awk '/^\[/ { inside = ($0 == "[workspace.package]") } inside && !/^(#|$)/' Cargo.toml
          echo '::endgroup::'

      - name: 'assert: the installed floor is the declared floor'
        run: |
          # A cross-file assertion, and the reason MSRV_TOOLCHAIN cannot drift
          # away from the manifest unnoticed. Cargo.toml declares the floor as
          # a two-component `rust-version`; rustup wants a three-component
          # toolchain name; this reconciles them instead of letting two
          # independent literals slowly disagree.
          declared="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${declared}" ]; then
            echo 'FAIL: Cargo.toml [workspace.package] declares no rust-version.'
            echo 'The MSRV floor is a mandated requirement and the manifest is where it is declared.'
            exit 1
          fi
          case "${MSRV_TOOLCHAIN}" in
            nightly*|beta*)
              echo "FAIL: MSRV_TOOLCHAIN is ${MSRV_TOOLCHAIN}; the floor must be a released stable version."
              exit 1
              ;;
          esac
          want="$(printf '%s' "${declared}" | cut -d. -f1,2)"
          have="$(printf '%s' "${MSRV_TOOLCHAIN}" | cut -d. -f1,2)"
          if [ "${want}" != "${have}" ]; then
            echo "FAIL: Cargo.toml declares rust-version ${declared}, but this job installs ${MSRV_TOOLCHAIN}."
            echo 'Raise or lower both together, or neither. They are the same requirement stated twice.'
            exit 1
          fi
          active="$(cargo "+${MSRV_TOOLCHAIN}" --version | awk '{ print $2 }')"
          if [ "${active}" != "${MSRV_TOOLCHAIN}" ]; then
            echo "FAIL: cargo +${MSRV_TOOLCHAIN} reports ${active}."
            echo 'The explicit +toolchain argument overrides rust-toolchain.toml, so a mismatch means'
            echo 'the requested toolchain is not the one that ran. Find and remove the override.'
            exit 1
          fi
          echo "Cargo.toml rust-version ${declared} is honoured by the installed toolchain ${active}"

      - name: 'msrv: cargo build --locked --workspace on the floor toolchain'
        run: |
          # The floor, confirmed.
          #
          # HOST ONLY, AND NO --release. The question is whether the floor
          # toolchain accepts this source and this lockfile, and a host debug
          # build answers it completely. --target would re-ask the release
          # gate's question on a toolchain it does not use, and --release would
          # re-ask it in a second configuration; both blur what a failure here
          # means. --locked stays, because the lockfile is half of what is being
          # tested.
          #
          # HOW TO READ A FAILURE HERE. It almost certainly means a dependency
          # version in Cargo.toml declares a minimum newer than the floor, and
          # THE DEFECT IS THAT VERSION PIN, NOT THE FLOOR. That tension is
          # ambiguity A6 in specification 0.8.6 - "MSRV 1.75 versus the latest
          # quinn, russh and clap" - and A6 is recorded there as RESOLVED, by
          # adopting a version set that satisfies the floor. It is deliberately
          # NOT A4: A4 is the aarch64-apple-darwin variadic ABI item, which is a
          # property of one target rather than of any version pin, and it is
          # escalated rather than resolved. Confusing the two sends a reader to
          # the wrong file. Raising the MSRV is in any case a decision for
          # whoever set it, and not a change to be made to get a build green.
          #
          # TWO CAUSES ARE FAR MORE LIKELY THAN A MANDATED CRATE, because both
          # are transitive and both have already happened once. `cargo update`
          # re-floats the two lockfile pins that hold this floor reachable:
          # getrandom must stay at 0.3.3, because 0.3.4 reaches `wasip2` at
          # rust-version 1.87; and wasi must stay at 0.14.0, because 0.14.7
          # reaches `wit-bindgen 0.57.1`, which is EDITION 2024. The second is
          # the nastier of the two - Cargo 1.75 cannot PARSE an edition-2024
          # manifest, so `cargo metadata` fails for the entire graph and the
          # error surfaces from cbindgen inside curl-rs-ffi's build script,
          # nowhere near its cause. Both crates sit on a Windows-only,
          # WebAssembly-only branch under cc's build dependency on jobserver;
          # neither is compiled for any mandated target. Cargo.toml's
          # rust-version comment records the chain and the remedy: restore the
          # two pins with `cargo update -p <crate>@<new> --precise <pinned>`.
          #
          # The adopted version set was swept in full against the floor and
          # produced zero violations, and it was chosen over the newest
          # releases on purpose:
          # clap 4.6.4, quinn 0.11.11, russh 0.62.4, rand 0.10.2, sha2 0.11.0
          # and hmac 0.13.0 all declare a minimum of 1.85. Two independent
          # reasons make the adopted set preferable anyway, so a "fix" that
          # advanced those pins would lose both. First, every russh release
          # from 0.58.0 through 0.62.4 pulls release-candidate cryptography -
          # a release-candidate RSA and pkcs1 throughout, a release-candidate
          # ssh-key at 0.62.4, and seventeen such requirements at 0.60.3, the
          # release that carries the fix - whereas the pinned
          # russh has a fully stable graph, and shipping release-candidate
          # cryptography would put the advisory gate in permanent jeopardy.
          # Second, the adopted set is coherent on one digest generation
          # throughout; the newest set would place two incompatible digest
          # generations in one graph and the HMAC-over-SHA-1 construction
          # would simply fail to compile.
          #
          # ONE OTHER REGRESSION THIS JOB IS THE ONLY GATE TO CATCH. Both build
          # scripts must emit the legacy single-colon `cargo:` directive form
          # rather than the double-colon `cargo::` form, which postdates the
          # floor. On the floor toolchain a double-colon directive is a HARD
          # FAILURE - `error: unsupported output in build script` - so if this
          # job fails with that message the remedy is to restore the
          # single-colon spelling, nothing more. It matters because the shared
          # library's soname is emitted by exactly such a directive from
          # curl-rs-ffi/build.rs.
          cargo "+${MSRV_TOOLCHAIN}" build --locked --workspace

      - name: 'assert: this gate wrote nothing outside target/'
        run: |
          # Same property as the build legs, same reasoning. --locked means the
          # lockfile must be unchanged, and a floor toolchain that regenerated
          # it would have invalidated the very thing this job set out to test.
          changed="${RUNNER_TEMP}/worktree-status.txt"
          git status --porcelain > "${changed}"
          if [ -s "${changed}" ]; then
            echo 'FAIL: the working tree changed while this gate ran:'
            cat "${changed}"
            exit 1
          fi
          echo 'the working tree is byte-identical to the checkout: this gate builds, it does not rewrite'
