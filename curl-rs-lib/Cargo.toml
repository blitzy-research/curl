# ===========================================================================
# curl-rs-lib -- the libcurl protocol engine.
#
# This crate supersedes the C protocol engine: 163,664 measured lines across
# lib/*.c, lib/*.h and the five specialised subtrees (lib/curlx 18, lib/vtls
# 15, lib/vauth 13, lib/vquic 4, lib/vssh 3 translation units). Per AAP 0.1.1
# G1 it is "the only crate with protocol knowledge"; curl-rs (the
# command-line binary) and curl-rs-ffi (the C ABI shim) are thin adapters
# over it, so the dependency direction is
#
#     curl-rs-ffi  ->  curl-rs-lib  <-  curl-rs
#
# with no cycles and no protocol logic in either leaf crate.
#
# NOTHING in this manifest pins a version. AAP 0.4.2: the workspace manifest
# "is the single place versions are declared; member manifests inherit
# through `workspace = true`, so a version can never disagree between
# crates". Every dependency below is therefore `{ workspace = true }` plus,
# only where genuinely required, an ADDITIVE crate-local `features` /
# `optional` overlay.
#
# CARGO MECHANIC that governs every overlay in this file: Cargo features are
# additive and are UNIONED across the whole dependency graph. A member crate
# can only ADD features, never subtract them. Consequently
#   * `features = [...]` in a member is always honoured, and
#   * `default-features = false` in a member is IGNORED (with a warning that
#     Cargo says may become a hard error) whenever the inherited
#     `[workspace.dependencies]` entry did not itself set it.
# That warning would break AAP 0.8.4 gate 1 ("zero warnings"), so this file
# never writes `default-features` at all. Where turning defaults off matters
# -- the cryptographic provider -- the root manifest already does it; see the
# TLS block below.
# ===========================================================================

[package]
name = "curl-rs-lib"

# A crate-specific description rather than an inherited one: the three
# workspace members have genuinely different roles (engine / binary / C ABI),
# and `cargo metadata` and any future package registry entry should say which
# is which. Every other shared field IS inherited, because duplicating it is
# exactly the drift the root manifest exists to prevent (AAP 0.4.2).
description = "The libcurl protocol engine in safe Rust: transfer core, connection filters, rustls TLS, DNS, authentication, and the HTTP/1.1, HTTP/2, HTTP/3, FTP, SFTP, SCP, file and WebSocket protocol implementations"

# Inherited from [workspace.package]. Never restated as literals here.
#
# The resolved values, and the authority for each:
#   * package version  -- the semantic prefix of LIBCURL_VERSION. The reported
#     libcurl version string is "8.19.0-DEV" (include/curl/curlver.h:35), with
#     LIBCURL_VERSION_MAJOR 8, _MINOR 19, _PATCH 0 (curlver.h:39-41) and
#     LIBCURL_VERSION_NUM 0x081300 (curlver.h:61). The existing build already
#     treats curlver.h as the single version oracle: CMakeLists.txt:54-65
#     greps LIBCURL_VERSION out of that header and feeds the semantic prefix
#     to `project(CURL VERSION ...)`. Nothing here may bump it -- AAP 0.8.1
#     freezes the contract, and AAP 0.8.5/C6 binds every parity claim in this
#     work to curl/libcurl 8.19.0-DEV as checked out at commit 54cf587b9c.
#   * edition = 2021 and rust-version = 1.75 -- AAP 0.8.3 preserves the user's
#     directive verbatim: "Rust edition 2021, MSRV 1.75." The MSRV also has to
#     agree with clippy.toml's `msrv` and with the floor recorded in
#     rust-toolchain.toml. AAP 0.7 obligation 1 requires that `rust-version`
#     appear in EVERY member manifest, which the inherited key below satisfies
#     (`cargo metadata` reports rust_version = "1.75" for this crate).
#   * license = "curl" -- matches the SPDX identifier in the header above and
#     the `curl` entry in deny.toml's licence allow-list.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

# ---------------------------------------------------------------------------
# Deliberately NO [lib] section.
#
# Cargo's defaults are exactly right: src/lib.rs, target name `curl_rs_lib`,
# and a plain `rlib`. This crate must NOT declare an artifact-kind list.
# AAP 0.3.1 gives `cdylib` and `staticlib` to curl-rs-ffi ALONE, and that
# crate additionally renames its output to `curl` so the shared object is
# `libcurl.so`. Emitting a second shared object here would destroy the
# single-artifact identity `libcurl.so.4`, which the repository derives twice
# and identically:
#   * Autotools -- lib/Makefile.soname sets VERSIONCHANGE=12, VERSIONADD=0,
#     VERSIONDEL=8, i.e. libtool `-version-info 12:0:8`, applied at
#     lib/Makefile.am:97-99.
#   * CMake -- lib/CMakeLists.txt:285-291 computes
#     `_cmakesoname = VERSIONCHANGE - VERSIONDEL` = 12 - 8 = 4 and
#     `_cmakeversion = 4.8.0`, then sets `VERSION "4.8.0" SOVERSION "4"`.
# Both yield SONAME libcurl.so.4. The link argument that reproduces it lives
# in curl-rs-ffi/build.rs, not here and not in .cargo/config.toml.
#
# No [[bin]], no [[bench]] and no [[example]] target either. This crate is a
# library only, and there is no benchmark harness because performance is an
# explicit non-goal -- AAP 0.1.1: "Explicitly NOT performance. No performance
# objective, latency target, or throughput requirement appears anywhere in
# the request [...] any change justified solely by speed is out of scope."
#
# This crate also links no native library of its own, declares no build
# script (AAP 0.3.1 assigns build scripts to curl-rs/build.rs and
# curl-rs-ffi/build.rs only), and introduces no dependency override, no
# vendored source replacement and no alternative registry -- AAP 0.5.1: the
# workspace has "exactly three path dependencies among its own members and no
# private registry, vendored crate, or internal package feed".
#
# Unwind semantics are left at the Rust default so that curl-rs-ffi can
# CONTAIN unwinding at the C ABI boundary instead of aborting the host
# process. No build-profile table appears here in any case: profiles are
# honoured only in the workspace root, and a member-level one emits a warning
# that would break AAP 0.8.4 gate 1.
#
# Lint levels are not expressed in this manifest. The safety invariant is an
# attribute pair in src/lib.rs -- AAP 0.1.1 G6: "`#![forbid(unsafe_code)]` at
# the root of curl-rs-lib and curl-rs, with a single `#[allow(unsafe_code)]`
# attribute on `mod ffi`" -- and `-D warnings` is applied on the command line
# by .github/workflows/rust-clippy.yml (AAP 0.8.4 gate 2) so that, per AAP
# 0.7, "a lint failure names itself rather than hiding inside a build log".
# ---------------------------------------------------------------------------

[dependencies]

# --- Async runtime, buffers and safe pin projection -----------------------
#
# tokio: AAP 0.8.3 preserves the user's directive -- "Tokio with a
# current-thread runtime for the CLI and a multi-thread runtime for the multi
# handle". The multi-thread flavour is driven from src/multi/, so
# `rt-multi-thread` belongs to the engine while curl-rs and curl-rs-ffi
# select their own entry-point flavour. The feature list below is additive and
# records exactly which parts of the runtime the engine relies on: `net` and
# `io-util` for src/conn/, `time` for the timeout that replaces the
# alarm()/sigsetjmp() DNS deadline in lib/hostip.c (AAP 0.6.9), `sync` for the
# shared state behind curl-rs-lib/src/share/, `fs` for src/protocols/file.rs
# and the cookie / HSTS / alt-svc jars, and `macros` for the `tokio::select!`
# that implements Happy Eyeballs in src/conn/happy_eyeballs.rs (AAP 0.4.1).
# The root entry currently requests `full`, so the graph-wide union is `full`;
# this list is the set that would remain were the root narrowed, and it
# documents the engine's actual requirement either way.
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

# Codec and compatibility adapters for src/conn/ and src/protocols/.
tokio-util = { workspace = true, features = ["codec", "compat", "io"] }

# Stream and future combinators used across the protocol state machines.
futures = { workspace = true }

# Safe pin projection inside the `Box<dyn ConnFilter>` chain
# (src/conn/filters.rs). This crate exists precisely so that pin projection
# needs no `unsafe`, which is why it is load-bearing for AAP 0.1.1 G6.
pin-project-lite = { workspace = true }

# `BytesMut` / `Vec<u8>` supersede the hand-rolled buffer arithmetic of
# lib/curlx/dynbuf.c, lib/sendf.c and lib/bufq.c. AAP 0.6.9: this "make[s] the
# invariant the type's responsibility" rather than the programmer's.
bytes = { workspace = true }

# --- HTTP ------------------------------------------------------------------
#
# Backs src/protocols/http1.rs, src/protocols/http2.rs, src/headers/ and
# src/transfer/.
#
# NOTE, and it is a design constraint rather than a preference: hyper is used
# for connection management, keep-alive and framing ONLY. Request-line
# composition and header emission stay ours, because AAP 0.6.7 establishes
# that 1,476 of the 1,914 fixtures compare the request bytes as a single
# joined string -- header order, casing and spacing are all significant -- and
# hyper neither emits curl's default headers nor guarantees their order.
hyper = { workspace = true, features = ["http1", "http2", "client"] }
hyper-util = { workspace = true, features = [
  "client",
  "client-legacy",
  "http1",
  "http2",
  "tokio",
] }

# h2 is declared even though hyper already embeds it. AAP 0.8.5/C4 resolves
# the apparent redundancy: "hyper is used with ["http1", "http2", "client"]
# for connection management, and `h2` is declared explicitly because raw
# SETTINGS and flow-control manipulation is observable in curl 8.x fixture
# expectations and is not reachable through hyper's surface."
#
# Honest caveat about what the `http2` feature actually gates: hyper's own
# `http2` feature is enabled by the root manifest unconditionally, so h2
# remains in the resolved graph even under --no-default-features. The `http2`
# feature below therefore gates THIS crate's direct use of h2's raw frame
# surface and the src/protocols/http2.rs module -- not h2's presence in the
# dependency tree.
h2 = { workspace = true, optional = true }

http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }

# HTTP date formatting for conditional requests (-z / --time-cond).
httpdate = { workspace = true }

# --- QUIC and HTTP/3 (feature `http3`) ------------------------------------
#
# Supersedes lib/vquic/vquic.c, lib/vquic/curl_ngtcp2.c and
# lib/vquic/vquic-tls.c. AAP 0.8.3: "HTTP/3 via quinn and h3 using
# `AsyncUdpSocket`" -- the named socket abstraction, not an ad-hoc UDP
# wrapper. HTTP/3 is already a connection filter in the C design
# (`extern struct Curl_cftype Curl_cft_http3`, lib/vquic/vquic.h:48), so it
# slots into the same `ConnFilter` trait as TLS and raw sockets instead of
# needing a parallel abstraction (AAP 0.3.3 P2).
#
# quinn carries NO feature overlay here -- see the TLS block for why.
quinn = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }

# --- TLS -- rustls only, and the provider is pinned by the ROOT ------------
#
# This is the highest-risk block in the file. AAP 0.5.1 calls the provider
# declaration "the single most consequential manifest decision".
#
# The root [workspace.dependencies] already declares all three entries with
# `default-features = false` and an explicit `ring` provider. They are
# referenced here BARE -- no `features`, no `default-features` -- and that is
# deliberate, not an omission. Because Cargo unions features across the whole
# graph (see the mechanic at the top of this file), naming the alternative
# provider's feature -- or any feature that transitively enables it --
# ANYWHERE in this manifest would silently re-link a second cryptographic
# provider even though the root said `default-features = false`. There is no
# local scope for feature selection: a member cannot opt out of what any other
# member, or any transitive dependency, has opted in to. That is precisely why
# the three entries below carry no overlay of any kind.
#
# The four defects that accepting the upstream defaults would cause, from
# AAP 0.5.1 -- the default sets disagree with each other, which is what makes
# this a trap rather than a preference:
#   1. duplicated cryptographic code in one binary;
#   2. a build-time requirement for CMake and NASM, introduced by the
#      alternative provider's vendored C and assembly, "which is likely to
#      break the `cross`-based aarch64 Linux leg" (also AAP 0.6.8);
#   3. a large vendored-C surface sitting awkwardly against the no-C-TLS
#      requirement of AAP 0.8.2;
#   4. `prefer-post-quantum`, on by default upstream, offers a hybrid
#      X25519MLKEM768 key exchange that CHANGES THE BYTES OF THE TLS
#      ClientHello relative to curl 8.x. Under the byte-exact, order-
#      significant fixture comparison of AAP 0.6.7 that puts every HTTPS
#      fixture at risk.
#
# quinn's `rustls` feature already implies `rustls-ring`, so the provider
# stays consistent across the graph without a second declaration.
#
# `platform-verifier` is deliberately omitted from quinn: it would delegate
# the trust DECISION to the operating-system store, which conflicts with
# curl's --cacert, --capath and --insecure semantics remaining authoritative.
# Those semantics are owned by src/tls/verify.rs.
#
# Honest disclosure, escalated as AAP 0.8.6/A7: neither `ring` nor the
# alternative provider is pure Rust -- both contain C and assembly. The
# user's constraint is satisfied in the sense that matters, which is that no C
# TLS library is linked: rustls implements the TLS state machine, record layer
# and certificate verification in Rust, and the provider supplies only
# primitives. `ring` is chosen as the more portable and more readily
# cross-compiled of the two.
rustls = { workspace = true }
tokio-rustls = { workspace = true }

# Certificate and key types shared across src/tls/, AND the PEM parsing behind
# --cacert, --capath, --cert and --key, consumed by src/tls/verify.rs.
#
# `std` is requested explicitly because the FILE-reading half of the PEM API --
# `PemObject::from_pem_file`, `pem_file_iter` and `from_pem_reader` -- is gated
# on that feature (verified in rustls-pki-types 1.15.1, src/pem.rs:37/50/59),
# whereas this crate's own default set is only ["alloc"]. Reading PEM from a
# path is precisely what --cacert, --capath, --cert and --key require, so the
# overlay is load-bearing rather than cosmetic. It is additive, hence always
# honoured.
#
# SUPPLY-CHAIN DECISION -- a deliberate, evidenced divergence from the AAP
# 0.5.1 inventory, recorded here rather than hidden. That inventory lists a
# SEPARATE crate for this PEM parsing. It is now UNMAINTAINED:
# RUSTSEC-2025-0134 reports its repository archived since August 2025 and
# states plainly that "No safe upgrade is available", so `cargo deny check
# advisories` FAILS for as long as it stays in the graph -- which would break
# AAP 0.8.4 gate 9 and AAP 0.7's "Supply-chain hygiene is continuous"
# obligation. The advisory's own remedy is to "depend directly on the
# underlying PEM parsing code included in rustls-pki-types since 1.9.0",
# because the retired crate "is in fact a thin wrapper around the same code".
# Both halves of that were verified against the registry rather than taken on
# trust: the retired crate's ONLY dependency is pki-types, and pki-types at
# 1.15.1 (>= 1.9.0) exports the `PemObject` trait it wraps. Dropping it removes
# an advisory WITHOUT removing any capability, and without suppressing anything
# in deny.toml -- which, being a sibling file, is not this file's to edit. The
# root manifest's now-unused [workspace.dependencies] entry is reported upward
# rather than changed from here, per AAP 0.4.2's single-source principle.
rustls-pki-types = { workspace = true, features = ["std"] }

# Bundled trust anchors, superseding the CA bundle the C build embeds through
# src/mk-file-embed.pl.
webpki-roots = { workspace = true }

# Platform trust-store READING, for the cases where curl's own semantics call
# for the system store. This is NOT the same thing as delegating the trust
# decision to the platform: the decision stays in src/tls/verify.rs, which
# remains authoritative for --cacert, --capath and --insecure. Keeping the
# read path and the decision separate is exactly why `platform-verifier` is
# omitted above while this crate is present.
rustls-native-certs = { workspace = true }

# --- SSH -- SFTP and SCP (feature `ssh`) ----------------------------------
#
# AAP 0.8.3: "russh for SFTP and SCP." Supersedes the C SSH transport under
# lib/vssh/ (3 translation units, 7,552 lines with its headers); the alternate
# SSH backend in that directory is out of scope entirely (AAP 0.2.2).
#
# Referenced bare on purpose. The root entry must carry
# `default-features = false` together with an explicit feature list, because
# russh's own defaults pull the alternative cryptographic provider and would
# defeat the pinning above -- and a member-level `default-features = false`
# cannot fix that, it is merely ignored with a warning. AAP 0.5.1 also records
# why the adopted release matters: "every `russh` release from 0.58.0 through
# 0.62.4 depends on release-candidate cryptography", whereas the adopted one
# "has a fully stable dependency graph with no pre-release requirements at
# all". Shipping release-candidate cryptography would put AAP 0.8.4 gate 9
# (`cargo audit`, zero critical advisories) in permanent jeopardy.
russh = { workspace = true, optional = true }

# --- Sockets --------------------------------------------------------------
#
# Absorbs the raw setsockopt / getsockopt / fcntl calls of lib/cf-socket.c,
# lib/socketpair.c and lib/curlx/nonblock.c into src/conn/socket.rs. This is
# the crate that makes AAP 0.8.5/C3 work: "Route everything expressible
# through `socket2`, and relocate the genuine residue into
# curl-rs-lib/src/ffi/sys.rs." Without it the zero-`unsafe` invariant of
# AAP 0.1.1 G6 is unachievable.
socket2 = { workspace = true, features = ["all"] }

# --- URL and encoding -----------------------------------------------------
#
# src/url/mod.rs backs the six exported curl_url_* symbols. curl's own
# parsing quirks are preserved rather than delegated wholesale to the `url`
# crate, which is used for the parts where the two genuinely agree.
url = { workspace = true }

# Internationalised domain names, replacing libidn2 (src/url/idn.rs).
idna = { workspace = true }

# Percent-encoding tables behind curl_escape / curl_unescape
# (src/url/escape.rs, from lib/escape.c).
percent-encoding = { workspace = true }

# Form encoding for application/x-www-form-urlencoded bodies.
form_urlencoded = { workspace = true }

# --- Cryptographic primitives --------------------------------------------
#
# These replace the hand-rolled digests of lib/md5.c, lib/md4.c, lib/sha256.c,
# lib/curl_sha512_256.c and lib/hmac.c with the RustCrypto equivalents, and
# they back src/crypto/ and src/auth/.
#
# CRITICAL COHERENCE PROPERTY: every one of them must sit on the SAME `digest`
# generation, or their traits do not unify. AAP 0.5.1 records that the
# newest-release set "would have placed `digest 0.10` and `digest 0.11` in the
# same graph, and `Hmac<Sha1>` would have failed to compile -- a build break
# that would have surfaced only after the manifests were written". The adopted
# set is coherent on `digest 0.10` throughout, and deny.toml enforces that
# mechanically by denying `digest >= 0.11.0`.
#
# Do not "upgrade" any of these. AAP 0.5.1 records that the newest releases of
# sha2 (0.11.0), hmac (0.13.0) and rand (0.10.2) all declare MSRV 1.85 and so
# violate the mandated 1.75 floor; the adopted set is the newest version of
# each crate satisfying that floor and "was swept in full and produced zero
# violations".

# SHA-1: the WebSocket handshake accept key and Digest authentication.
sha1 = { workspace = true }

# SHA-256 / SHA-512: Digest authentication, AWS SigV4 signing, and the
# certificate pinning of --pinnedpubkey.
sha2 = { workspace = true }

# MD5: Digest authentication and the NTLM response.
md-5 = { workspace = true }

# MD4: the NTLMv1 hash (lib/curl_ntlm_core.c).
md4 = { workspace = true }

# HMAC: Digest-SESS and AWS SigV4.
hmac = { workspace = true }

# DES: the NTLM response (src/auth/ntlm.rs), keeping NTLM pure Rust as
# AAP 0.8.3 requires.
des = { workspace = true }

# Randomness for src/crypto/rand.rs (from lib/rand.c), nonces and boundary
# strings. Pinned at the 0.8 series RATHER THAN ADVANCED, specifically because
# the adopted russh release requires `rand ^0.8` (AAP 0.5.1) and unifying on
# it keeps a single copy in the paths that share it. Note honestly that the
# resolved graph still contains a second, newer `rand` reached through
# quinn-proto; deny.toml lists `rand`, `rand_core`, `chacha20` and
# `getrandom` in its `skip` set for exactly that reason, so the
# `multiple-versions = "deny"` policy is satisfied.
rand = { workspace = true }

# --- Encoding and content compression ------------------------------------
#
# base64 spans authentication (Basic, Digest, NTLM, Negotiate, Bearer) and
# MIME, replacing lib/curlx/base64.c.
base64 = { workspace = true }

# Hex encoding for Digest responses and public-key pinning.
hex = { workspace = true }

# Content-Encoding handling in src/transfer/content_encoding.rs, superseding
# the zlib, brotli and zstd C calls of lib/content_encoding.c.
#
# flate2 (feature `gzip`) MUST resolve to its PURE-RUST backend: AAP 0.8.2
# forbids linking C libraries into this build, and the pure-Rust path is what
# keeps the aarch64 cross leg free of a native toolchain requirement
# (AAP 0.6.8). The backend is therefore selected EXPLICITLY BY NAME below.
#
# `default-features` is deliberately not written here, and the reason is
# mechanical rather than stylistic: for a workspace-inherited dependency
# Cargo IGNORES a member-level `default-features = false` when the root entry
# did not set it, and emits a warning that would break AAP 0.8.4 gate 1.
# `features` is additive and always honoured, so naming `rust_backend`
# achieves the requirement safely. Measured corroboration: flate2's own
# default set at the adopted release consists solely of `rust_backend`, none
# of its C-backed backend features is enabled anywhere in the graph, and
# `cargo tree -i libz-sys` reports that crate absent from the resolved tree.
flate2 = { workspace = true, optional = true, features = ["rust_backend"] }

# Brotli decoding (feature `brotli`), replacing the C brotli library. This
# crate is pure Rust.
brotli = { workspace = true, optional = true }

# Zstandard decoding (feature `zstd`).
#
# FINDING, recorded rather than papered over: at the adopted release this
# crate has NO pure-Rust backend. Its only dependency is zstd-safe, which in
# turn requires zstd-sys, so a C binding (zstd-sys, vendoring zstd 1.5.7) is
# unavoidable and does appear in the resolved graph. That binding is not
# banned by deny.toml, and it is not a TLS library, so neither AAP 0.8.2's
# no-C-TLS prohibition nor the committed supply-chain policy is violated. It
# is nonetheless a genuine C dependency in a workspace whose stated intent is
# to eliminate them, so it is surfaced here for the deny.toml owner to rule
# on rather than hidden. The alternative -- dropping Content-Encoding: zstd --
# would break fixture parity and is not this file's decision to take.
zstd = { workspace = true, optional = true }

# --- Cookie-domain policy (feature `cookies`) -----------------------------
#
# publicsuffix supplies the public-suffix rules that libpsl previously
# supplied (src/cookies/psl.rs, from lib/psl.c).
#
# DELIBERATE OMISSION, from AAP 0.5.1: "No cookie-store crate is used. curl's
# Netscape cookie-jar file must remain byte-compatible so that a jar written
# by curl 8.x is readable by this implementation and vice versa, and no
# general-purpose crate commits to that on-disk format. The jar is implemented
# natively in curl-rs-lib/src/cookies/mod.rs; `publicsuffix` supplies only the
# domain-matching rules that libpsl previously supplied." The same reasoning
# applies to the HSTS and alt-svc caches, whose on-disk formats
# src/cookies/hsts.rs and src/cookies/altsvc.rs reproduce natively.
publicsuffix = { workspace = true, optional = true }

# --- Errors, diagnostics, parsing and OS types ---------------------------
#
# thiserror is used BEHIND the pinned CURLcode mapping, never in place of it.
# src/error.rs still writes every discriminant explicitly, because AAP 0.6.1
# establishes that CURLcode declares only CURLE_OK = 0 and lets the other 102
# tokens take their value from declaration order -- including 15 retired
# CURLE_OBSOLETE* placeholders at exactly {20, 24, 29, 32, 34, 40, 41, 44, 46,
# 50, 51, 57, 62, 75, 76}. Omitting one placeholder silently shifts every
# later code, so ordinal inference is prohibited and derive macros may not be
# trusted to assign values.
thiserror = { workspace = true }

# C types for the confined FFI island, src/ffi/sys.rs and src/ffi/gss.rs, and
# for nothing else. Those two modules are the only place in this crate where
# `unsafe` is permitted, under a single `#[allow(unsafe_code)]` on `mod ffi`
# (AAP 0.1.1 G6), and every block there carries a `// SAFETY:` comment.
libc = { workspace = true }

# Logging facade, kept because several dependencies emit through it and the
# engine must be able to route their records into curl's own trace output.
log = { workspace = true }

# Structured diagnostics backing --trace, --trace-ascii and --trace-config in
# src/trace.rs (from lib/curl_trc.c). The emitted trace FORMATS are frozen by
# AAP 0.8.1, so tracing supplies the plumbing while the rendering stays ours.
tracing = { workspace = true }

# Byte scanning in header and chunked-framing parsing, replacing
# lib/curl_memrchr.c and the hand-rolled scans of lib/http1.c and
# lib/http_chunks.c.
memchr = { workspace = true }

# Content-type inference for multipart bodies (src/mime/).
#
# JUDGEMENT CALL, evidenced: the inference lives in the LIBRARY, not the tool.
# lib/mime.c:1611 `add_content_type()` walks a static table declared at
# lib/mime.c:1629 (`static const struct ContentType ctts[]`) matching by
# filename suffix at lib/mime.c:1647-1651, whereas src/tool_formparse.c only
# handles the explicit `;type=` syntax of -F and performs no inference at all.
# So this dependency belongs to curl-rs-lib rather than to curl-rs.
#
# CONSTRAINT ON ITS USE: curl's ctts[] table holds only a handful of entries
# and falls back to application/octet-stream. This crate's database is far
# larger, so letting it answer freely would emit Content-Type bytes that
# curl 8.x never emits -- a violation of the wire freeze in AAP 0.8.1 and of
# the byte-exact fixture comparison in AAP 0.6.7. src/mime/mod.rs must
# therefore treat curl's ctts[] table as authoritative and must never widen
# the answer set beyond it.
mime_guess = { workspace = true }

# --- Dependencies this crate deliberately does NOT declare ---------------
#
# * The command-line argument parser and its shell-completion generator
#   belong to the curl-rs binary crate: AAP 0.3.1 places the whole argument
#   surface in curl-rs/src/cli/. Declaring them here would put CLI knowledge
#   in the engine, inverting AAP 0.1.1 G1's "no protocol logic in either leaf
#   crate".
# * The C-header generator is a BUILD dependency of curl-rs-ffi alone, which
#   AAP 0.4.1 maps to curl-rs-ffi/build.rs together with the soname
#   configuration. This crate has no build script at all.
# * The coverage, advisory-scanning, licence-policy and cross-build tools of
#   AAP 0.5.1 are CI tools installed by the workflows that need them. They are
#   not manifest dependencies of any crate and appear in neither table here.
# * No C TLS, C QUIC, C SSH, C DNS, C compression or C internationalisation
#   binding crate appears anywhere in this file. AAP 0.8.2: "No C TLS library
#   at any configuration -- not as a default, not behind a feature flag, not
#   as a fallback." The single exception surfaced honestly above is zstd-sys,
#   reached transitively through zstd, which is a compression codec and not a
#   security library.

# ===========================================================================
# [features] -- the functioning feature table for the workspace.
#
# Cargo has NO [workspace.features] table, so while the root manifest records
# the vocabulary and the intended default state, the table that actually
# governs compilation is THIS one.
#
# AAP 0.5.2 fixes the vocabulary at exactly fifteen names, "declared once at
# the workspace level so that a capability cannot be enabled in one crate and
# disabled in another". Those names are used verbatim below and none is added.
#
# WHAT THIS TABLE REPLACES, measured in this repository rather than estimated:
# configure.ac carries 101 configuration knobs (57 `AC_ARG_ENABLE` plus 44
# `AC_ARG_WITH`), and the root CMakeLists.txt carries 98 `option(...)` calls
# of which 47 are `option(CURL_DISABLE_*)`. That combined surface of 199
# preprocessor-driven switches collapses to the fifteen features below. Per
# AAP 0.4.2 the three jobs of `#include "curl_setup.h"` separate cleanly:
# feature selection becomes Cargo [features], platform detection becomes
# `#[cfg(target_os = ...)]` / `#[cfg(target_arch = ...)]`, and shared type
# declarations become ordinary `use` statements.
#
# TWO NAMES THAT ARE DELIBERATELY ABSENT, recorded so that nobody adds them
# later:
#
#   * There is NO `tls` feature. AAP 0.4.2 uses `#[cfg(feature = "tls")]` only
#     as an illustrative example of the `#ifdef USE_SSL` transformation pattern;
#     it is not among AAP 0.5.2's fifteen names, and an off-switchable `tls`
#     feature would permit a build with no TLS at all -- contradicting both
#     AAP 0.1.1 G4 ("rustls exclusively, validation on by default") and
#     AAP 0.8.2. TLS is UNCONDITIONAL in this crate, which is why every rustls
#     dependency above is non-optional. HTTP/1.1 is unconditional for the same
#     structural reason: there is no `http1` name in the vocabulary either.
#
#   * There is NO `testing` feature. AAP 0.8.7 permits relocated unit-test
#     coverage to live "as `#[cfg(test)]` modules or behind a `testing`
#     feature"; `#[cfg(test)]` modules suffice here, they keep the relocated
#     assertions out of every shipped artifact, and adding a published feature
#     would invite exactly the re-export that AAP 0.8.7 forbids: "Re-exporting
#     internals to satisfy them would defeat the encapsulation that makes the
#     zero-`unsafe` guarantee possible."
#
# `dep:` syntax is used throughout. It has been available since Cargo 1.60 and
# is therefore safe at the declared MSRV, and it suppresses the implicit
# feature that an optional dependency would otherwise create -- which is what
# allows `brotli` and `zstd` to name features identical to their crate names.
# ===========================================================================

[features]

# The twelve capabilities curl 8.x provides out of the box, and which a
# drop-in replacement must therefore provide out of the box as well.
default = [
  "altsvc",
  "brotli",
  "cookies",
  "doh",
  "ftp",
  "gzip",
  "hsts",
  "http2",
  "http3",
  "ssh",
  "websockets",
  "zstd",
]

# HTTP/2 -- src/protocols/http2.rs, superseding lib/http2.c and its nghttp2
# dependency. Gates this crate's direct use of h2's raw SETTINGS and
# flow-control surface per AAP 0.8.5/C4; see the h2 entry above for the honest
# caveat about hyper keeping h2 in the graph regardless.
http2 = ["dep:h2"]

# HTTP/3 over QUIC -- src/protocols/http3.rs, superseding lib/vquic/*.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

# FTP and FTPS -- src/protocols/ftp/{mod,pingpong,listparser}.rs, superseding
# lib/ftp.c, lib/pingpong.c, lib/ftplistparser.c and lib/fileinfo.c. No
# exclusive external dependency: the command sequencing is ours and must stay
# byte-exact, and FTPS reuses the unconditional TLS stack.
ftp = []

# SFTP and SCP -- src/protocols/{sftp,scp}.rs.
ssh = ["dep:russh"]

# The WebSocket surface -- src/protocols/ws.rs, superseding lib/ws.c and
# backing the four exported curl_ws_* symbols. Framing is implemented natively
# because AAP 0.6.7's comparison is byte-exact; the handshake accept key uses
# the unconditional sha1 and base64 dependencies.
websockets = []

# Cookie engine -- src/cookies/mod.rs, superseding lib/cookie.c. The jar
# format is native (see the publicsuffix entry); the optional dependency
# supplies only the public-suffix domain-matching rules.
cookies = ["dep:publicsuffix"]

# HSTS cache and its on-disk format -- src/cookies/hsts.rs, from lib/hsts.c.
hsts = []

# Alt-Svc cache and its on-disk format -- src/cookies/altsvc.rs, from
# lib/altsvc.c.
altsvc = []

# DNS-over-HTTPS -- src/dns/doh.rs, from lib/doh.c. No external dependency:
# AAP 0.4.1 specifies DoH "via the crate's own HTTP client", so it composes
# out of the unconditional HTTP and TLS stacks.
doh = []

# Content-Encoding: br
brotli = ["dep:brotli"]

# Content-Encoding: zstd
zstd = ["dep:zstd"]

# Content-Encoding: gzip and deflate. Named `gzip` rather than `flate2`
# because AAP 0.5.2 fixes the vocabulary.
gzip = ["dep:flate2"]

# --- The three capabilities that are DEFAULT-OFF, each with its reason ----

# Negotiate / SPNEGO / Kerberos HTTP authentication (src/auth/negotiate.rs)
# and GSS-API SOCKS5 (src/proxy/socks_gss.rs), superseding
# lib/vauth/krb5_gssapi.c, lib/vauth/spnego_gssapi.c, lib/http_negotiate.c,
# lib/curl_gssapi.c and lib/socks_gssapi.c.
#
# Default-off resolves AAP 0.8.5/C2, the conflict between "no C TLS linkage at
# any configuration" and "Negotiate where OS Kerberos is available":
# "GSS-API is neither libcurl, nor libssl, nor a TLS library -- it is an
# authentication mechanism. Negotiate sits behind a non-default `negotiate`
# feature with the binding confined to curl-rs-lib/src/ffi/gss.rs, so the
# default build links no C security library at all."
#
# It wires to no optional crate because the binding is written directly
# against the unconditional libc types in src/ffi/gss.rs; the feature gates
# the modules and the link directive, not a dependency.
negotiate = []

# An in-process asynchronous DNS resolver as an alternative to the system
# resolver. AAP 0.8.3 preserves the user's directive: "System resolver by
# default, with hickory-dns as an optional feature that is disabled by
# default."
#
# ESCALATION, stated plainly rather than papered over. This is the one feature
# in AAP 0.5.2's vocabulary for which AAP 0.5.1 pins NO version, so it is
# declared here as a pure cfg switch with no backing crate. A compliant
# candidate does exist -- hickory-resolver 0.25.2 declares a minimum Rust
# version of 1.71.1 and therefore satisfies the 1.75 floor, whereas
# hickory-resolver 0.26.1 declares 1.88 and violates it (established from the
# registry metadata sorted by parsed semantic version, because AAP 0.5.1
# records that the registry returns versions in reverse-chronological
# publication order and a naive read of the first element yields a stale
# answer). Adding it, however, requires a `[workspace.dependencies]` entry in
# the ROOT manifest, because AAP 0.4.2 makes the root the single place versions
# are declared, and inventing a pin in a member manifest would violate the
# discipline of AAP 0.5.1 that "No entry reads [a floating specifier] and none
# is a placeholder". Enabling this feature is therefore a no-op until that
# root entry exists; the requirement is reported upward rather than guessed at
# here.
hickory-dns = []

# A counting `GlobalAlloc` reproducing the allocation log of lib/memdebug.c
# (577 lines; the emitters at lib/memdebug.c:191-368 write
# `MEM <src>:<line> malloc(<n>) = <ptr>` with parallel forms for
# `calloc(n,size)`, `strdup(p)(n)`, `wcsdup(p)(n)`, `realloc(p,n)` and
# `free(p)`, plus LIMIT, FD, FILE and ADDR records, to the destination named
# by the CURL_MEMDEBUG environment variable).
#
# Default-off because of the analysis in AAP 0.6.6: the harness wraps its
# entire memory check in `if($feature{"TrackMemory"})` and sets that feature
# solely from a `Debug` token in the version banner, so a binary that does not
# advertise `Debug` has all leak and allocation-cap checking skipped. The
# 28 fixtures carrying a `<limits>` block are then inert, and their caps --
# which are caps, not equalities -- cannot fail. The cost is stated openly:
# 98 fixtures require `Debug` and will skip, and `make torture-test` hard-
# requires the feature and is not applicable. This feature exists so that the
# trade can be reversed without redesign should it prove unacceptable.
memdebug = []

# ===========================================================================
# [dev-dependencies] -- deliberately minimal.
#
# The >=80% line-coverage gate on src/protocols/ and src/transfer/
# (AAP 0.8.4) is reached through the dependency injection of AAP 0.3.3 P12 --
# "The resolver, the clock, and the TLS provider are injected rather than
# reached for globally, which is what makes the protocol modules testable
# [...] without live network access" -- and NOT through extra test crates.
#
# No test target directories are declared either: AAP 0.3.1 places Rust
# integration tests in the repository-root tests-rs/ tree, and AAP 0.8.7
# places the relocated tests/unit and tests/libtest coverage in `#[cfg(test)]`
# modules inside src/**.
# ===========================================================================

[dev-dependencies]

# Temporary files and directories for the `#[cfg(test)]` modules that exercise
# the cookie jar, the HSTS and alt-svc caches, and src/protocols/file.rs
# against real paths. AAP 0.5.1 lists this crate as a "Development dependency
# for integration tests".
tempfile = { workspace = true }

# Test-only runtime surface. `macros` supplies `#[tokio::test]`, and
# `test-util` supplies the pausable, advanceable clock that lets the timeout
# and rate-limit paths of src/transfer/ratelimit.rs and the DNS deadline be
# tested deterministically -- the injected clock of AAP 0.3.3 P12. These
# features are additive over the normal-dependency entry above and, under
# resolver 2, are not enabled when building the library itself.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
